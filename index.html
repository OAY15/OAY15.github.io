<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rigframe · 原型 v0.2</title>
<script>
  /* 首屏前先把主题挂到 <html>，避免先画一帧默认色再切 */
  try { var __t = localStorage.getItem("rigframe.theme"); if (__t) document.documentElement.dataset.theme = __t; } catch(e){}
</script>
<style>
  /* ---------------------------------------------------------------
     Rigframe 界面令牌
     方向：剪辑台 / 胶片 / 油性笔。暖石墨中性阶，单一琥珀色强调。
     只用三档文字色，圆角 4/6/10，间距全部落在 4px 网格上。
     --------------------------------------------------------------- */
  :root{
    --font:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
    --mono:ui-monospace,"SF Mono","Cascadia Mono",Consolas,"Liberation Mono",monospace;
  }

  /* ---------------- 主题 ----------------
     adobe  中性灰 + Spectrum 蓝（默认）
     amber  暖石墨 + 琥珀
     mint   初版的薄荷绿
     切换由 <html data-theme="…"> 驱动；画布调色板在脚本的 THEMES 里同步。
     -------------------------------------- */
  :root, html[data-theme="adobe"]{
    --bg:#1b1b1b;
    --surface:#232323;
    --surface-2:#2b2b2b;
    --surface-3:#333333;
    --surface-4:#3d3d3d;
    --line:rgba(255,255,255,.06);
    --line-2:rgba(255,255,255,.12);
    --text:#e4e4e4;
    --text-2:#b3b3b3;
    --text-3:#949494;
    --accent:#2680eb;
    --accent-hover:#3d91f0;
    --accent-ink:#ffffff;
    --accent-soft:rgba(38,128,235,.16);
    --accent-line:rgba(38,128,235,.60);
    --record:#e34850;
    --ok:#2d9d78;
    --stage:#151515;
    --well:#1a1a1a;
    --overlay:rgba(24,24,24,.92);
    --scroll:#454545;
    --scroll-hover:#565656;
    --icon-off:#565656;
    --folder-line:#4a4a4a;
    --sel-tint:rgba(38,128,235,.18);
    --sel-text:#ffffff;
    --tab-idle:#9a9a9a;
    --warn-soft:rgba(227,72,80,.16);
    --warn-line:#a13a3a;
    --warn-text:#ffd7d9;
    --drop-tint:rgba(38,128,235,.08);
    --field-border:rgba(255,255,255,.16);
  }
  html[data-theme="amber"]{
    --bg:#0e0d0c;
    --surface:#151412;
    --surface-2:#1b1a17;
    --surface-3:#232120;
    --surface-4:#2b2825;
    --line:rgba(233,226,213,.07);
    --line-2:rgba(233,226,213,.13);
    --text:#e9e4da;
    --text-2:#a7a196;
    --text-3:#8f8a80;
    --accent:#e0a052;
    --accent-hover:#ecb066;
    --accent-ink:#191307;
    --accent-soft:rgba(224,160,82,.13);
    --accent-line:rgba(224,160,82,.42);
    --record:#c75b45;
    --ok:#7f9e7a;
    --stage:#0b0a09;
    --well:#100f0e;
    --overlay:rgba(12,11,10,.9);
    --scroll:#3a3730;
    --scroll-hover:#45413a;
    --icon-off:#57534b;
    --folder-line:#4a463f;
    --sel-tint:rgba(224,160,82,.16);
    --sel-text:#ffffff;
    --tab-idle:#9a958c;
    --warn-soft:rgba(199,91,69,.16);
    --warn-line:#8c3a3a;
    --warn-text:#ffd9d2;
    --drop-tint:rgba(224,160,82,.06);
    --field-border:rgba(233,226,213,.16);
  }
  html[data-theme="mint"]{
    --bg:#151515;
    --surface:#1c1c1c;
    --surface-2:#242424;
    --surface-3:#2c2c2c;
    --surface-4:#343434;
    --line:rgba(255,255,255,.07);
    --line-2:rgba(255,255,255,.14);
    --text:#e9e9e6;
    --text-2:#8d8d88;
    --text-3:#7c7c76;
    --accent:#5DCAA5;
    --accent-hover:#6fd6b4;
    --accent-ink:#08201a;
    --accent-soft:rgba(93,202,165,.14);
    --accent-line:rgba(93,202,165,.5);
    --record:#E24B4A;
    --ok:#5DCAA5;
    --stage:#0d0d0d;
    --well:#111111;
    --overlay:rgba(10,10,10,.9);
    --scroll:#3f3f3f;
    --scroll-hover:#555555;
    --icon-off:#4e4e4a;
    --folder-line:#4a4a44;
    --sel-tint:rgba(93,202,165,.16);
    --sel-text:#ffffff;
    --tab-idle:#8d8d88;
    --warn-soft:rgba(226,75,74,.16);
    --warn-line:#8c3a3a;
    --warn-text:#ffd7d7;
    --drop-tint:rgba(93,202,165,.07);
    --field-border:rgba(255,255,255,.14);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    background:var(--bg); color:var(--text); overflow:hidden;
    font-family:var(--font); font-size:12px; line-height:1.4;
    -webkit-font-smoothing:antialiased; user-select:none;
  }
  #app{--foot:var(--footBase, 236px); display:grid; grid-template-rows:48px 1fr var(--foot); height:100%}
  #app.propen{--foot:calc(var(--footBase, 236px) + 30px + var(--prh, 136px))}
  @media (max-height:860px){
    #app.propen{--foot:calc(var(--footBase, 236px) + 20px + var(--prh, 110px))}
  }
  footer{position:relative}
  /* 拖这条边调时间轴的屏幕占比 */
  #footResize{
    position:absolute; left:0; right:0; top:-3px; height:6px;
    cursor:ns-resize; z-index:30; background:transparent;
  }
  #footResize:hover, #footResize.dragging{background:var(--accent-soft)}
  #footResize::after{
    content:""; position:absolute; left:50%; top:2px; width:38px; height:2px;
    margin-left:-19px; border-radius:1px; background:var(--line-2);
  }
  #footResize:hover::after{background:var(--accent)}

  /* ---------- 顶栏 ---------- */
  header{
    display:flex; align-items:center; gap:4px; padding:0 12px;
    background:var(--surface); border-bottom:1px solid var(--line);
  }
  .brand{display:flex; align-items:center; gap:9px; font-size:13px; font-weight:500; white-space:nowrap; color:var(--text)}
  .brand .mark{color:var(--accent); display:block; flex:none}
  .brand em{
    font:400 10px/1 var(--mono); color:var(--text-3); letter-spacing:.02em; font-style:normal;
    padding-left:9px; border-left:1px solid var(--line-2);
  }
  .vline{width:1px; height:16px; background:var(--line-2); margin:0 6px; flex:none}
  .spacer{flex:1}

  /* 主题切换：三个色点，点了立即换 */
  #themePick{display:flex; align-items:center; gap:2px; padding:2px; border-radius:4px; background:var(--surface-2); flex:none}
  #themePick .sw{width:22px; height:22px; padding:0; border-radius:3px; border:1px solid transparent}
  #themePick .sw:hover{background:var(--surface-3)}
  #themePick .sw i{width:10px; height:10px; border-radius:2px; display:block; background:currentColor}
  #themePick .sw[data-theme="adobe"]{color:#2680eb}
  #themePick .sw[data-theme="amber"]{color:#e0a052}
  #themePick .sw[data-theme="mint"]{color:#5DCAA5}
  #themePick .sw.on{background:var(--surface-4); border-color:var(--line-2)}

  /* ---------- 控件 ---------- */
  /* 按钮要有"实体感"：默认就带一层比面板亮一档的底 + 细边，
     否则一排纯文字看不出哪里能点。hover 再亮一档，按下最亮。 */
  button{
    height:28px; padding:0 10px; border-radius:4px;
    background:var(--surface-2); border:1px solid var(--line-2); color:var(--text-2);
    font-family:var(--font); font-size:12px; font-weight:400; line-height:1;
    display:inline-flex; align-items:center; justify-content:center; gap:6px;
    cursor:pointer; white-space:nowrap;
    transition:background-color .12s, color .12s, border-color .12s;
  }
  button:hover{background:var(--surface-3); border-color:var(--line-2); color:var(--text)}
  button:active{background:var(--surface-4)}
  button.primary{background:var(--accent); border-color:var(--accent); color:var(--accent-ink); font-weight:500}
  button.primary:hover{background:var(--accent-hover); border-color:var(--accent-hover)}
  button.on{background:var(--accent-soft); border-color:var(--accent-line); color:var(--accent)}
  button.on:hover{background:var(--accent-soft); border-color:var(--accent); color:var(--accent)}
  button.ghost{background:transparent; border-color:transparent; color:var(--text-3)}
  button.ghost:hover{background:var(--surface-2); border-color:transparent; color:var(--text)}
  button.icon{width:28px; padding:0}
  button.mini{height:24px; padding:0 8px; font-size:11px; border-radius:4px}
  button:disabled{opacity:.4; cursor:default; background:var(--surface-2); border-color:var(--line); color:var(--text-3)}
  button:disabled:hover{background:var(--surface-2); color:var(--text-3)}
  button:focus-visible,input:focus-visible,select:focus-visible{outline:1px solid var(--accent); outline-offset:1px}
  .kbd{
    font:400 10px/1 var(--mono); color:var(--text-3); background:var(--surface-3);
    border:1px solid var(--line-2); border-radius:3px; padding:2px 4px;
  }
  #btnSnap .kbd{background:transparent; border-color:transparent; padding:0; color:inherit; opacity:.8}

  input[type=number],input[type=text]{
    background:var(--surface-2); border:1px solid var(--line-2); color:var(--text);
    border-radius:4px; padding:0 6px; height:24px; font-family:var(--font); font-size:11px; width:100%;
  }
  input[type=number]{font-family:var(--mono); font-variant-numeric:tabular-nums}
  input:focus{outline:none; border-color:var(--accent-line); background:var(--surface-3)}
  select{
    background:var(--surface-2); border:1px solid var(--line-2); color:var(--text-2);
    border-radius:4px; padding:0 6px; height:24px; font-family:var(--font); font-size:11px; width:100%;
  }
  select:hover{color:var(--text)}
  input[type=range]{accent-color:var(--accent); height:2px; width:100%}
  input[type=color]{background:transparent; border:1px solid var(--line-2); border-radius:5px; width:28px; height:24px; padding:1px; cursor:pointer}

  /* ---------- 三栏 ---------- */
  main{display:grid; grid-template-columns:264px minmax(0,1fr) 296px; grid-template-rows:1fr; min-height:0}
  aside{background:var(--surface); display:flex; flex-direction:column; min-height:0}
  #layers{border-right:1px solid var(--line)}
  #inspector{border-left:1px solid var(--line)}

  .panel-head{
    display:flex; align-items:center; justify-content:space-between;
    height:36px; padding:0 12px; font-size:11px; color:var(--text-3);
    border-bottom:1px solid var(--line); flex:none;
  }
  .panel-body{overflow-y:auto; flex:1; min-height:0; scrollbar-width:thin; scrollbar-color:var(--scroll) transparent}
  .panel-body::-webkit-scrollbar{width:10px}
  .panel-body::-webkit-scrollbar-track{background:transparent}
  .panel-body::-webkit-scrollbar-thumb{background:var(--scroll); border-radius:5px; border:3px solid var(--surface)}
  .panel-body::-webkit-scrollbar-thumb:hover{background:var(--scroll-hover)}
  .panel-foot{height:40px; padding:0 8px; border-top:1px solid var(--line); display:flex; align-items:center; gap:4px; flex:none}
  .panel-foot button{height:26px; background:var(--surface-2); border-color:var(--line-2); font-size:11px; color:var(--text-2)}
  .panel-foot button:hover{background:var(--surface-3); color:var(--text)}

  /* ---------- 图层 ---------- */
  .layer{
    display:flex; align-items:center; gap:8px; height:34px; padding:0 8px 0 6px;
    cursor:pointer; border-left:2px solid transparent; position:relative;
  }
  .layer:hover{background:var(--surface-2)}
  .layer.sel{background:var(--sel-tint); border-left-color:var(--accent)}
  .layer.drop-top{box-shadow:inset 0 2px 0 var(--accent)}
  .layer.dragging{opacity:.4}
  .layer .chev{width:12px; flex:none; color:var(--text-3); font-size:9px; text-align:center; line-height:1}
  .layer .chev:hover{color:var(--text)}
  .layer .chev-space{width:12px; flex:none}
  .layer.child::before{content:""; position:absolute; left:15px; top:0; bottom:0; width:1px; background:var(--line-2)}
  .layer .thumb{
    width:26px; height:26px; border-radius:4px; background:var(--well); flex:none;
    display:flex; align-items:center; justify-content:center; overflow:hidden;
    border:1px solid var(--line-2); position:relative;
  }
  .layer .thumb img{max-width:100%; max-height:100%; display:block}
  .layer.sel .thumb{border-color:var(--accent-line)}
  .layer.folder .thumb{border-color:var(--folder-line)}
  .layer.folder .thumb::before{
    content:""; position:absolute; left:2px; top:-1px; width:11px; height:3px;
    background:var(--folder-line); border-radius:2px 2px 0 0;
  }
  .layer.folder .lname{font-weight:500}
  .layer .lname{flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; font-size:12px; color:var(--text-2)}
  .layer.sel .lname{color:var(--sel-text)}
  .layer .lname input{font-size:12px; height:22px}
  .layer .tog{
    width:20px; height:20px; border-radius:4px; display:flex; align-items:center; justify-content:center;
    color:var(--text-3); flex:none;
  }
  .layer .tog:hover{background:var(--surface-4); color:var(--text)}
  .layer .tog.off{color:var(--icon-off)}
  .layer .badge{
    font:400 10px/1 var(--mono); color:var(--text-3); background:var(--surface-4);
    padding:3px 4px; border-radius:3px; flex:none; min-width:16px; text-align:center;
  }
  .layer .pin{font-size:10px; color:var(--text-3); flex:none; margin-left:-4px}
  .layer .badge.mask{color:var(--accent); background:var(--accent-soft); border:1px solid var(--accent-line)}
  .lempty{padding:32px 16px; text-align:center; font-size:11px; color:var(--text-3); line-height:1.9}

  /* ---------- 图层资料夹 ---------- */
  .layer.grp{background:var(--surface-3); border-radius:5px; margin:2px 6px; padding-left:7px !important}
  .layer.grp .gicon{
    width:22px; height:22px; flex:none; display:flex; align-items:center; justify-content:center;
    color:var(--folder-line, var(--accent));
  }
  .layer.grp .lname{font-weight:600}
  .layer.grp.drop-into{box-shadow:inset 0 0 0 1px var(--accent)}
  .layer.grp .gdel{width:18px; height:18px; flex:none; display:flex; align-items:center; justify-content:center;
    color:var(--text-3); font-size:13px; border-radius:3px; cursor:pointer}
  .layer.grp .gdel:hover{background:var(--surface-4); color:var(--text)}
  .layer.in-grp{padding-left:20px !important}
  .layer.in-grp::before{content:""; position:absolute; left:15px; top:0; bottom:0; width:1px; background:var(--line-2)}
  .grp-sep{height:1px; background:var(--line-2); margin:6px 10px}

  /* ---------- 素材库 ---------- */
  .assets{display:grid; grid-template-columns:repeat(3,1fr); gap:6px; padding:10px 10px 6px}
  .acell{
    background:var(--surface-2); border:1px solid var(--line-2); border-radius:6px;
    padding:9px 4px 6px; display:flex; flex-direction:column; align-items:center; gap:5px;
    cursor:pointer; transition:border-color .12s, background .12s;
  }
  .acell:hover{border-color:var(--accent-line); background:var(--surface-3)}
  .acell:active{transform:translateY(1px)}
  .acell svg{width:26px; height:26px; color:var(--text-2); display:block}
  .acell:hover svg{color:var(--accent)}
  .acell span{font-size:10px; color:var(--text-3); white-space:nowrap}

  /* ---------- 颜色输入 ---------- */
  input[type="color"]{
    padding:0; width:34px; height:22px; border:1px solid var(--line-2); border-radius:4px;
    background:none; cursor:pointer; flex:none;
  }
  input[type="color"]::-webkit-color-swatch-wrapper{padding:2px}
  input[type="color"]::-webkit-color-swatch{border:none; border-radius:2px}

  /* ---------- 分页 ---------- */
  #layerTabs{
    display:flex; align-items:center; gap:12px; padding:0 10px; height:36px;
    border-bottom:1px solid var(--line); flex:none; background:var(--surface-2);
  }
  #layerTabs .ltab{
    height:36px; display:flex; align-items:center; font-size:12px; color:var(--tab-idle);
    cursor:pointer; border-bottom:2px solid transparent; margin-bottom:-1px;
  }
  #layerTabs .ltab:hover{color:var(--text-2)}
  #layerTabs .ltab.on{color:var(--text); border-bottom-color:var(--accent)}
  #layerTabs .cnt{margin-left:auto; font:400 10px/1 var(--mono); color:var(--text-3)}
  #layerTabs .ladd{
    width:18px; height:18px; flex:none; display:flex; align-items:center; justify-content:center;
    border-radius:4px; color:var(--text-3); font-size:13px; line-height:1; cursor:pointer; margin-left:6px;
  }
  #layerTabs .ladd:hover{background:var(--surface-4); color:var(--text)}

  .tabs{display:flex; height:36px; padding:0 8px; gap:2px; border-bottom:1px solid var(--line); flex:none; background:var(--surface-2)}
  .tab{
    flex:1; display:flex; align-items:center; justify-content:center;
    font-size:12px; color:var(--tab-idle); cursor:pointer;
    border-bottom:2px solid transparent; margin-bottom:-1px;
  }
  .tab:hover{color:var(--text-2)}
  .tab.on{color:var(--text); border-bottom-color:var(--accent)}

  /* ---------- MIDI 条 ---------- */
  #prbar{
    display:flex; align-items:center; gap:8px; padding:0 12px; height:36px;
    border-bottom:1px solid var(--line); flex:none; overflow-x:auto; overflow-y:hidden; min-width:0;
  }
  #prbar::-webkit-scrollbar{height:0}
  #prbar .lbl{font-size:11px; color:var(--text-3); flex:none; white-space:nowrap}
  #prbar select{flex:none}
  #prbar button{height:24px; padding:0 8px; font-size:11px; border-radius:5px}
  #prbar button.on{background:var(--accent-soft); border-color:var(--accent-line); color:var(--accent)}
  #prwrap{flex:none; height:0; overflow:hidden; border-bottom:1px solid var(--line); background:var(--stage)}
  #prwrap.open{height:var(--prh, 136px)}
  @media (max-height:860px){ #prwrap.open{height:var(--prh, 110px)} }
  #pr{display:block; width:100%; height:100%; cursor:default}

  /* ---------- 舞台 ---------- */
  #stage{position:relative; background:var(--stage); overflow:hidden; min-width:0; min-height:0}
  #view{display:block; width:100%; height:100%}
  #hint{position:absolute; left:16px; bottom:12px; font-size:10.5px; color:var(--text-3); line-height:1.6; pointer-events:none; opacity:.7; max-width:70%}
  #drop{
    position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
    flex-direction:column; gap:12px; color:var(--text-3); font-size:12px; text-align:center; line-height:1.9;
    pointer-events:none;
  }
  #drop b{color:var(--text); font-weight:500; font-size:15px}
  #drop.over{background:var(--drop-tint)}
  #drop button{pointer-events:auto; margin-top:8px; background:var(--surface-2); border-color:var(--line-2)}
  #toast{
    position:absolute; left:50%; top:16px; transform:translateX(-50%);
    background:var(--surface-3); color:var(--text); border:1px solid var(--line-2);
    padding:8px 14px; border-radius:4px; font-size:12px;
    opacity:0; transition:opacity .18s; pointer-events:none;
    box-shadow:0 10px 30px rgba(0,0,0,.45);
  }
  #toast.show{opacity:1}
  #dropZone{
    position:fixed; inset:0; z-index:300; display:none;
    align-items:center; justify-content:center; flex-direction:column; gap:8px;
    background:var(--overlay); border:1px dashed var(--accent-line); color:var(--text);
    font-size:14px; pointer-events:none;
  }
  #dropZone.on{display:flex}
  #dropZone small{color:var(--text-3); font-size:11.5px}

  /* ---------- 右键菜单 ---------- */
  #ctxMenu{
    position:fixed; z-index:400; display:none; background:var(--surface-3);
    border:1px solid var(--line-2); border-radius:4px; padding:4px; min-width:148px;
    box-shadow:0 12px 34px rgba(0,0,0,.55);
  }
  #ctxMenu .mi{padding:6px 10px; font-size:12px; border-radius:5px; cursor:pointer; color:var(--text-2); display:flex; justify-content:space-between; gap:18px}
  #ctxMenu .mi:hover{background:var(--surface-4); color:var(--text)}
  #ctxMenu .mi.dim{color:var(--icon-off); pointer-events:none}
  #ctxMenu .mi em{font:400 10px/1 var(--mono); color:var(--text-3)}
  #ctxMenu hr{border:0; border-top:1px solid var(--line-2); margin:4px 2px}

  /* ---------- 弹窗 ---------- */
  #modal,#expModal,#recoverModal{
    position:fixed; inset:0; z-index:500; display:none; align-items:center; justify-content:center;
    background:rgba(0,0,0,.55);
  }
  #modal.show,#expModal.show,#recoverModal.show{display:flex}
  #recoverModal .mbox{
    width:340px; background:var(--surface-2); border:1px solid var(--line-2); border-radius:6px;
    padding:20px; box-shadow:0 24px 64px rgba(0,0,0,.6);
  }
  #recoverModal h3{font-size:13px; font-weight:500; margin-bottom:14px; color:var(--text)}
  #modal .mbox{
    width:320px; background:var(--surface-2); border:1px solid var(--line-2); border-radius:6px;
    padding:20px; box-shadow:0 24px 64px rgba(0,0,0,.6);
  }
  #modal h3,#expModal h3{font-size:13px; font-weight:500; margin-bottom:16px; color:var(--text)}
  #modal input{width:100%; margin-bottom:16px}
  /* 弹窗里的输入控件比弹窗本体亮一档，否则只剩一圈描边 */
  #modal input, #expModal input, #expModal select{
    background:var(--surface-3); border-color:var(--field-border);
  }
  #modal input:focus, #expModal input:focus, #expModal select:focus{border-color:var(--accent); background:var(--surface-4)}
  #modal .mfoot{display:flex; justify-content:flex-end; gap:8px}
  #modal .mfoot button, #expModal .mfoot button{
    background:var(--surface-2); border-color:var(--line-2); color:var(--text-2); min-width:72px;
  }
  #modal .mfoot button:hover, #expModal .mfoot button:hover{background:var(--surface-3); color:var(--text)}
  #modal .mfoot button.primary, #expModal .mfoot button.primary{
    background:var(--accent); border-color:var(--accent); color:var(--accent-ink);
  }
  #modal .mfoot button.primary:hover, #expModal .mfoot button.primary:hover{background:var(--accent-hover); border-color:var(--accent-hover)}
  .card{position:relative}
  .card .del{position:absolute; top:2px; right:4px; font-size:11px; color:var(--text-3); line-height:1; padding:2px; border-radius:3px}
  .card .del:hover{color:var(--record); background:var(--warn-soft)}
  #expModal .mbox{width:380px; background:var(--surface-2); border:1px solid var(--line-2); border-radius:6px; padding:20px; box-shadow:0 24px 64px rgba(0,0,0,.6)}
  .erow{display:flex; align-items:center; gap:12px; margin-bottom:10px}
  .erow label{width:48px; color:var(--text-3); font-size:11px; flex:none}
  .erow select{flex:1}
  .erow .ev{color:var(--text-2); font-size:11px; flex:1; font-family:var(--mono)}
  .ebar{height:2px; background:var(--surface-4); border-radius:2px; overflow:hidden; margin:16px 0 10px}
  .ebar i{display:block; height:100%; width:0; background:var(--accent); transition:width .12s}
  .estat{font-size:11px; color:var(--text-3); margin-bottom:16px; min-height:14px; font-variant-numeric:tabular-nums}

  /* ---------- 检查器 ---------- */
  .sec{padding:16px 14px 6px; font-size:11px; font-weight:500; color:var(--text-3)}
  .sec:first-child{padding-top:12px}
  .row{display:flex; align-items:center; gap:8px; padding:0 14px; height:30px}
  /* 多行输入行：高度自适应，不挤压后面的行 */
  .row.area{height:auto; align-items:stretch; padding:6px 14px 8px}
  .row.area textarea{
    flex:1; width:100%; min-height:56px; max-height:190px; resize:vertical;
    padding:7px 9px; font-size:12px; line-height:1.65; font-family:inherit;
    color:var(--text); background:var(--surface-2);
    border:1px solid var(--line-2); border-radius:6px; outline:none;
    transition:border-color .12s, background .12s;
  }
  .row.area textarea:focus{border-color:var(--accent-line); background:var(--surface-3)}
  .row.area textarea::placeholder{color:var(--text-3)}
  .row>label{width:52px; color:var(--text-2); font-size:11px; flex:none}
  .row .val{width:40px; text-align:right; color:var(--text-2); font-variant-numeric:tabular-nums; font-size:11px; flex:none; font-family:var(--mono)}
  .row input.val{
    width:52px; text-align:right; padding:0 4px; height:22px; font-size:11px;
    background:var(--surface-2); border:1px solid var(--line-2); border-radius:4px; color:var(--text-2);
    font-variant-numeric:tabular-nums; font-family:var(--mono);
  }
  .row input.val:focus{border-color:var(--accent-line); background:var(--surface-3); color:var(--text); outline:none}
  .row .un{font-size:10px; color:var(--text-3); flex:none; width:10px}
  .row .turns{font-size:10px; color:var(--accent); flex:none; white-space:nowrap; font-family:var(--mono)}
  .row button{height:24px; padding:0 8px; font-size:11px; border-radius:5px; background:var(--surface-2); border-color:var(--line-2)}
  .row button:hover{background:var(--surface-3)}
  .row button.on{background:var(--accent-soft); border-color:var(--accent-line); color:var(--accent)}
  /* v2：独立属性轨道 */
  .tracks{display:grid; grid-template-columns:1fr 1fr; gap:4px 8px; padding:2px 14px 10px}
  .tbtn{
    display:flex; align-items:center; gap:5px; height:24px; padding:0 7px;
    background:var(--surface-2); border:1px solid var(--line-2); border-radius:5px;
    color:var(--text-3); font-size:10.5px; cursor:pointer; text-align:left;
  }
  .tbtn:hover{background:var(--surface-3); color:var(--text-2)}
  .tbtn .dot{width:7px; height:7px; border-radius:50%; background:var(--surface-4); flex:none}
  .tbtn.has{color:var(--text-2); border-color:var(--line-2)}
  .tbtn.has .dot{background:var(--accent)}
  .tbtn.on{background:var(--accent-soft); border-color:var(--accent-line); color:var(--accent)}
  .tbtn.on .dot{background:var(--accent); box-shadow:0 0 0 2px var(--accent-soft)}
  .tbtn .cnt{margin-left:auto; font-family:var(--mono); font-size:9.5px; opacity:.7}
  .grid2{display:grid; grid-template-columns:1fr 1fr; gap:4px; padding:0 14px 4px}
  .grid2 button{height:26px; background:var(--surface-2); border-color:var(--line-2); font-size:11px}
  .chk{display:flex; align-items:center; gap:6px; font-size:11px; color:var(--text-2); padding:0 14px; height:28px; cursor:pointer}

  .variants{display:flex; gap:6px; flex-wrap:wrap; padding:0 14px 8px}
  .vitem{
    width:44px; height:44px; border-radius:4px; background:var(--well); border:1px solid var(--line-2);
    display:flex; align-items:center; justify-content:center; cursor:pointer; overflow:hidden; position:relative;
  }
  .vitem img{max-width:100%; max-height:100%}
  .vitem.on{border-color:var(--accent); box-shadow:0 0 0 1px var(--accent)}
  .vitem.add{color:var(--text-3); font-size:16px; border-style:dashed}
  .vitem .vname{position:absolute; bottom:0; left:0; right:0; background:rgba(0,0,0,.62); font-size:9px; text-align:center; color:var(--text-2); overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
  .vitem .vdel{
    position:absolute; top:2px; right:2px; width:16px; height:16px; border-radius:50%;
    background:rgba(30,30,30,.94); border:1px solid var(--line-2); color:var(--text-2); font-size:11px; line-height:14px;
    text-align:center; cursor:pointer; opacity:0; transition:opacity .12s; z-index:2;
  }
  .vitem:hover .vdel{opacity:1}
  .vitem .vdel:hover{background:var(--warn-soft); border-color:var(--warn-line); color:var(--warn-text)}

  .ease-grid{display:grid; grid-template-columns:1fr 1fr 1fr; gap:4px; padding:0 14px 4px}
  .ease-grid button{height:26px; font-size:11px; background:var(--surface-2); border-color:var(--line-2)}
  #curveBox{padding:8px 14px 12px}
  #curve{width:100%; height:126px; background:var(--well); border:1px solid var(--line-2); border-radius:6px; display:block; cursor:crosshair}

  .hintline{padding:0 14px 8px; color:var(--text-3); font-size:11px; line-height:1.65}
  .pad{padding:0 14px 8px}
  .alist{display:flex; flex-direction:column; padding:0 8px 4px}
  .arow{
    display:flex; align-items:center; gap:8px; height:30px; padding:0 6px; border-radius:5px;
    cursor:pointer; font-size:12px; color:var(--text-2);
  }
  .arow:hover{background:var(--surface-2); color:var(--text)}
  .arow .anm{flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
  .arow .atg{font:400 10px/1 var(--mono); color:var(--text-3); flex:none}
  .arow .adel{color:var(--text-3); font-size:12px; line-height:1; padding:2px 3px; border-radius:3px; opacity:0}
  .arow:hover .adel{opacity:1}
  .arow .adel:hover{color:var(--record); background:var(--warn-soft)}

  .cards{display:grid; grid-template-columns:1fr 1fr; gap:6px; padding:8px 14px 12px}
  .card{
    background:var(--surface-2); border:1px solid var(--line-2); border-radius:4px;
    padding:10px 6px; text-align:center; cursor:pointer; font-size:11px; color:var(--text-2);
    transition:background-color .12s, border-color .12s, color .12s;
  }
  .card:hover{background:var(--surface-3); border-color:var(--accent-line); color:var(--text)}
  .card .ico{display:block; font-size:13px; margin-bottom:4px; opacity:.7}

  /* ---------- 底部 ---------- */
  footer{background:var(--surface); border-top:1px solid var(--line); display:flex; flex-direction:column; min-height:0; min-width:0}
  #tlbar{
    display:flex; align-items:center; gap:8px; padding:0 12px; height:44px;
    border-bottom:1px solid var(--line); flex:none; overflow-x:auto; overflow-y:hidden; min-width:0;
  }
  #tlbar::-webkit-scrollbar{height:0}
  #tlbar .t{font:400 12px/1 var(--mono); font-variant-numeric:tabular-nums; color:var(--text); min-width:112px; letter-spacing:.01em}
  #tlbar .t em{font-style:normal; color:var(--text-3)}
  #tlbar .lbl{font-size:11px; color:var(--text-3); flex:none}
  #tlbar .fld{display:flex; align-items:center; gap:6px; flex:none; font-size:11px; color:var(--text-3)}
  #tlbar input[type=number]{width:52px; height:24px}
  #tlbar button{height:26px; padding:0 9px; font-size:11px; border-radius:5px}
  #tlbar button.icon{width:28px; padding:0}
  #tlbar button.on{background:var(--accent-soft); border-color:var(--accent-line); color:var(--accent)}
  #tlbar select{width:112px; flex:none}
  #zoomLabel{color:var(--text-2); font:400 11px/1 var(--mono); min-width:40px; text-align:center; font-variant-numeric:tabular-nums}
  #cueCount{color:var(--text-3); font-size:11px; font-variant-numeric:tabular-nums}
  /* 窄窗口下收紧一点，别让工具栏横向滚动 */
  @media (max-width:1320px){
    #cueCount{display:none}
    #tlbar{gap:6px}
    #tlbar button{padding:0 8px}
  }
  #tlwrap{flex:1; position:relative; min-height:0; min-width:0}
  #tl{display:block; width:100%; height:100%; cursor:default}

  /* 播放 / 暂停 图标互换 */
  #btnPlay .i-pause{display:none}
  #btnPlay.playing .i-play{display:none}
  #btnPlay.playing .i-pause{display:block}
  #btnPlay.playing{color:var(--accent); border-color:var(--accent-line); background:var(--accent-soft)}
  /* 自动记录的状态点 */
  #btnRec .dot{width:6px; height:6px; border-radius:50%; background:currentColor; opacity:.4; flex:none}
  #btnRec.on .dot{background:var(--record); opacity:1}
</style>
</head>
<body>
<div id="app">
  <header>
    <div class="brand">
      <svg class="mark" width="16" height="16" viewBox="0 0 16 16" aria-hidden="true">
        <rect x="1.5" y="2.5" width="13" height="11" rx="1.5" fill="none" stroke="currentColor" stroke-width="1.2"/>
        <path d="M4.6 2.5v11M11.4 2.5v11" stroke="currentColor" stroke-width="1.1" opacity=".55"/>
        <path d="M2.9 5.1h.9M2.9 8h.9M2.9 10.9h.9M12.2 5.1h.9M12.2 8h.9M12.2 10.9h.9" stroke="currentColor" stroke-width="1.1" stroke-linecap="round"/>
      </svg>
      <span>Rigframe</span>
      <em>v0.2</em>
    </div>
    <div class="vline"></div>
    <button id="btnUndo" class="icon" title="撤销  Ctrl+Z" aria-label="撤销">
      <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round">
        <path d="M4 6.2h5.6a3.4 3.4 0 010 6.8H6.2"/><path d="M6.4 3.8L3.9 6.2l2.5 2.4"/>
      </svg>
    </button>
    <button id="btnRedo" class="icon" title="重做  Ctrl+Shift+Z" aria-label="重做">
      <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 6.2H6.4a3.4 3.4 0 000 6.8h3.4"/><path d="M9.6 3.8l2.5 2.4-2.5 2.4"/>
      </svg>
    </button>
    <div class="spacer"></div>
    <div id="themePick" title="界面主题">
      <button class="sw" data-theme="adobe" title="石墨蓝"><i></i></button>
      <button class="sw" data-theme="amber" title="暖琥珀"><i></i></button>
      <button class="sw" data-theme="mint" title="薄荷绿"><i></i></button>
    </div>
    <button id="btnHelp" class="icon" title="使用说明" aria-label="使用说明">
      <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round">
        <circle cx="8" cy="8" r="6.2"/><path d="M6.4 6.3a1.7 1.7 0 113 1.2c-.6.5-1.4.8-1.4 1.7"/><circle cx="8" cy="11.5" r=".75" fill="currentColor" stroke="none"/>
      </svg>
    </button>
    <div class="vline"></div>
    <button id="btnImport">导入分层</button>
    <button id="btnAudio">导入音乐</button>
    <div class="vline"></div>
    <button id="btnLoad">打开工程</button>
    <button id="btnSave">导出工程</button>
    <button id="btnExport" class="primary">导出视频</button>
  </header>

  <main>
    <aside id="layers">
      <div id="layerTabs">
        <div class="ltab on" data-ltab="flat">图层</div>
        <div class="ltab" data-ltab="tree">父子级</div>
        <div class="ltab" data-ltab="assets">素材</div>
        <span class="cnt" id="layerCount"></span>
        <div class="ladd" id="btnAddFolder" title="新建图层资料夹">＋</div>
      </div>
      <div class="panel-body" id="layerList"></div>
      <div class="panel-foot">
        <button id="btnAddTex" style="flex:1">＋ 贴图</button>
        <button id="btnAddText" style="flex:1" title="新建文字图层（文字就是图层，可以变换、打关键帧、导出）">＋ 文字</button>
        <button id="btnDelPart" style="flex:1">删除</button>
      </div>
    </aside>

    <section id="stage">
      <canvas id="view"></canvas>
      <div id="drop">
        <b>把分层 PNG 拖进来</b>
        <div>每个部件一张图，同一部位的不同贴图用 __ 区分<br>建议所有图层按整画布尺寸导出，软件会自动对齐</div>
        <button id="btnDemo">载入示例角色</button>
      </div>
      <div id="hint">拖拽移动 · 四角缩放 · 右下旋转 · 滚轮缩放视图 · 中键平移 · 空格播放</div>
      <div id="toast"></div>
    </section>

    <aside id="inspector">
      <div class="tabs">
        <div class="tab on" data-tab="props">属性</div>
        <div class="tab" data-tab="curve">曲线</div>
        <div class="tab" data-tab="action">动作</div>
        <div class="tab" data-tab="scene">场景</div>
      </div>
      <div class="panel-body" id="inspBody"></div>
    </aside>
  </main>

  <footer>
    <div id="footResize" title="拖动调整时间轴高度"></div>
    <div id="tlbar">
      <button id="btnPlay" class="icon" title="播放 / 暂停  空格" aria-label="播放">
        <svg class="i-play" width="14" height="14" viewBox="0 0 14 14" fill="currentColor"><path d="M4.2 2.4l7 4.6-7 4.6z"/></svg>
        <svg class="i-pause" width="14" height="14" viewBox="0 0 14 14" fill="currentColor"><rect x="3.6" y="2.6" width="2.6" height="8.8" rx=".6"/><rect x="7.8" y="2.6" width="2.6" height="8.8" rx=".6"/></svg>
      </button>
      <div class="t" id="timeLabel">0.00s <em>/ 8.00s</em></div>
      <div class="vline"></div>
      <label class="fld">BPM <input id="bpm" type="number" value="120" min="40" max="240"></label>
      <label class="fld">拍号 <select id="sig" style="width:62px">
        <option value="2/4">2/4</option>
        <option value="3/4">3/4</option>
        <option value="4/4">4/4</option>
        <option value="5/4">5/4</option>
        <option value="6/8">6/8</option>
        <option value="7/8">7/8</option>
        <option value="12/8">12/8</option>
      </select></label>
      <button id="btnSnap" class="on" title="吸附到 1/4 拍">吸附 <span class="kbd" id="snapVal">1/4</span></button>
      <div class="vline"></div>
      <button id="btnRec" class="on" title="自动记录：改属性时在播放头落关键帧（全局）"><span class="dot"></span>自动记录</button>
      <button id="btnKeyFrame" title="在播放头处给当前图层加关键帧">关键帧</button>
      <button id="btnSubMode2" title="开启当前图层的子轨道模式（不可逆）：之后只有各属性轨道上的独立关键帧">子轨道</button>
      <div class="vline"></div>
      <button id="btnCue" title="在播放头处添加卡点">卡点</button>
      <button id="btnTexEvent" title="在播放头处插入贴图切换">贴图事件</button>
      <button id="btnMakeComp3" title="把选中关键帧存为组件">存为组件</button>
      <select id="quickAction" title="在播放头处插入动作组件"></select>
      <div class="spacer"></div>
      <button id="zoomOut" class="icon" title="缩小  Ctrl+滚轮" aria-label="缩小">
        <svg width="12" height="12" viewBox="0 0 12 12" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"><path d="M2.5 6h7"/></svg>
      </button>
      <span id="zoomLabel">100%</span>
      <button id="zoomIn" class="icon" title="放大  Ctrl+滚轮" aria-label="放大">
        <svg width="12" height="12" viewBox="0 0 12 12" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"><path d="M2.5 6h7M6 2.5v7"/></svg>
      </button>
      <button id="zoomFit" title="适应窗口">适应</button>
      <div class="vline"></div>
      <span id="cueCount"></span>
    </div>
    <div id="prbar">
      <button id="btnMidi" title="导入 MIDI 文件（.mid），用音符时间点铺贴图">导入 MIDI</button>
      <span class="lbl" id="midiName">无 MIDI</span>
      <div class="vline"></div>
      <span class="lbl">静音贴图</span>
      <select id="lipDef" style="width:92px" title="音符/卡点之间的空档显示哪张贴图（作用于当前选中图层）"></select>
      <button id="btnMapCue" title="按卡点顺序给当前图层铺贴图切换">按卡点映射</button>
      <button id="btnMapNote" title="把导入的 MIDI 铺成当前图层的钢琴窗音符">按 MIDI 映射</button>
      <button id="btnLipClear" title="删掉当前图层所有贴图关键帧">清除</button>
      <div class="spacer"></div>

      <button id="btnPrToggle" title="展开 / 收起钢琴窗">钢琴窗</button>
    </div>
    <div id="prwrap"><canvas id="pr"></canvas></div>
    <div id="tlwrap"><canvas id="tl"></canvas></div>
  </footer>
</div>

<div id="ctxMenu"></div>
<div id="modal"><div class="mbox">
  <h3 id="modalTitle">命名</h3>
  <input id="modalInput" type="text">
  <div class="mfoot"><button id="modalCancel">取消</button><button id="modalOk" class="primary">确定</button></div>
</div></div>
<div id="recoverModal"><div class="mbox">
  <h3>发现未保存的工程</h3>
  <div id="recoverInfo" style="font-size:11.5px;line-height:1.8;color:var(--text-3);margin-bottom:18px"></div>
  <div class="mfoot"><button id="recoverDrop">丢弃</button><button id="recoverLoad" class="primary">恢复</button></div>
</div></div>
<div id="expModal"><div class="mbox">
  <h3>导出视频</h3>
  <div class="erow" id="expFmtRow" style="display:none"><label>格式</label><select id="expFmt">
    <option value="mp4">MP4 · H.264</option><option value="webm">WebM · VP9</option>
  </select><span class="ev" id="expFmtHint" style="flex:none"></span></div>
  <div class="erow"><label>帧率</label><select id="expFps">
    <option value="24">24 fps</option><option value="30" selected>30 fps</option><option value="60">60 fps</option>
  </select></div>
  <div class="erow"><label>尺寸</label><select id="expScale">
    <option value="1">100%</option><option value="0.75">75%</option><option value="0.5">50%</option>
  </select><span class="ev" id="expPx" style="flex:none;text-align:right;min-width:84px"></span></div>
  <div class="erow"><label>范围</label><input id="expStart" type="number" step="0.1" min="0" style="width:66px"><span style="color:var(--text-3)">→</span><input id="expEnd" type="number" step="0.1" min="0" style="width:66px"><span style="color:var(--text-3);font-size:10.5px">秒</span></div>

const fontOf = id => FONTS.find(f => f.id === id) || FONTS[0];
const fontCssOf = id => fontOf(id).css;
const fontLoaded = new Map();      // id -> "ok" | "fail"
const fontPending = new Map();

function loadFontCss(href){
  return new Promise(res => {
    const l = document.createElement("link");
    l.rel = "stylesheet";
    l.href = href;
    l.onload = () => res(true);
    l.onerror = () => res(false);
    document.head.appendChild(l);
  });
}

/* 用到才加载；返回 Promise<boolean> */
function ensureFont(id){
  const f = fontOf(id);
  if (!f.g) return Promise.resolve(true);
  if (fontLoaded.get(f.id) === "ok") return Promise.resolve(true);
  if (fontPending.has(f.id)) return fontPending.get(f.id);
  const p = (async () => {
    const primary = "https://fonts.googleapis.com/css2?family=" + f.g + "&display=swap";
    let ok = await loadFontCss(primary);
    if (!ok) ok = await loadFontCss(primary.replace("fonts.googleapis.com", "fonts.googleapis.cn"));
    fontLoaded.set(f.id, ok ? "ok" : "fail");
    fontPending.delete(f.id);
    return ok;
  })();
  fontPending.set(f.id, p);
  return p;
}

/* 字体就绪后重绘（含导出前等待） */
async function applyFontAndRedraw(id){
  const ok = await ensureFont(id);
  if (ok){
    try {
      await document.fonts.load('700 96px ' + fontCssOf(id));
      await document.fonts.ready;
    } catch(e){}
  }
  /* 字体换了，文字图层的包围盒要重新量 */
  for (const p of S.parts) if (p.kind === "text" && p.text && p.text.font === id) refreshTextLayer(p);

  return ok;
}

    parts: S.parts.map(p => ({
      ...p,
      bend: p.bend ? p.bend.slice() : null,
      mesh: p.mesh ? { ...p.mesh } : null,
      spring: p.spring ? { ...p.spring } : null,
      base: p.base ? { ...p.base } : null,
      clip: p.clip ? { ...p.clip } : null,
      variants: p.variants.map(v => ({ ...v })),
      notes: (p.notes || []).map(n => ({ ...n })),
      text: p.text ? { ...p.text } : null,
      tracks: JSON.parse(JSON.stringify(p.tracks || {})),
      bendKeys: JSON.parse(JSON.stringify(p.bendKeys || [])),
      rest: p.rest ? { ...p.rest } : null,
      _agg: null
    })),
    midi: S.midi ? { ...S.midi, notes: S.midi.notes.map(n => ({ ...n })), pitches: S.midi.pitches.slice(), chans: S.midi.chans.slice() } : null,
    customActions: ACTION_LIB.filter(a => a.custom).map(a => JSON.parse(JSON.stringify(a))),
    selId: S.selected ? S.selected.id : null
  };
}
/* label 用来告诉用户「这次撤销掉的是什么」，不传就记成「操作」 */
function pushUndo(label){
  markDirty();
  const st = cloneState();
  st.label = label || "操作";
  undoStack.push(st);
  if (undoStack.length > 80) undoStack.shift();
  redoStack.length = 0;
  syncUndoBtns();
}
function beginEdit(label){
  markDirty();
  if (!pending){ pending = cloneState(); pending.label = label || "调整属性"; }
}
function endEdit(){
  if (pending){
    undoStack.push(pending);
    if (undoStack.length > 80) undoStack.shift();
    redoStack.length = 0; pending = null; syncUndoBtns();
  }
}
function restore(st){
  S.doc = { ...st.doc }; S.bg = { ...st.bg }; S.bpm = st.bpm; S.sig = st.sig;
  S.cues = st.cues.slice();
  S.clips = (st.clips || []).map(c => ({ ...c, base: { ...c.base } }));
  S.folders = (st.folders || []).map(f => ({ ...f }));
  if (st.audio && S.audio){
    S.audioStart = st.audio.start || 0;
    S.audioIn = st.audio.in || 0;
    S.audioOut = st.audio.out || 0;
    S.audioOffset = st.audio.offset || 0;
  }
  S.parts = st.parts.map(p => initTracks({
    ...p,
    variants: p.variants.map(v => ({ ...v })),
    notes: (p.notes || []).map(n => ({ ...n })),
    text: p.text ? { ...p.text } : null,
    bend: p.bend ? p.bend.slice() : null,
    mesh: p.mesh ? { ...p.mesh } : null,
    spring: p.spring ? { ...p.spring } : null,
    base: p.base ? { ...p.base } : null,
    clip: p.clip ? { ...p.clip } : null,
    tracks: JSON.parse(JSON.stringify(p.tracks || {})),
    bendKeys: JSON.parse(JSON.stringify(p.bendKeys || [])),
    rest: p.rest ? { ...p.rest } : null,
    _agg: null
  }));
  S.crop = null; cropDrag = null;
  S.selected = st.selId ? S.parts.find(p => p.id === st.selId) || null : null;
  S.midi = st.midi ? { ...st.midi, notes: st.midi.notes.map(n => ({ ...n })), pitches: st.midi.pitches.slice(), chans: st.midi.chans.slice() } : null;
  if (Array.isArray(st.customActions)) setCustomActions(st.customActions);
  markDirty();
  clearSel();
  applyAt(S.beat);
  renderAll();
}

function clearSel(){
  S.selKeys = []; S.selClips = []; S.selCues = [];
  S.selKey = null; S.selectedClip = null;
  setSelNotes([]);
}
function setSelKey(partId, key){
  S.selKey = key ? { partId, t: key.t, key } : null;
}
function selKeyToggle(partId, key, additive){
  if (!additive){ S.selKeys = []; S.selClips = []; S.selectedClip = null; }
  const t = key && key.t !== undefined ? key.t : key;
  const i = S.selKeys.findIndex(s => s.partId === partId && Math.abs(selTime(s) - t) < KEY_EPS);
  if (additive && i >= 0) S.selKeys.splice(i, 1);
  else if (i < 0) S.selKeys.push({ partId, key });
  const last = S.selKeys[S.selKeys.length - 1];
  setSelKey(last ? last.partId : null, last ? last.key : null);
}
function selClipToggle(clip, additive){
  if (!additive){ S.selClips = []; S.selKeys = []; S.selKey = null; }
  const i = S.selClips.indexOf(clip);
  if (additive && i >= 0) S.selClips.splice(i, 1);
  else if (i < 0) S.selClips.push(clip);
  S.selectedClip = S.selClips[0] || null;
}
function hasSel(){ return S.selKeys.length > 0 || S.selClips.length > 0; }
function undo(){
  if (!undoStack.length) return;
  const st = undoStack.pop();
  const now = cloneState(); now.label = st.label;
  redoStack.push(now);
  restore(st);
  syncUndoBtns();
  toast("撤销：" + (st.label || "上一步操作"));
}
function redo(){
  if (!redoStack.length) return;
  const st = redoStack.pop();
  const now = cloneState(); now.label = st.label;
  undoStack.push(now);
  restore(st);
  syncUndoBtns();
  toast("重做：" + (st.label || "上一步操作"));
}
function syncUndoBtns(){
  document.getElementById("btnUndo").disabled = !undoStack.length;
  document.getElementById("btnRedo").disabled = !redoStack.length;
}

/* ============================ 缓动曲线 ============================ */
const EASE_PRESETS = [
  { name: "线性",   p: [0, 0, 1, 1] },
  { name: "缓入",   p: [0.42, 0, 1, 1] },
  { name: "缓出",   p: [0, 0, 0.58, 1] },
  { name: "缓入缓出", p: [0.42, 0, 0.58, 1] },
  { name: "强缓出", p: [0, 0, 0.2, 1] },
  { name: "回弹",   p: [0.34, 1.56, 0.64, 1] },
  { name: "蓄力",   p: [0.68, -0.55, 0.27, 1.55] },
  { name: "阶跃",   p: null },
  { name: "缓入强出", p: [0.7, 0, 0.2, 1] }
];
const DEF_EASE = { p: [0.42, 0, 0.58, 1] };

function bezierY(x, p){
  if (x <= 0) return 0;
  if (x >= 1) return 1;
  const [x1, y1, x2, y2] = p;
  let t = x;
  for (let i = 0; i < 8; i++){
    const mt = 1 - t;
    const bx = 3*mt*mt*t*x1 + 3*mt*t*t*x2 + t*t*t;
    const dx = 3*mt*mt*x1 + 6*mt*t*(x2 - x1) + 3*t*t*(1 - x2);
    if (Math.abs(dx) < 1e-6) break;
    t -= (bx - x) / dx;
    t = clamp(t, 0, 1);
  }
  const mt = 1 - t;
  return 3*mt*mt*t*y1 + 3*mt*t*t*y2 + t*t*t;
}
function easeVal(ease, x){
  if (!ease || !ease.p) return x < 1 ? 0 : 1;
  return bezierY(x, ease.p);
}

/* ============================ 矩阵 ============================ */
function mul(m, n){
  return {
    a: m.a*n.a + m.c*n.b, b: m.b*n.a + m.d*n.b,
    c: m.a*n.c + m.c*n.d, d: m.b*n.c + m.d*n.d,
    e: m.a*n.e + m.c*n.f + m.e, f: m.b*n.e + m.d*n.f + m.f
  };
}
function localMatrix(p){
  const c = Math.cos(p.rot), s = Math.sin(p.rot);
  const fx = p.flipX ? -1 : 1, fy = p.flipY ? -1 : 1;
  return { a:c*p.sx*fx, b:s*p.sx*fx, c:-s*p.sy*fy, d:c*p.sy*fy, e:p.x, f:p.y };
}
function rootMatrix(){ const v = S.view; return { a:v.scale, b:0, c:0, d:v.scale, e:v.ox, f:v.oy }; }
function worldOf(p, seen){
  seen = seen || new Set();
  if (seen.has(p.id)) return rootMatrix();
  seen.add(p.id);
  const par = p.parentId ? S.parts.find(q => q.id === p.parentId) : null;
  const pm = par ? worldOf(par, seen) : rootMatrix();
  return mul(pm, localMatrix(p));
}
function invLinear(m, dx, dy){
  const det = m.a*m.d - m.b*m.c || 1e-6;
  return { x:( m.d*dx - m.c*dy)/det, y:(-m.b*dx + m.a*dy)/det };
}
/* 2D 仿射逆矩阵（含平移） */
function invMatrix(m){
  const det = m.a*m.d - m.b*m.c || 1e-6;
  const ia = m.d/det, ib = -m.b/det, ic = -m.c/det, id = m.a/det;
  return { a: ia, b: ib, c: ic, d: id,
           e: -(ia*m.e + ic*m.f), f: -(ib*m.e + id*m.f) };
}
/* 把「旧父级空间」里的点搬到「新父级空间」的变换 */
function spaceDelta(oldMat, newMat){
  return mul(invMatrix(newMat), oldMat);
}
function mapXY(t, x, y){
  return { x: t.a*x + t.c*y + t.e, y: t.b*x + t.d*y + t.f };
}

/* ============================ 图片工具 ============================ */
function readDataURL(f){ return new Promise(r => { const fr = new FileReader(); fr.onload = () => r(fr.result); fr.readAsDataURL(f); }); }
function loadSrc(src){
  return new Promise((res, rej) => {
    const im = new Image();
    im.onload = () => res(im);
    im.onerror = () => rej(new Error("图片解码失败"));
    im.src = src;
  });
}

const ALPHA = new WeakMap();          // img -> { w, h, a:Uint8Array }，用于透明区域点击穿透
function alphaBBox(img){
  const maxSide = 420;
  const k = Math.min(1, maxSide / Math.max(img.width, img.height));
  const w = Math.max(1, Math.round(img.width * k)), h = Math.max(1, Math.round(img.height * k));
  const c = document.createElement("canvas"); c.width = w; c.height = h;
  const g = c.getContext("2d", { willReadFrequently: true });
  g.drawImage(img, 0, 0, w, h);
  let data;
  try { data = g.getImageData(0, 0, w, h).data; } catch(e){ return { x:0, y:0, w:img.width, h:img.height }; }
  const a = new Uint8Array(w * h);
  for (let i = 0, n = w * h; i < n; i++) a[i] = data[i * 4 + 3];
  ALPHA.set(img, { w, h, a });
  let x0 = w, y0 = h, x1 = -1, y1 = -1;
  for (let y = 0; y < h; y++) for (let x = 0; x < w; x++){
    if (a[y * w + x] > 8){
      if (x < x0) x0 = x; if (x > x1) x1 = x;
      if (y < y0) y0 = y; if (y > y1) y1 = y;
    }
  }
  if (x1 < 0) return { x:0, y:0, w:img.width, h:img.height };
  return { x:x0/k, y:y0/k, w:(x1-x0+1)/k, h:(y1-y0+1)/k };
}
/* 取图像某点的 alpha（u/v 为图像像素坐标）。没有缓存时现场采样一次。 */
function alphaMapOf(img){
  let m = ALPHA.get(img);
  if (m) return m;
  if (!img || !img.width) return null;
  try {
    const maxSide = 300;
    const k = Math.min(1, maxSide / Math.max(img.width, img.height));
    const w = Math.max(1, Math.round(img.width * k)), h = Math.max(1, Math.round(img.height * k));
    const c = document.createElement("canvas"); c.width = w; c.height = h;
    const g = c.getContext("2d", { willReadFrequently: true });
    g.drawImage(img, 0, 0, w, h);
    const d = g.getImageData(0, 0, w, h).data;
    const a = new Uint8Array(w * h);
    for (let i = 0, n = w * h; i < n; i++) a[i] = d[i * 4 + 3];
    m = { w, h, a };
    ALPHA.set(img, m);
    return m;
  } catch(e){ return null; }
}
function makeThumb(img, bb){
  const size = 44;
  const c = document.createElement("canvas"); c.width = size; c.height = size;
  const g = c.getContext("2d");
  const k = Math.min(size / bb.w, size / bb.h);
  const w = bb.w * k, h = bb.h * k;
  g.drawImage(img, bb.x, bb.y, bb.w, bb.h, (size-w)/2, (size-h)/2, w, h);
  return c.toDataURL();
}

/* ============================ 文字图层 ============================ */
let blankCanvas = null;
function blankImg(){
  if (!blankCanvas){
    blankCanvas = document.createElement("canvas");
    blankCanvas.width = 1; blankCanvas.height = 1;
  }
  return blankCanvas;
}

let textMeasureCtx = null;
function textMeasure(){
  if (!textMeasureCtx){
    const c = document.createElement("canvas"); c.width = 8; c.height = 8;
    textMeasureCtx = c.getContext("2d");
  }
  return textMeasureCtx;
}

const TEXT_DEFAULT = {
  str: "双击改文字",
  font: "noto-sans-sc",
  size: 96,
  weight: 700,
  italic: false,
  color: "#ffffff",
  strokeOn: true, strokeColor: "#101010", strokeW: 5,
  shadowOn: false, shadowColor: "#000000", shadowBlur: 14, shadowX: 0, shadowY: 6,
  align: "center",
  lineH: 1.28
};

function textStyleOf(p){ return Object.assign({}, TEXT_DEFAULT, p.text || {}); }
function textLines(p){
  const t = textStyleOf(p);
  return String(t.str === undefined ? "" : t.str).split("\n");
}
function textFontString(t){ return (t.italic ? "italic " : "") + (t.weight || 400) + " " + t.size + "px " + fontCssOf(t.font); }

function measureTextLayer(p){
  const t = textStyleOf(p);
  const g = textMeasure();
  g.font = textFontString(t);
  const lines = textLines(p);
  let w = 0;
  for (const ln of lines) w = Math.max(w, g.measureText(ln || " ").width);
  const lh = t.size * (t.lineH || 1.28);
  return { x: 0, y: 0, w: Math.max(2, w), h: Math.max(2, lines.length * lh) };
}

/* 重算包围盒与轴心，刷新缩略图 */
function refreshTextLayer(p){
  if (!p || p.kind !== "text") return;
  p.text = textStyleOf(p);
  const bb = measureTextLayer(p);
  const it = p.variants[0];
  if (!it) return;
  it.bbox = bb;
  it.ax = bb.x + (p.pu === undefined ? 0.5 : p.pu) * bb.w;
  it.ay = bb.y + (p.pv === undefined ? 0.5 : p.pv) * bb.h;
  p.bbox = bb;
  p.ax = it.ax; p.ay = it.ay;
  it.thumb = makeTextThumb(p);
}

function makeTextThumb(p){
  const size = 44;
  const c = document.createElement("canvas"); c.width = size; c.height = size;
  const g = c.getContext("2d");
  g.fillStyle = "#1c1c1c"; g.fillRect(0, 0, size, size);
  g.fillStyle = "#e8e8e8";
  g.font = "700 22px " + fontCssOf(p.text && p.text.font);
  g.textAlign = "center"; g.textBaseline = "middle";
  g.fillText("字", size / 2, size / 2 + 1);
  return c.toDataURL();
}

/* 以轴心为原点画文字，坐标与贴图图层完全一致 */
function paintText(g, p, it){
  const t = textStyleOf(p);
  const lines = textLines(p);
  const bb = it.bbox;
  const lh = t.size * (t.lineH || 1.28);
  g.font = textFontString(t);
  g.textAlign = t.align === "left" ? "left" : (t.align === "right" ? "right" : "center");
  g.textBaseline = "alphabetic";
  const ox = t.align === "left" ? (bb.x - it.ax)
           : t.align === "right" ? (bb.x + bb.w - it.ax)
           : (bb.x + bb.w / 2 - it.ax);
  const base0 = bb.y - it.ay + t.size * 0.82;

  for (let i = 0; i < lines.length; i++){
    const y = base0 + i * lh;
    if (t.shadowOn){
      g.shadowColor = t.shadowColor;
      g.shadowBlur = t.shadowBlur;
      g.shadowOffsetX = t.shadowX;
      g.shadowOffsetY = t.shadowY;
    }
    if (t.strokeOn && t.strokeW > 0){
      g.lineWidth = t.strokeW * 2;
      g.strokeStyle = t.strokeColor;
      g.lineJoin = "round";
      g.miterLimit = 2;
      g.strokeText(lines[i], ox, y);
      g.shadowColor = "transparent"; g.shadowBlur = 0; g.shadowOffsetX = 0; g.shadowOffsetY = 0;
    }
    g.fillStyle = t.color;
    g.fillText(lines[i], ox, y);
    g.shadowColor = "transparent"; g.shadowBlur = 0; g.shadowOffsetX = 0; g.shadowOffsetY = 0;
  }
}

function addTextLayer(str){
  pushUndo("添加文字图层");

    texIndex: 0, x: S.doc.w / 2, y: S.doc.h / 2, rot: 0, sx: 1, sy: 1, alpha: 1,
    flipX: false, flipY: false,
    ax: 5, ay: 5, pu: 0.5, pv: 0.5, parentId: null, notes: [],
    visible: true, locked: false, bbox: { x: 0, y: 0, w: 10, h: 10 }, clip: null,
    defTex: 0, hue: 0
  };
  initTracks(p);

/* ============================ 部件识别 ============================ */
const SIDE_L = /_l\b|left|左/;
const SIDE_R = /_r\b|right|右/;
function classify(slot){
  const s = slot.toLowerCase();
  if (/head|头|face|脸|面|hair|发|eye|眼|mouth|嘴|brow|眉/.test(s)) return "head";
  if (/arm|手|臂/.test(s)) return SIDE_L.test(s) ? "arm_l" : "arm_r";
  if (/leg|腿|脚|foot/.test(s)) return SIDE_L.test(s) ? "leg_l" : "leg_r";
  return "body";
}
const KIND_ORDER = { body:0, leg_l:1, leg_r:2, arm_l:3, arm_r:4, head:5 };

function makePart(it){
  const bbox = alphaBBox(it.img);
  const cx = bbox.x + bbox.w/2, cy = bbox.y + bbox.h/2;
  const p = {
    id: nid(), slot: it.slot, kind: classify(it.slot),
    variants: [{ variant: it.variant, img: it.img, bbox, ax: cx, ay: cy, thumb: makeThumb(it.img, bbox) }],
    texIndex: 0, x: cx, y: cy, rot: 0, sx: 1, sy: 1, alpha: 1,
    flipX: false, flipY: false,
    ax: cx, ay: cy, pu: 0.5, pv: 0.5, parentId: null, notes: [], visible: true, locked: false, bbox,
    clip: null
  };
  return initTracks(p);
}

function applyPivot(p){
  const u = p.pu === undefined ? 0.5 : p.pu;
  const v = p.pv === undefined ? 0.5 : p.pv;
  for (const it of p.variants){
    const bb = it.bbox;
    it.ax = bb.x + u * bb.w;
    it.ay = bb.y + v * bb.h;
  }
  const cur = p.variants[p.texIndex] || p.variants[0];
  if (cur){ p.ax = cur.ax; p.ay = cur.ay; }
}

async function addItems(items){
  if (!items.length) return;
  pushUndo("添加贴图");
  const imgs = [];
  for (const it of items) imgs.push(Object.assign({}, it, { img: await loadSrc(it.src) }));

  if (!S.parts.length && imgs[0].img.width){
    S.doc = { w: imgs[0].img.width, h: imgs[0].img.height };
  }

  const fresh = new Set();
  for (const it of imgs){
    let p = S.parts.find(q => q.slot === it.slot);
    if (!p){
      p = makePart(it);
      S.parts.push(p);
      fresh.add(p.id);
    } else {
      const bbox = alphaBBox(it.img);
      p.variants.push({
        variant: it.variant, img: it.img, bbox,
        ax: bbox.x + bbox.w/2, ay: bbox.y + bbox.h/2,
        thumb: makeThumb(it.img, bbox)
      });
      applyPivot(p);
    }
  }

  S.parts.sort((a, b) => (KIND_ORDER[a.kind] ?? 9) - (KIND_ORDER[b.kind] ?? 9));
  /* 只给「本次新导入」的图层自动挂到身体上。
     以前遍历所有无父级图层，会把用户手动解绑的图层又绑回去。 */
  const body = S.parts.find(q => q.kind === "body");
  if (body){
    const t = spaceDelta(rootMatrix(), worldOf(body));
    for (const p of S.parts){
      if (!fresh.has(p.id) || p.parentId || p.kind === "body" || p.id === body.id) continue;
      const q = mapXY(t, p.x, p.y);
      p.parentId = body.id;
      p.x = q.x; p.y = q.y;
      syncRest(p, ["x", "y"]);
    }
  }

  fitView();
  syncDropHint();
  if (!S.selected) S.selected = S.parts[0];
  renderAll();
  toast("已导入 " + imgs.length + " 张图层");
}

async function addFiles(files){
  const items = [];
  for (const f of files){
    if (!isImageFile(f)) continue;
    const base = f.name.replace(/\.[^.]+$/, "");
    const bits = base.split("__");
    items.push({ slot: (bits[0] || base).trim(), variant: (bits[1] || "").trim(), src: await readDataURL(f) });
  }
  await addItems(items);
}

async function addTexture(files){
  const p = S.selected;
  if (!p){ toast("先选中一个图层"); return; }
  const items = [];
  for (const f of files){
    if (!isImageFile(f)) continue;
    const base = f.name.replace(/\.[^.]+$/, "");
    const bits = base.split("__");
    items.push({ slot: p.slot, variant: (bits[1] || base).trim(), src: await readDataURL(f) });
  }
  if (!items.length) return;
  pushUndo();
  for (const it of items){
    const img = await loadSrc(it.src);
    const bbox = alphaBBox(img);
    p.variants.push({
      variant: it.variant, img, bbox,
      ax: bbox.x + bbox.w/2, ay: bbox.y + bbox.h/2,
      thumb: makeThumb(img, bbox)
    });
  }
  applyPivot(p);
  syncRest(p, ["x", "y"]);
  renderAll();
  toast("已添加 " + items.length + " 张贴图到「" + p.slot + "」");
}

/* ============================ 视图 ============================ */
function fitView(){
  S.viewAutoFit = false;
  const W = view.clientWidth || 800, H = view.clientHeight || 600;
  const s = Math.min(W / S.doc.w, H / S.doc.h) * 0.88;
  S.view.scale = s;
  S.view.ox = (W - S.doc.w * s) / 2;
  S.view.oy = (H - S.doc.h * s) / 2;
}

/* 可视区尺寸变了（拖时间轴高度 / 窗口缩放）时调用：
   放得下就把画布居中，放不下才等比缩到适应——不会因为变矮就把画面裁掉。 */
function adaptViewToSize(){
  const W = view.clientWidth, H = view.clientHeight;
  if (!W || !H) return;
  const v = S.view;
  const fit = () => Math.min(W / S.doc.w, H / S.doc.h) * 0.92;
  const fw = S.doc.w * v.scale, fh = S.doc.h * v.scale;
  if (fw > W + 1 || fh > H + 1){
    /* 放不下：缩到适应，并记下这次是自动缩的 */
    const k = fit();
    v.scale = k;
    v.ox = (W - S.doc.w * k) / 2;
    v.oy = (H - S.doc.h * k) / 2;
    S.viewAutoFit = true;
  } else {
    /* 空间又够了：如果之前是自动缩小的，还原回去 */
    if (S.viewAutoFit){
      const k = fit();
      if (k > v.scale){ v.scale = k; S.viewAutoFit = false; }
    }
    const fw2 = S.doc.w * v.scale, fh2 = S.doc.h * v.scale;
    v.ox = (W - fw2) / 2;
    v.oy = (H - fh2) / 2;
  }
}

/* ============================ 关键帧 ============================
 * v2：每个属性一条独立轨道（FL Studio 式自动化）。
 *   p.tracks.x = [{ t, v, ease }, ...]   // 只存这一个属性
 *   p.rest     = { x, y, rot, ... }      // 没有轨道时用的静态值（注意 p.base 是发丝摆动用的，别混）
 * p.keys 仍然保留，但它现在是一个「聚合视图」（getter）：
 * 把所有轨道的时间点取并集，合成旧格式的快照数组，
 * 这样时间轴 / 组件 / 复制粘贴这些旧代码不用全部重写。
 */
const TRACK_PROPS = ["x", "y", "rot", "sx", "sy", "alpha", "hue", "tex", "flipX", "flipY"];
const STEP_PROPS = { tex: 1, flipX: 1, flipY: 1 };   // 离散属性不插值
const DEFAULT_EASE = { p: [0.42, 0, 0.58, 1] };
const PROP_LABEL = {
  x: "X 位置", y: "Y 位置", rot: "旋转", sx: "缩放X", sy: "缩放Y",
  alpha: "透明度", hue: "色相", tex: "贴图", flipX: "水平镜像", flipY: "垂直镜像"
};

function emptyTracks(){
  const o = {};
  for (const k of TRACK_PROPS) o[k] = [];
  return o;
}

/* 新图层统一走这里：建空轨道 + 记下静态值 + 挂上 keys 聚合视图 */
function initTracks(p){
  if (!p.tracks) p.tracks = emptyTracks();
  if (!Array.isArray(p.bendKeys)) p.bendKeys = [];
  if (!p.rest) p.rest = {
    x: p.x || 0, y: p.y || 0, rot: p.rot || 0,
    sx: p.sx === undefined ? 1 : p.sx, sy: p.sy === undefined ? 1 : p.sy,
    alpha: p.alpha === undefined ? 1 : p.alpha,
    hue: p.hue || 0, tex: p.texIndex || 0,
    flipX: p.flipX ? 1 : 0, flipY: p.flipY ? 1 : 0
  };
  return defineKeysView(p);
}
/* 从新格式的 tracks 字段导入（工程文件用） */
function importTracks(p, t){
  p.tracks = emptyTracks();
  if (t) for (const k of TRACK_PROPS){
    const src = t[k];
    if (!Array.isArray(src)) continue;
    p.tracks[k] = src.map(e => ({ t: +e.t || 0, v: +e.v || 0, ease: e.ease || null }))
                     .sort((a, b) => a.t - b.t);
  }
  p._agg = null;
}
function ensureTracks(p){
  if (!p.tracks) p.tracks = emptyTracks();
  else for (const k of TRACK_PROPS) if (!Array.isArray(p.tracks[k])) p.tracks[k] = [];
  if (!Array.isArray(p.bendKeys)) p.bendKeys = [];
  if (!p.rest) p.rest = {
    x: p.x || 0, y: p.y || 0, rot: p.rot || 0,
    sx: p.sx === undefined ? 1 : p.sx, sy: p.sy === undefined ? 1 : p.sy,
    alpha: p.alpha === undefined ? 1 : p.alpha,
    hue: p.hue || 0, tex: p.texIndex || 0,
    flipX: p.flipX ? 1 : 0, flipY: p.flipY ? 1 : 0
  };
  return p;
}
function trackOf(p, prop){ ensureTracks(p); return p.tracks[prop]; }

/* ---------- 时间点移动：推挤，不删任何点 ---------- */
const KEY_EPS = 1e-3, SNAP_GRID = 0.25;
const round4 = v => Math.round(v * 10000) / 10000;

/* 把 entry 放进 tr；目标时刻已有点就把占位者沿 dir 推一个网格，连锁到空位 */
function insertWithPush(tr, entry, dir){
  dir = dir >= 0 ? 1 : -1;
  if (dir < 0 && entry.t < SNAP_GRID) dir = 1;   /* 左边界反弹，避免堆在 0 互相顶 */
  let guard = 0;
  while (guard++ < 4096){
    const j = tr.findIndex(e => Math.abs(e.t - entry.t) < KEY_EPS);
    if (j < 0) break;
    const nt = round4(tr[j].t + dir * SNAP_GRID);
    if (nt < 0){ dir = 1; continue; }
    tr[j].t = nt;
    tr.sort((a, b) => a.t - b.t);
  }
  tr.push(entry);
  tr.sort((a, b) => a.t - b.t);
}

/* moves: [{prop, from, to}]，同一图层。先全部摘除，再按方向反序插入，
   这样同批点之间不会互相挡。 */
function moveKeyPoints(p, moves, dir){
  ensureTracks(p);
  const pulled = [], seen = new Set();
  for (const m of moves){
    const id = m.prop + "|" + round4(m.from);
    if (seen.has(id)) continue;
    seen.add(id);
    const tr = p.tracks[m.prop];
    const i = tr.findIndex(e => Math.abs(e.t - m.from) < KEY_EPS);
    if (i < 0) continue;
    const e = tr.splice(i, 1)[0];
    pulled.push({ prop: m.prop, e, to: Math.max(0, round4(m.to)) });
  }
  pulled.sort((a, b) => dir > 0 ? b.to - a.to : a.to - b.to);
  for (const it of pulled){
    it.e.t = it.to;
    insertWithPush(p.tracks[it.prop], it.e, dir);
  }
  p._agg = null;
  return pulled;
}

/* 兼容旧签名：把一个时间点上所有轨道的点整体移动 */
function moveKeyTime(p, oldT, newT, dir){
  if (Math.abs(oldT - newT) < 1e-6) return 0;
  return moveKeyPoints(p,
    TRACK_PROPS.map(prop => ({ prop, from: oldT, to: newT })),
    dir === undefined ? (newT >= oldT ? 1 : -1) : dir);
}

/* 没有轨道的属性，值来自 p.rest。直接改 p.x / p.rot 之类必须同步 p.rest，
   否则下一次 applyAt 会拿旧值覆盖回去（表现为图层弹回原位或飞走）。 */
function syncRest(p, props){
  if (!p || !p.rest) return;
  for (const k of (props || TRACK_PROPS)){
    if (k === "tex") p.rest.tex = p.texIndex;
    else if (k === "flipX" || k === "flipY") p.rest[k] = p[k] ? 1 : 0;
    else p.rest[k] = p[k];
  }
}

/* 在某个属性轨道上写一个点（同一时刻覆盖） */
function setTrackKey(p, prop, beat, value, ease){
  const tr = trackOf(p, prop);
  let v = value;
  if (prop === "flipX" || prop === "flipY") v = value ? 1 : 0;
  const ex = tr.find(e => Math.abs(e.t - beat) < 1e-3);
  if (ex){ ex.v = v; if (ease !== undefined) ex.ease = ease; }
  else { tr.push({ t: beat, v, ease: ease || null }); tr.sort((a, b) => a.t - b.t); }
  p._agg = null;
}
function removeTrackKey(p, prop, beat){
  const tr = trackOf(p, prop);
  const i = tr.findIndex(e => Math.abs(e.t - beat) < 1e-3);
  if (i >= 0){ tr.splice(i, 1); p._agg = null; return true; }
  return false;
}
function trackHasKey(p, prop, beat){
  return trackOf(p, prop).some(e => Math.abs(e.t - beat) < 1e-3);
}

/* ---------- 选择项：统一成 { partId, prop?, t } ---------- */
function selTime(s){ return s.t !== undefined ? s.t : (s.key ? s.key.t : 0); }

/* 把 S.selKeys 展开成真实轨道点；聚合选择（无 prop）展开成该时刻真正有点的属性 */
function selectionToPoints(){
  const out = [], seen = new Set();
  for (const s of S.selKeys){
    const p = S.parts.find(x => x.id === s.partId);
    if (!p) continue;
    ensureTracks(p);
    const t = selTime(s);
    const props = s.prop ? [s.prop] : TRACK_PROPS.filter(k => trackHasKey(p, k, t));
    for (const prop of props){
      const e = p.tracks[prop].find(x => Math.abs(x.t - t) < KEY_EPS);
      if (!e) continue;
      const id = s.partId + "|" + prop + "|" + round4(t);
      if (seen.has(id)) continue;
      seen.add(id);
      out.push({ partId: s.partId, prop, t, v: e.v, ease: e.ease });
    }
  }
  return out;
}

/* 选中判定，替代 s.key === k 的身份比较 */
function isPointSel(p, prop, t){
  return S.selKeys.some(s => s.partId === p.id &&
    Math.abs(selTime(s) - t) < KEY_EPS && (!s.prop || s.prop === prop));
}

function trackPointCount(p){
  ensureTracks(p);
  return TRACK_PROPS.reduce((n, k) => n + p.tracks[k].length, 0);
}
function clearAllTracks(p){
  p.tracks = emptyTracks();
  p._agg = null;
}
/* 开启子轨道模式：不可逆。开启后该图层没有「总关键帧」，只有子轨道点。 */
function enableSubMode(p){
  if (!p || p.subMode) return;
  const NL = String.fromCharCode(10);
  const ok = confirm([
    "开启「子轨道模式」后：",
    "",
    "· 这个图层不再有「总关键帧」，时间轴主行只显示动作片段",
    "· 只有各属性子轨道上的点，每个点都是独立关键帧",
    "· 可单独选中 / 拖动 / 删除 / 调曲线 / 存为组件",
    "",
    "此操作不可撤销，无法退回聚合模式。建议先保存工程。",
    "",
    "确定开启吗？"
  ].join(NL));
  if (!ok) return;
  p.subMode = true;
  S.expandTracks[p.id] = true;
  /* 给历史撤销项打戳，保证撤销也回不到聚合模式 */
  for (const st of undoStack) for (const q of (st.parts || [])) if (q.id === p.id) q.subMode = true;
  for (const st of redoStack) for (const q of (st.parts || [])) if (q.id === p.id) q.subMode = true;
  clearSel();
  renderAll();
  toast("「" + p.slot + "」已进入子轨道模式（不可逆）");
}

/* 按图层分组逐点删除（替代 p.keys = filter 的有损往返） */
function removePoints(list){
  const byPart = new Map();
  for (const it of list){
    if (!byPart.has(it.partId)) byPart.set(it.partId, []);
    byPart.get(it.partId).push(it);
  }
  for (const [partId, arr] of byPart){
    const p = S.parts.find(x => x.id === partId);
    if (!p) continue;
    for (const it of arr) removeTrackKey(p, it.prop, it.t);
    p._agg = null;
  }
}

/* 连续属性：线性 + 缓动插值 */
function evalTrackAt(track, beat, dflt){
  if (!track || !track.length) return dflt;
  let a = track[0], b = track[track.length - 1];
  if (beat <= a.t) return a.v;
  if (beat >= b.t) return b.v;
  for (let i = 0; i < track.length - 1; i++){
    if (track[i].t <= beat && beat <= track[i + 1].t){ a = track[i]; b = track[i + 1]; break; }
  }
  const span = b.t - a.t;
  const raw = span > 1e-6 ? (beat - a.t) / span : 0;
  const t = easeVal(a.ease || DEFAULT_EASE, clamp(raw, 0, 1));
  return a.v + (b.v - a.v) * t;
}
/* 离散属性：阶梯 */
function evalTrackStep(track, beat, dflt){
  if (!track || !track.length) return dflt;
  let v = track[0].v;
  for (const e of track){
    if (e.t <= beat + 1e-6) v = e.v;
    else break;
  }
  return v;
}
/* 精确取值（只用于把轨道还原成快照，不做插值） */
function evalTrackRaw(track, beat, dflt){
  if (!track || !track.length) return dflt;
  for (const e of track) if (Math.abs(e.t - beat) < 1e-3) return e.v;
  let v = track[0].v;
  for (const e of track){
    if (e.t <= beat + 1e-6) v = e.v;
    else break;
  }
  return v;
}

/* 把轨道聚合成旧格式的快照数组（时间点取并集） */
function aggKeys(p){
  ensureTracks(p);
  const set = new Set();
  for (const k of TRACK_PROPS) for (const e of p.tracks[k]) set.add(Math.round(e.t * 1000) / 1000);
  const ts = [...set].sort((a, b) => a - b);
  return ts.map(t => {
    const snap = { t, ease: null };
    for (const k of TRACK_PROPS){
      const tr = p.tracks[k];
      const d = p.rest ? p.rest[k] : (k === "sx" || k === "sy" || k === "alpha" ? 1 : 0);
      const v = evalTrackRaw(tr, t, d);
      if (k === "tex") snap.tex = Math.round(v);
      else if (k === "flipX" || k === "flipY") snap[k] = v >= 0.5;
      else snap[k] = v;
    }
    /* 缓动取任一轨道在该点的值（旧代码按快照的 ease 插值） */
    for (const k of TRACK_PROPS){
      const tr = p.tracks[k];
      const e = tr.find(x => Math.abs(x.t - t) < 1e-3);
      if (e && e.ease){ snap.ease = e.ease; break; }
    }
    return snap;
  });
}

/* 批量写快照（旧工程 / 发丝烘焙）。bend 单独存进 p.bendKeys，不再被丢弃。 */
function writeSnapshots(p, snaps){
  ensureTracks(p);
  p.tracks = emptyTracks();
  p.bendKeys = [];
  for (const s of snaps){
    for (const k of TRACK_PROPS){
      if (s[k] === undefined) continue;
      let v = s[k];
      if (k === "flipX" || k === "flipY") v = v ? 1 : 0;
      p.tracks[k].push({ t: s.t, v, ease: s.ease || null });
    }
    if (Array.isArray(s.bend)) p.bendKeys.push({ t: s.t, bend: s.bend.slice() });
  }
  for (const k of TRACK_PROPS) p.tracks[k].sort((a, b) => a.t - b.t);
  p.bendKeys.sort((a, b) => a.t - b.t);
  p._agg = null;
}
function importSnapshots(p, snaps){ writeSnapshots(p, snaps); }

/* p.keys 作为聚合视图挂到图层上 */
function defineKeysView(p){
  if (Object.getOwnPropertyDescriptor(p, "keys")) return p;
  Object.defineProperty(p, "keys", {
    configurable: true,
    enumerable: false,
    get(){
      if (!p._agg) p._agg = aggKeys(p);
      return p._agg;
    },
    set(v){
      importSnapshots(p, Array.isArray(v) ? v : []);
    }
  });
  return p;
}

function keySnapshot(p, beat, patch){
  const k = { t: beat, x:p.x, y:p.y, rot:p.rot, sx:p.sx, sy:p.sy, alpha:p.alpha, hue: p.hue || 0, tex:p.texIndex,
              flipX: !!p.flipX, flipY: !!p.flipY,
              ease: { p: [0.42, 0, 0.58, 1] } };
  if (p.bend && p.bend.length) k.bend = p.bend.slice();
  if (patch) Object.assign(k, patch);
  return k;
}
/* 在 beat 处打点。patch 里出现过的属性才打，其余轨道不动。
   不传 patch = 当前所有属性各打一份（旧行为，保留给组件/粘贴用）。 */
function upsertKey(p, beat, patch){
  ensureTracks(p);
  const write = k => {
    const v = k === "tex" ? p.texIndex : (k === "flipX" || k === "flipY" ? (p[k] ? 1 : 0) : p[k]);
    setTrackKey(p, k, beat, v);
  };
  if (patch){
    for (const k of TRACK_PROPS) if (patch[k] !== undefined) write(k);
    if (patch.ease){
      for (const k of TRACK_PROPS){
        if (patch[k] === undefined) continue;
        const e = p.tracks[k].find(x => Math.abs(x.t - beat) < 1e-3);
        if (e) e.ease = patch.ease;
      }
    }
  } else {
    for (const k of TRACK_PROPS) write(k);
  }
  applyAt(S.beat);
}
function touchForce(p, prop){
  ensureTracks(p);
  if (prop){
    const v = prop === "tex" ? p.texIndex : (prop === "flipX" || prop === "flipY" ? (p[prop] ? 1 : 0) : p[prop]);
    setTrackKey(p, prop, S.beat, v);
    return;
  }
  for (const k of TRACK_PROPS){
    const v = k === "tex" ? p.texIndex : (k === "flipX" || k === "flipY" ? (p[k] ? 1 : 0) : p[k]);
    setTrackKey(p, k, S.beat, v);
  }
}
function touch(p, prop){
  /* 自动记录关掉后，只有「播放头正好停在选中的那个关键帧上」才更新它，
     否则在别处改属性会凭空多出一个关键帧。 */
  const selThis = S.selKey && S.selKey.partId === p.id &&
                  Math.abs(S.selKey.t - S.beat) < 1e-3;
  if (!S.record && !selThis){
    /* 不记录关键帧时，改动就是新的静态值，必须写回 p.rest，
       否则下一次 applyAt 会拿旧值把它覆盖掉。 */
    syncRest(p, prop ? [prop] : null);
    return;
  }
  touchForce(p, prop);
}

function clipValueAt(clip, beat){
  const a = ACTION_LIB.find(x => x.id === clip.actionId);
  if (!a || !a.keys.length) return null;
  const ks = a.keys;
  const span = ks[ks.length - 1].t || 0.25;
  const k = (beat - clip.start) / Math.max(0.001, clip.dur);
  if (k < -0.001 || k > 1.001) return null;
  const tt = clamp(k, 0, 1) * span;

  let i0 = 0;
  for (let i = 0; i < ks.length - 1; i++){
    if (ks[i].t <= tt && tt <= ks[i + 1].t){ i0 = i; break; }
    i0 = i;
  }
  const A = ks[i0], B = ks[Math.min(i0 + 1, ks.length - 1)];
  const seg = B.t - A.t;
  const raw = seg > 1e-6 ? (tt - A.t) / seg : 0;
  const e = A.ease !== undefined ? A.ease : { p: [0.42, 0, 0.58, 1] };
  const t = easeVal(e, clamp(raw, 0, 1));

  const get = (key, dflt) => {
    const av = A[key] !== undefined ? A[key] : dflt;
    const bv = B[key] !== undefined ? B[key] : av;
    return av + (bv - av) * t;
  };
  const base = clip.base;
  const ck = clip.k || 1;
  const rel = !!a.rel;
  const hasSx = A.sx !== undefined || B.sx !== undefined;
  const hasSy = A.sy !== undefined || B.sy !== undefined;
  const hasAl = A.alpha !== undefined || B.alpha !== undefined;
  const sxf = hasSx ? get("sx", 1) : 1;
  const syf = hasSy ? get("sy", 1) : 1;
  const alf = hasAl ? get("alpha", 1) : 1;

  /* v2：只返回组件里出现过的属性，没出现的保持 undefined —— 这样多个组件
     可以同时叠在一个图层上，各管各的属性，互不覆盖。 */
  const has = k => A[k] !== undefined || B[k] !== undefined;
  const out = {};
  if (has("x")) out.x = base.x + get("x", 0) * ck;
  if (has("y")) out.y = base.y + get("y", 0) * ck;
  if (has("rot")) out.rot = base.rot + get("rot", 0);
  if (hasSx) out.sx = rel ? base.sx * sxf : sxf * ck;
  if (hasSy) out.sy = rel ? base.sy * syf : syf * ck;
  if (hasAl) out.alpha = rel ? base.alpha * alf : alf;
  if (has("hue")) out.hue = base.hue;
  if (has("tex")) out.tex = t < 0.5
    ? (A.tex !== undefined ? A.tex : base.tex)
    : (B.tex !== undefined ? B.tex : base.tex);
  return out;
}

function activeClipFor(p, beat){
  return S.clips.find(c => c.partId === p.id && beat >= c.start - 1e-6 && beat <= c.start + c.dur + 1e-6) || null;
}

function applyFlip(p, beat, clip){
  /* 只有片段显式带了镜像才接管；否则单属性组件（如只含 rot）会把镜像轨道清掉 */
  if (clip && clip.flipX !== undefined){
    p.flipX = !!clip.flipX;
    p.flipY = !!clip.flipY;
    return;
  }
  ensureTracks(p);
  p.flipX = evalTrackStep(p.tracks.flipX, beat, p.rest.flipX) >= 0.5;
  p.flipY = evalTrackStep(p.tracks.flipY, beat, p.rest.flipY) >= 0.5;
}

function applyAt(beat){
  for (const p of S.parts){
    /* 同一时刻可能有多个片段（不同组件），各自只管自己带的属性 */
    const clips = S.clips.filter(c => c.partId === p.id &&
      beat >= c.start - 1e-6 && beat <= c.start + c.dur + 1e-6);
    applyFlip(p, beat, clips[0] || null);
    /* v2：每个属性从自己的轨道取值，互不干扰。
       没有轨道的属性直接用 base（静态值）。 */
    ensureTracks(p);
    const T = p.tracks, B = p.rest;
    p.x = T.x.length ? evalTrackAt(T.x, beat, B.x) : B.x;
    p.y = T.y.length ? evalTrackAt(T.y, beat, B.y) : B.y;
    p.rot = T.rot.length ? evalTrackAt(T.rot, beat, B.rot) : B.rot;
    p.sx = T.sx.length ? evalTrackAt(T.sx, beat, B.sx) : B.sx;
    p.sy = T.sy.length ? evalTrackAt(T.sy, beat, B.sy) : B.sy;
    p.alpha = T.alpha.length ? evalTrackAt(T.alpha, beat, B.alpha) : B.alpha;
    p.hue = T.hue.length ? evalTrackAt(T.hue, beat, B.hue) : B.hue;
    p.texIndex = clamp(Math.round(T.tex.length ? evalTrackStep(T.tex, beat, B.tex) : B.tex), 0, p.variants.length - 1);

    /* 片段覆盖：叠在轨道结果之上，每个组件只改自己带了的属性。
       所以「点头」组件只动旋转、「眨眼」组件只动贴图，两者能同时生效。 */
    for (const c of clips){
      const v = clipValueAt(c, beat);
      if (!v) continue;
      if (v.x !== undefined) p.x = v.x;
      if (v.y !== undefined) p.y = v.y;
      if (v.rot !== undefined) p.rot = v.rot;
      if (v.sx !== undefined) p.sx = v.sx;
      if (v.sy !== undefined) p.sy = v.sy;
      if (v.alpha !== undefined) p.alpha = v.alpha;
      if (v.hue !== undefined) p.hue = v.hue;
      if (v.tex !== undefined) p.texIndex = clamp(Math.round(v.tex), 0, p.variants.length - 1);
    }

    /* 网格形变没有独立轨道，仍然按聚合快照插值（用得少，开销可接受） */
    if (p.bend && p.bend.length && p.bendKeys && p.bendKeys.length){
      const ks = p.bendKeys;
      let a = ks[0], b = ks[ks.length - 1];
      if (beat <= a.t) b = a;
      else if (beat >= b.t) a = b;
      else for (let i = 0; i < ks.length - 1; i++){
        if (ks[i].t <= beat && beat <= ks[i + 1].t){ a = ks[i]; b = ks[i + 1]; break; }
      }
      const span = b.t - a.t;
      const raw = span > 1e-6 ? (beat - a.t) / span : 0;
      const t = easeVal(a.ease, clamp(raw, 0, 1));
      const A = a.bend || [], Bb = b.bend || [];
      for (let i = 0; i < p.bend.length; i++){
        const av = A[i] || 0, bv = Bb[i] === undefined ? av : Bb[i];
        p.bend[i] = av + (bv - av) * t;
      }
    }
  }
}

/* ============================ 绘制 ============================ */
function drawBackground(gc, forExport){
  gc = gc || ctx;
  const v = S.view, d = S.doc;
  const x = v.ox, y = v.oy, w = d.w * v.scale, h = d.h * v.scale;
  const bg = S.bg;
  if (bg.type === "color"){
    gc.fillStyle = bg.color;
    gc.fillRect(x, y, w, h);
  } else if (bg.type === "gradient"){
    const rad = (bg.angle - 90) * Math.PI / 180;
    const cx = x + w/2, cy = y + h/2;
    const len = (Math.abs(w * Math.cos(rad)) + Math.abs(h * Math.sin(rad))) / 2;
    const gr = gc.createLinearGradient(cx - Math.cos(rad)*len, cy - Math.sin(rad)*len,
                                       cx + Math.cos(rad)*len, cy + Math.sin(rad)*len);
    gr.addColorStop(0, bg.c1); gr.addColorStop(1, bg.c2);
    gc.fillStyle = gr;
    gc.fillRect(x, y, w, h);
  } else if (bg.type === "image" && bg.img){
    const iw = bg.img.width, ih = bg.img.height;
    const k = Math.max(w / iw, h / ih);
    gc.save();
    gc.beginPath(); gc.rect(x, y, w, h); gc.clip();
    gc.drawImage(bg.img, cx0(x, w, iw, k), cx0(y, h, ih, k), iw*k, ih*k);
    gc.restore();
  } else if (forExport){
    gc.fillStyle = "#000";
    gc.fillRect(x, y, w, h);
  } else {
    const cell = 10;
    for (let i = 0; i * cell < w; i++) for (let j = 0; j * cell < h; j++){
      gc.fillStyle = ((i + j) % 2) ? TH.checkerA : TH.checkerB;
      gc.fillRect(x + i*cell, y + j*cell, Math.min(cell, w - i*cell), Math.min(cell, h - j*cell));
    }
  }
}
function cx0(origin, span, nat, k){ return origin + (span - nat*k) / 2; }

/* ---------- 网格变形绘制 ---------- */
function drawBent(g, p, it){
  const bb = it.bbox, n = p.bend.length;
  if (n < 1) return;
  const segH = bb.h / n;
  const x0 = bb.x + bb.w/2 - it.ax;
  const y0 = bb.y - it.ay;
  const ov = Math.min(segH * 0.6, 3);     // 关节重叠，盖住楔形缝
  const top = bb.y, bottom = bb.y + bb.h;

  // 先算出每个关节的位置和累计角度（局部坐标，原点在链起点）
  const jx = new Float64Array(n + 1), jy = new Float64Array(n + 1), acc = new Float64Array(n + 1);
  let a = 0;
  for (let k = 0; k < n; k++){
    a += p.bend[k] || 0;
    acc[k + 1] = a;
    jx[k + 1] = jx[k] - Math.sin(a) * segH;
    jy[k + 1] = jy[k] + Math.cos(a) * segH;
  }

  g.save();
  g.translate(x0, y0);
  for (let k = 0; k < n; k++){
    const segTop = bb.y + k * segH;
    const sy0 = Math.max(top, segTop - ov);
    const sy1 = Math.min(bottom, segTop + segH + ov);
    const sh = sy1 - sy0;
    if (sh <= 0.4) continue;

    // 用「上一段角度 + 本段角度」的平均值来画，并把切片居中在段中点：
    // 关节两侧各差一半，接缝的台阶减半，明显更顺
    const mid = (acc[k] + acc[k + 1]) / 2;
    const cx = (jx[k] + jx[k + 1]) / 2;
    const cy = (jy[k] + jy[k + 1]) / 2;

    g.save();
    g.translate(cx, cy);
    g.rotate(mid);
    g.drawImage(it.img, bb.x, sy0, bb.w, sh, -bb.w/2, (sy0 - segTop) - segH/2, bb.w, sh);
    g.restore();
  }
  g.restore();
}

function paintPart(g, p, it, m){
  g.save();
  g.transform(m.a, m.b, m.c, m.d, m.e, m.f);
  g.globalAlpha = clamp(p.alpha, 0, 1);
  if (p.hue) g.filter = "hue-rotate(" + (p.hue % 360) + "deg)";
  if (p.kind === "text") paintText(g, p, it);
  else if (p.mesh && p.mesh.on && p.bend && p.bend.length) drawBent(g, p, it);
  else g.drawImage(it.img, -it.ax, -it.ay);
  g.restore();
}
