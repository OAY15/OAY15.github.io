        const v = k === "tex" ? p.texIndex : (k === "flipX" || k === "flipY" ? (p[k] ? 1 : 0) : p[k]);
        setTrackKey(p, k, at, v);
      }
      applyAt(S.beat);
      renderAll();
      toast((had ? "已删除「" : "已打点「") + PROP_LABEL[k] + "」");
    };
  });
  bind("fName", "change", e => { pushUndo(); p.slot = e.target.value.trim() || p.slot; renderAll(); });
  bind("fParent", "change", e => { setParent(p.id, e.target.value || null); });
  const bfx = document.getElementById("btnFixPos");
  if (bfx) bfx.onclick = () => fixPositionSpace(p);

  /* 资料夹归属 */
  const ff = document.getElementById("fFolder");
  if (ff) ff.onchange = e => { moveToFolder(p.id, e.target.value || null); };

  /* 图形参数 */
  if (p.shape){
    const sh = p.shape;
    const commit = () => { scheduleShapeRebuild(p); renderInspector(); };
    const onNum = (id, key, lo, hi, scale) => {
      const el = document.getElementById(id);
      if (!el) return;
      el.onchange = () => {
        let v = +el.value;
        if (scale) v = v / scale;
        if (!isFinite(v)) return;
        pushUndo("调整图形");
        sh[key] = clamp(v, lo, hi);
        commit();
      };
    };
    const onColor = (id, key) => {
      const el = document.getElementById(id);
      if (!el) return;
      el.onchange = () => {
        pushUndo("调整图形");
        sh[key] = el.value;
        commit();
      };
    };
    const st = document.getElementById("shType");
    if (st) st.onchange = () => {
      pushUndo("切换形状");
      sh.type = st.value;
      p.slot = SHAPE_NAME[sh.type] || p.slot;
      commit();
      renderLayers();
    };
    onNum("shW", "w", 4, 4000);
    onNum("shH", "h", 4, 4000);
    onNum("shStrokeW", "strokeW", 0, 200);
    onNum("shPoints", "points", 3, 24);
    onNum("shSides", "sides", 3, 24);
    onNum("shRadius", "radius", 0, 800);
    onNum("shInner", "inner", 8, 95, 100);
    onNum("shThick", "thick", 4, 90, 100);
    onColor("shFill", "fill");
    onColor("shStroke", "stroke");
    const fOn = document.getElementById("shFillOn");
    if (fOn) fOn.onchange = () => {
      pushUndo("调整图形");
      sh.fillOn = fOn.checked;
      /* 中空又没描边会看不见，自动补一条描边 */
      if (!sh.fillOn && !sh.strokeOn){ sh.strokeOn = true; toast("中空需要描边，已自动打开描边"); }
      commit();
    };
    const sOn = document.getElementById("shStrokeOn");
    if (sOn) sOn.onchange = () => {
      pushUndo("调整图形");
      sh.strokeOn = sOn.checked;
      if (!sh.strokeOn && !sh.fillOn){ sh.fillOn = true; toast("没有描边时必须有填充，已自动打开填充"); }
      commit();
    };
  }

  /* ---- 文字图层绑定 ---- */
  if (isText){
    const live = () => { refreshTextLayer(p); applyAt(S.beat); draw(); drawTimeline(); renderLayers(); };
    bind("tStr", "input", e => { beginEdit(); p.text.str = e.target.value; live(); });
    bind("tStr", "change", () => { endEdit(); renderInspector(); });
    bind("tFont", "change", async e => {
      pushUndo();
      p.text.font = e.target.value;
      const f = fontOf(p.text.font);
      const ok = await applyFontAndRedraw(p.text.font);
      refreshTextLayer(p); applyAt(S.beat); renderAll();
      toast(ok ? ("字体 →「" + f.name + "」") : ("「" + f.name + "」没加载出来，先用系统字体顶着"));
    });
    bind("tSize", "input", e => { beginEdit(); p.text.size = clamp(+e.target.value || 12, 4, 800); live(); });
    bind("tSize", "change", () => { endEdit(); renderInspector(); });
    bind("tWeight", "change", e => { pushUndo(); p.text.weight = +e.target.value; live(); });
    bind("tColor", "input", e => { beginEdit(); p.text.color = e.target.value; draw(); });
    bind("tColor", "change", endEdit);
    bind("tAlign", "change", e => { pushUndo(); p.text.align = e.target.value; live(); });
    bind("tLineH", "input", e => {
      beginEdit();
      p.text.lineH = clamp((+e.target.value || 128) / 100, 0.8, 2.2);
      const v = document.getElementById("vLineH"); if (v) v.textContent = p.text.lineH.toFixed(2);
      live();
    });
    bind("tLineH", "change", endEdit);
    const itBtn = document.getElementById("tItalic");
    if (itBtn) itBtn.onclick = () => { pushUndo(); p.text.italic = !p.text.italic; live(); renderInspector(); };
    const fitBtn = document.getElementById("tFit");
    if (fitBtn) fitBtn.onclick = () => {
      pushUndo();
      const bb = measureTextLayer(p);
      if (bb.w > 0){
        p.text.size = clamp(Math.round(p.text.size * (S.doc.w * 0.8) / bb.w), 4, 800);
        live(); renderInspector();
        toast("字号已调成 " + p.text.size + "px");
      }
    };
    const stOn = document.getElementById("tStrokeOn");
    if (stOn) stOn.onclick = () => { pushUndo(); p.text.strokeOn = !p.text.strokeOn; live(); renderInspector(); };
    bind("tStrokeColor", "input", e => { beginEdit(); p.text.strokeColor = e.target.value; draw(); });
    bind("tStrokeColor", "change", endEdit);
    bind("tStrokeW", "input", e => { beginEdit(); p.text.strokeW = clamp(+e.target.value || 0, 0, 40); draw(); });
    bind("tStrokeW", "change", endEdit);
    const shOn = document.getElementById("tShadowOn");
    if (shOn) shOn.onclick = () => { pushUndo(); p.text.shadowOn = !p.text.shadowOn; live(); renderInspector(); };
    bind("tShadowColor", "input", e => { beginEdit(); p.text.shadowColor = e.target.value; draw(); });
    bind("tShadowColor", "change", endEdit);
    bind("tShadowBlur", "input", e => { beginEdit(); p.text.shadowBlur = clamp(+e.target.value || 0, 0, 60); draw(); });
    bind("tShadowBlur", "change", endEdit);
  }

  bind("clipSrc", "change", e => {
    pushUndo();
    const v = e.target.value;
    p.clip = v ? { srcId: v, invert: p.clip ? !!p.clip.invert : false } : null;
    draw(); renderLayers(); renderInspector();
    toast(v ? ("「" + p.slot + "」改由「" + (S.parts.find(q => q.id === v) || {}).slot + "」裁剪")
            : ("已取消「" + p.slot + "」的蒙版"));
  });
  const clipInvBtn = document.getElementById("clipInv");
  if (clipInvBtn) clipInvBtn.onclick = () => {
    if (!p.clip || !p.clip.srcId) return;
    pushUndo();
    p.clip.invert = !p.clip.invert;
    draw(); renderInspector();
  };
  bind("fX", "input", e => { beginEdit("调整 X 位置"); p.x = +e.target.value; touch(p, "x"); draw(); });
  bind("fX", "change", endEdit);
  bind("fY", "input", e => { beginEdit("调整 Y 位置"); p.y = +e.target.value; touch(p, "y"); draw(); });
  bind("fY", "change", endEdit);
  // 滑块 ↔ 数字框 双向绑定：数字框可直接键入，滑块跟随
  const numBind = (id, apply, toSlider, prop) => {
    const sl = document.getElementById("f" + id);
    const nm = document.getElementById("n" + id);
    if (sl) sl.addEventListener("input", e => {
      const v = +e.target.value;
      if (!isFinite(v)) return;
      beginEdit("调整" + (PROP_LABEL[prop] || "属性")); apply(v);
      if (nm && document.activeElement !== nm) nm.value = v;
      touch(p, prop); draw();
    });
    if (sl) sl.addEventListener("change", endEdit);
    if (nm){
      nm.addEventListener("input", e => {
        const v = +e.target.value;
        if (!isFinite(v) || e.target.value === "" || e.target.value === "-") return;
        beginEdit("调整" + (PROP_LABEL[prop] || "属性")); apply(v);
        if (sl && toSlider) sl.value = toSlider(v);
        touch(p, prop); draw();
      });
      nm.addEventListener("change", endEdit);
      nm.addEventListener("blur", endEdit);
    }
  };

  // 旋转超过一圈时在行尾提示「↻2」，否则滑块看不出转过几圈
  const setTurns = d => {
    const el = document.getElementById("rotTurns");
    if (!el) return;
    const n = Math.round(Math.abs(d) / 360);
    el.textContent = n >= 1 ? (d < 0 ? "↺" : "↻") + n : "";
  };
  setTurns(deg);

  numBind("Rot", v => { p.rot = v * Math.PI / 180; setTurns(v); }, v => wrapDeg(v), "rot");
  numBind("Sx", v => {
    const k = v / 100;
    if (S.linkScale){ p.sx = p.sy = k; const b = document.getElementById("nSy"); if (b) b.value = v; const s2 = document.getElementById("fSy"); if (s2) s2.value = v; }
    else p.sx = k;
  }, v => clamp(v, 10, 300), "sx");
  numBind("Sy", v => {
    const k = v / 100;
    if (S.linkScale){ p.sx = p.sy = k; const b = document.getElementById("nSx"); if (b) b.value = v; const s2 = document.getElementById("fSx"); if (s2) s2.value = v; }
    else p.sy = k;
  }, v => clamp(v, 10, 300), "sy");
  numBind("Alpha", v => { p.alpha = v / 100; }, v => clamp(v, 0, 100), "alpha");
  numBind("Hue", v => { p.hue = v; }, v => wrapDeg(v), "hue");

  bind("fPx", "change", e => {
    pushUndo();
    const it = p.variants[p.texIndex] || p.variants[0];

function drawCurveEditor(k){
  const cv = document.getElementById("curve");
  if (!cv) return;
  const dpr = window.devicePixelRatio || 1;
  const W = cv.clientWidth || 240, H = cv.clientHeight || 118;
  cv.width = Math.round(W*dpr); cv.height = Math.round(H*dpr);
  const g = cv.getContext("2d");
  g.setTransform(dpr, 0, 0, dpr, 0, 0);
  g.clearRect(0, 0, W, H);

  const pad = 14;
  const w = W - pad*2, h = H - pad*2;
  const X = v => pad + v * w;
  const Y = v => pad + h - v * h;

  g.strokeStyle = TH.curveGrid; g.lineWidth = 1;
  for (let i = 0; i <= 4; i++){
    g.beginPath(); g.moveTo(X(i/4), pad); g.lineTo(X(i/4), pad + h); g.stroke();
    g.beginPath(); g.moveTo(pad, Y(i/4)); g.lineTo(pad + w, Y(i/4)); g.stroke();
  }
  g.strokeStyle = "#3a3a3a";
  g.beginPath(); g.moveTo(X(0), Y(0)); g.lineTo(X(1), Y(1)); g.stroke();

  const p = k.ease && k.ease.p ? k.ease.p : null;
  g.strokeStyle = TH.accent; g.lineWidth = 1.6;
  g.beginPath();
  if (!p){
    g.moveTo(X(0), Y(0)); g.lineTo(X(1), Y(0)); g.lineTo(X(1), Y(1));
  } else {
    for (let i = 0; i <= 40; i++){
      const x = i / 40;
      const y = bezierY(x, p);
      if (i === 0) g.moveTo(X(x), Y(y)); else g.lineTo(X(x), Y(y));
    }
  }
  g.stroke();

  if (p){
    g.strokeStyle = "#4a7f6f"; g.lineWidth = 1;
    g.beginPath(); g.moveTo(X(0), Y(0)); g.lineTo(X(p[0]), Y(p[1])); g.stroke();
    g.beginPath(); g.moveTo(X(1), Y(1)); g.lineTo(X(p[2]), Y(p[3])); g.stroke();
    [[p[0], p[1], TH.handleA], [p[2], p[3], TH.warn]].forEach(([x, y, c]) => {
      g.fillStyle = c;
      g.beginPath(); g.arc(X(x), Y(y), 4.5, 0, Math.PI*2); g.fill();
    });
    cv.dataset.p = JSON.stringify(p);
  }

  bindCurveCanvas(cv);
}

let curveDrag = null;

function curveGeom(cv){
  const pad = 14;
  const W = cv.clientWidth || 240, H = cv.clientHeight || 118;
  const w = W - pad*2, h = H - pad*2;
  return { pad, w, h, X: v => pad + v*w, Y: v => pad + h - v*h };
}

function bindCurveCanvas(cv){
  cv.onpointerdown = e => {
    const k = currentCurveKey();
    if (!k || !k.ease || !k.ease.p) return;
    const { X, Y } = curveGeom(cv);
    const r = cv.getBoundingClientRect();
    const mx = e.clientX - r.left, my = e.clientY - r.top;
    const p = k.ease.p;
    const d0 = Math.hypot(mx - X(p[0]), my - Y(p[1]));
    const d1 = Math.hypot(mx - X(p[2]), my - Y(p[3]));
    curveDrag = d0 < d1 ? 0 : 1;
    beginEdit();
    try { cv.setPointerCapture(e.pointerId); } catch(err){}
    e.preventDefault();
    cv.onpointermove(e);
  };
  cv.onpointermove = e => {
    if (curveDrag === null) return;
    const k = currentCurveKey();
    if (!k || !k.ease || !k.ease.p) return;
    const { pad, w, h } = curveGeom(cv);
    const r = cv.getBoundingClientRect();
    const vx = clamp((e.clientX - r.left - pad) / w, 0, 1);
    const vy = (pad + h - (e.clientY - r.top)) / h;
    const p = k.ease.p;
    if (curveDrag === 0){ p[0] = vx; p[1] = vy; }
    else { p[2] = vx; p[3] = vy; }
    applyAt(S.beat); draw(); drawTimeline(); drawCurveEditor(k);
  };
  cv.onpointerup = () => {
    if (curveDrag !== null){ curveDrag = null; endEdit(); }
  };
  cv.onpointercancel = () => { curveDrag = null; };
}

/* v2：曲线编辑的是「某条轨道在某个时刻的那个点」。
   S.selKey 只记 partId + t，不再持有快照对象引用（聚合数组每次重建会失效）。 */
function curveTarget(){
  if (!S.selKey) return null;
  const part = S.parts.find(p => p.id === S.selKey.partId);
  if (!part) return null;
  ensureTracks(part);
  const at = S.selKey.t;
  const avail = TRACK_PROPS.filter(k => trackHasKey(part, k, at));
  if (!avail.length) return null;
  const prop = avail.indexOf(S.curveProp) >= 0 ? S.curveProp : avail[0];
  const entry = part.tracks[prop].find(e => Math.abs(e.t - at) < 1e-3) || null;
  return entry ? { part, prop, entry, avail } : null;
}
function currentCurveKey(){
  const t = curveTarget();
  return t ? t.entry : null;
}

/* ---------- 自定义组件 ---------- */
function makeComponentFromSelection(){
  let part = null, pts = null;

  /* 优先用「选中的轨道点」；没选就用整个图层 */
  const sel = selectionToPoints();
  if (sel.length >= 2){
    const counts = {};
    for (const it of sel) counts[it.partId] = (counts[it.partId] || 0) + 1;
    const partId = Object.keys(counts).sort((a, b) => counts[b] - counts[a])[0];
    part = S.parts.find(p => p.id === partId);
    pts = sel.filter(i => i.partId === partId).sort((a, b) => a.t - b.t);
    if (!part || pts.length < 2){ toast("至少选中同一图层的两个轨道点"); return; }
  } else {
    part = S.selected;
    if (!part){ toast("先在左侧选一个图层，或在时间轴上选中关键帧"); return; }
    ensureTracks(part);
    pts = [];
    for (const prop of TRACK_PROPS)
      for (const e of part.tracks[prop]) pts.push({ partId: part.id, prop, t: e.t, v: e.v, ease: e.ease });
    pts.sort((a, b) => a.t - b.t);
    if (pts.length < 2){
      toast("「" + part.slot + "」只有 " + pts.length + " 个关键帧，至少需要 2 个");
      return;
    }
  }

  /* 镜像轨道不能做成组件（clipValueAt 不输出 flip），先排除 */
  const props = [...new Set(pts.map(i => i.prop))].filter(k => k !== "flipX" && k !== "flipY");
  if (!props.length){ toast("选中的都是镜像点，镜像不能做成组件"); return; }

  const t0 = pts[0].t;
  const base0 = {};
  for (const prop of props){
    const e = part.tracks[prop].find(x => Math.abs(x.t - t0) < 1e-3);
    base0[prop] = e ? e.v : (part.rest ? part.rest[prop] : 0);
  }
  const times = [...new Set(pts.map(i => round4(i.t)))].sort((a, b) => a - b);
  const arr = times.map(t => {
    const k = { t: +(t - t0).toFixed(4) };
    for (const prop of props){
      const e = part.tracks[prop].find(x => Math.abs(x.t - t) < 1e-3);
      if (!e) continue;
      if (prop === "x" || prop === "y" || prop === "rot") k[prop] = +(e.v - base0[prop]).toFixed(5);
      else if (prop === "sx" || prop === "sy" || prop === "alpha")
        k[prop] = +(base0[prop] ? e.v / base0[prop] : 1).toFixed(4);
      else k[prop] = e.v;
    }
    return k;
  });

  const label = props.length === 1 ? PROP_LABEL[props[0]] : props.length + " 个属性";
  askName("给这个组件起个名字（" + arr.length + " 帧 / " + label + "）", part.slot + " 动作", name => {
    pushUndo("存为组件");
    const comp = {
      id: "u" + Date.now().toString(36),
      cat: "我的", name, ico: "★", target: "any",
      rel: true, custom: true, props, keys: arr
    };
    ACTION_LIB.push(comp);
    saveCustomActions();

    const span = Math.max(0.25, arr[arr.length - 1].t);
    removePoints(pts);
    const clip = {
      id: "c" + (++uid),
      partId: part.id,
      actionId: comp.id,
      start: t0,
      dur: span,
      base: {
        x: base0.x || 0, y: base0.y || 0, rot: base0.rot || 0,
        sx: base0.sx === undefined ? 1 : base0.sx,
        sy: base0.sy === undefined ? 1 : base0.sy,
        alpha: base0.alpha === undefined ? 1 : base0.alpha,
        tex: base0.tex || 0
      }
    };
    S.clips.push(clip);
    S.selected = part;
    S.selKeys = []; S.selKey = null;
    S.selClips = [clip]; S.selectedClip = clip;
    applyAt(S.beat); renderAll();
    toast("已存为组件「" + name + "」（只含 " + label + "）");
  });
}

function deriveProps(keys){
  const set = new Set();
  for (const k of keys) for (const p of TRACK_PROPS){
    if (k[p] !== undefined) set.add(p);
  }
  return [...set];
}
/* 单属性绝对值：把组件里的相对量还原成轨道里的绝对量 */
function clipPropAbs(clip, a, k, prop){
  const b = clip.base || {};
  const rel = !!a.rel;
  const v = k[prop];
  if (prop === "x" || prop === "y") return (b[prop] || 0) + v;
  if (prop === "rot") return (b.rot || 0) + v;
  if (prop === "sx" || prop === "sy" || prop === "alpha") return rel ? (b[prop] || 1) * v : v;
  return v;   /* tex / hue 用绝对值 */
}

function clipKeyAbs(clip, a, k){
  const b = clip.base;
  const rel = !!a.rel;
  return {
    x: b.x + (k.x !== undefined ? k.x : 0),
    y: b.y + (k.y !== undefined ? k.y : 0),
    rot: b.rot + (k.rot !== undefined ? k.rot : 0),
    sx: k.sx !== undefined ? (rel ? b.sx * k.sx : k.sx) : b.sx,
    sy: k.sy !== undefined ? (rel ? b.sy * k.sy : k.sy) : b.sy,
    alpha: k.alpha !== undefined ? (rel ? b.alpha * k.alpha : k.alpha) : b.alpha,
    tex: k.tex !== undefined ? k.tex : b.tex
  };
}

function expandClip(clip){
  if (!clip) return;
  const a = ACTION_LIB.find(x => x.id === clip.actionId);
  const part = S.parts.find(p => p.id === clip.partId);
  if (!a || !part){ toast("找不到对应组件或图层"); return; }

  const span = a.keys[a.keys.length - 1].t || clip.dur;
  pushUndo("分解为关键帧");
  /* v2：只写组件真正带了的属性，不碰其它轨道 */
  const props = a.props && a.props.length ? a.props : deriveProps(a.keys);
  const ease = a.instant ? { p: null } : { p: [0.42, 0, 0.58, 1] };
  a.keys.forEach(k => {
    const tt = +(clip.start + (span > 1e-6 ? (k.t / span) * clip.dur : 0)).toFixed(4);
    for (const prop of props){
      if (k[prop] === undefined) continue;
      setTrackKey(part, prop, tt, clipPropAbs(clip, a, k, prop), ease);
    }
  });
  S.clips = S.clips.filter(c => c !== clip);
  clearSel();
  S.selected = part;
  applyAt(S.beat);
  renderAll();
  toast("已分解为 " + a.keys.length + " 个关键帧");
}

function deleteCustom(id){
  const i = ACTION_LIB.findIndex(a => a.id === id);
  if (i < 0) return;
  pushUndo("删除组件");
  ACTION_LIB.splice(i, 1);
  S.clips = S.clips.filter(c => c.actionId !== id);
  saveCustomActions();
  clearSel();
  applyAt(S.beat); renderAll();
  toast("已删除组件");
}

/* 组件库现在随工程保存，这里不再写浏览器存储。
   保留函数是为了给「删组件 / 存组件」一个统一的收尾钩子。 */
function saveCustomActions(){}

/* 用工程里的组件库替换当前自定义组件（内置动作不动） */
function setCustomActions(list){
  for (let i = ACTION_LIB.length - 1; i >= 0; i--) if (ACTION_LIB[i].custom) ACTION_LIB.splice(i, 1);
  for (const a of (list || [])){
    if (!a || !a.id || !Array.isArray(a.keys)) continue;
    if (ACTION_LIB.some(x => x.id === a.id)) continue;
    ACTION_LIB.push(Object.assign({}, a, { custom: true }));
  }
}
/* 旧版把组件存在浏览器里。这里只做一次性并入：启动时读出来放进当前会话，
   之后组件的归属以工程为准（保存时写进工程，打开工程时读工程里的）。 */
function loadCustomActions(){
  try {
    const raw = localStorage.getItem("rigframe.customActions") || localStorage.getItem("meme.customActions");
    if (!raw) return;
    const list = JSON.parse(raw);
    if (!Array.isArray(list) || !list.length) return;
    setCustomActions(list);
    toast("已并入 " + list.length + " 个旧组件，保存工程后就会跟着工程走");
  } catch(e){}
}

  const inp = document.getElementById("modalInput");
  document.getElementById("modalTitle").textContent = title;
  inp.value = def;
  m.classList.add("show");

  const m = document.getElementById("modal");
  const inp = document.getElementById("modalInput");

  try { inp.blur(); } catch(e){}

  modalCb = null;

/* ============================ 画布交互 ============================ */
let drag = null;
let pivotDrag = null;
let panDrag = null;
let gizmoDrag = null;
let cropDrag = null;

function movePivotTo(mx, my){
  const { p, it } = pivotDrag;
  const m = worldOf(p);
  const det = m.a*m.d - m.b*m.c || 1e-6;
  const dx = mx - m.e, dy = my - m.f;
  const u = ( m.d*dx - m.c*dy)/det + it.ax;
  const v = (-m.b*dx + m.a*dy)/det + it.ay;
  setPivot(p, it, u, v);
  draw();
  const fx = document.getElementById("fPx"), fy = document.getElementById("fPy");
  if (fx) fx.value = Math.round(p.ax);
  if (fy) fy.value = Math.round(p.ay);
}

/* 命中测试：bbox 内再按贴图 alpha 判定，点在透明处会自动落到下方图层 */
function alphaHitAt(it, u, v){
  const img = it.img;
  if (!img || !img.width) return true;
  const map = alphaMapOf(img);
  if (!map) return true;
  const mx = clamp(Math.floor(u / img.width * map.w), 0, map.w - 1);
  const my = clamp(Math.floor(v / img.height * map.h), 0, map.h - 1);
  return map.a[my * map.w + mx] > 10;
}

function hitPart(mx, my){
  let loose = null;                    // 全部透明的兜底：最上面那个 bbox 命中
  for (let i = S.parts.length - 1; i >= 0; i--){
    const p = S.parts[i];
    if (!p.visible || p.locked) continue;
    const it = p.variants[p.texIndex] || p.variants[0];
    if (!it) continue;
    const m = worldOf(p);
    const det = m.a*m.d - m.b*m.c || 1e-6;
    const dx = mx - m.e, dy = my - m.f;
    const u = ( m.d*dx - m.c*dy)/det + it.ax;
    const v = (-m.b*dx + m.a*dy)/det + it.ay;
    const bb = it.bbox;
    if (u >= bb.x && v >= bb.y && u <= bb.x + bb.w && v <= bb.y + bb.h){
      /* 文字图层没有位图 alpha，按矩形直接命中 */
      if (p.kind === "text") return p;
      if (alphaHitAt(it, u, v)) return p;
      if (!loose) loose = p;
    }
  }
  return loose;
}

function setPivot(p, it, nax, nay){
  const bb = it.bbox;
  const u = bb.w ? (nax - bb.x) / bb.w : 0.5;
  const v = bb.h ? (nay - bb.y) / bb.h : 0.5;
  const dax = nax - it.ax, day = nay - it.ay;
  if (Math.abs(dax) < 1e-6 && Math.abs(day) < 1e-6) return;
  const c = Math.cos(p.rot), s = Math.sin(p.rot);
  const sdx = c * dax * p.sx - s * day * p.sy;
  const sdy = s * dax * p.sx + c * day * p.sy;
  p.x += sdx; p.y += sdy;
  p.pu = u; p.pv = v;
  applyPivot(p);
  /* 自身位置变了：静态值和 x/y 轨道都要跟着平移，否则下一次求值会被拉回去 */
  syncRest(p, ["x", "y"]);
  ensureTracks(p);
  for (const e of p.tracks.x) e.v += sdx;
  for (const e of p.tracks.y) e.v += sdy;
  p._agg = null;

  // 子级的坐标是相对父级原点（轴心）的，轴心一动子级就会整体漂移。
  // 把子级局部坐标反向平移 (dax, day)，正好抵消，视觉上原地不动。
  for (const ch of S.parts){
    if (ch.parentId !== p.id) continue;
    ch.x -= dax; ch.y -= day;
    if (ch.rest){ ch.rest.x -= dax; ch.rest.y -= day; }
    ensureTracks(ch);
    for (const e of ch.tracks.x) e.v -= dax;
    for (const e of ch.tracks.y) e.v -= day;
    ch._agg = null;
    for (const cl of S.clips){
      if (cl.partId === ch.id && cl.base){ cl.base.x -= dax; cl.base.y -= day; }
    }
  }
}

/* ============================ 贴图裁切 ============================ */
function cropTarget(){
  if (!S.crop) return null;
  const p = S.parts.find(q => q.id === S.crop.partId);
  if (!p) return null;
  const it = p.variants[S.crop.vi] || p.variants[0];
  return it ? { p, it } : null;
}

function startCrop(){
  const p = S.selected;
  if (!p) return toast("先选中一个图层");
  const it = p.variants[p.texIndex] || p.variants[0];
  if (!it) return;
  S.crop = { partId: p.id, vi: p.texIndex, rect: { x: it.bbox.x, y: it.bbox.y, w: it.bbox.w, h: it.bbox.h } };
  S.pivotMode = false;
  view.style.cursor = "default";
  renderInspector(); draw();
  toast("拖动四角/边调范围，框内拖动整体移，回车应用 · Esc 取消");
}

function cancelCrop(){
  if (!S.crop) return;
  S.crop = null; cropDrag = null;
  renderInspector(); draw();
}

async function applyCrop(){
  const t = cropTarget();
  if (!t){ S.crop = null; return; }
  const { p, it } = t;
  const r = S.crop.rect;
  const x = Math.round(r.x), y = Math.round(r.y);
  const w = Math.max(1, Math.round(r.w)), h = Math.max(1, Math.round(r.h));
  if (w >= it.img.width && h >= it.img.height && x === 0 && y === 0){
    cancelCrop();
    return;
  }
  pushUndo();
  const cv = document.createElement("canvas");
  cv.width = w; cv.height = h;
  cv.getContext("2d").drawImage(it.img, x, y, w, h, 0, 0, w, h);
  const img = await loadSrc(cv.toDataURL("image/png"));

  // 裁切只是换了一张更小的图：让原图坐标 (x,y) 对应新图 (0,0)，
  // 轴心按同一比例搬过去，世界位置就不会跳。
  const nax = it.ax - x, nay = it.ay - y;
  it.img = img;
  it.bbox = alphaBBox(img);
  it.thumb = makeThumb(img, it.bbox);
  const bb = it.bbox;
  p.pu = bb.w ? clamp((nax - bb.x) / bb.w, -2, 3) : 0.5;
  p.pv = bb.h ? clamp((nay - bb.y) / bb.h, -2, 3) : 0.5;
  applyPivot(p);

  S.crop = null; cropDrag = null;
  renderAll();
  toast("已裁切为 " + w + " × " + h);
}

function cropHandles(){
  const t = cropTarget();
  if (!t) return [];
  const { p, it } = t, m = worldOf(p), r = S.crop.rect;
  const out = [];
  const put = (u, v, id) => {
    const lx = u - it.ax, ly = v - it.ay;
    out.push({ id, x: m.a*lx + m.c*ly + m.e, y: m.b*lx + m.d*ly + m.f });
  };
  put(r.x, r.y, "nw"); put(r.x + r.w, r.y, "ne");
  put(r.x + r.w, r.y + r.h, "se"); put(r.x, r.y + r.h, "sw");
  put(r.x + r.w/2, r.y, "n"); put(r.x + r.w/2, r.y + r.h, "s");
  put(r.x, r.y + r.h/2, "w"); put(r.x + r.w, r.y + r.h/2, "e");
  return out;
}

function drawCropOverlay(){
  const t = cropTarget();
  if (!t){ S.crop = null; return; }
  const { p, it } = t, m = worldOf(p), r = S.crop.rect;
  const toS = (u, v) => {
    const lx = u - it.ax, ly = v - it.ay;
    return { x: m.a*lx + m.c*ly + m.e, y: m.b*lx + m.d*ly + m.f };
  };
  const path = (x, y, w, h) => {
    const q = [toS(x, y), toS(x + w, y), toS(x + w, y + h), toS(x, y + h)];
    ctx.moveTo(q[0].x, q[0].y);
    for (let i = 1; i < 4; i++) ctx.lineTo(q[i].x, q[i].y);
    ctx.closePath();
  };

  ctx.save();
  // 框外压暗（两个子路径 + evenodd = 挖空中间那块）
  ctx.beginPath();
  path(0, 0, it.img.width, it.img.height);
  path(r.x, r.y, r.w, r.h);
  ctx.fillStyle = "rgba(0,0,0,.5)";
  ctx.fill("evenodd");
  // 保留区提亮
  ctx.beginPath();
  path(r.x, r.y, r.w, r.h);
  ctx.fillStyle = "rgba(255,255,255,.07)";
  ctx.fill();

  ctx.beginPath();
  path(r.x, r.y, r.w, r.h);
  ctx.strokeStyle = TH.accent;
  ctx.lineWidth = 1.5;
  ctx.stroke();

  ctx.beginPath();
  ctx.strokeStyle = TH.accent;
  ctx.lineWidth = 1;
  for (let i = 1; i < 3; i++){
    let a = toS(r.x + r.w * i / 3, r.y), b = toS(r.x + r.w * i / 3, r.y + r.h);
    ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y); ctx.stroke();
    a = toS(r.x, r.y + r.h * i / 3); b = toS(r.x + r.w, r.y + r.h * i / 3);
    ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y); ctx.stroke();
  }

  for (const hd of cropHandles()){
    ctx.beginPath(); ctx.arc(hd.x, hd.y, 4.5, 0, Math.PI * 2);
    ctx.fillStyle = "#fff"; ctx.fill();
    ctx.strokeStyle = "rgba(0,0,0,.5)"; ctx.lineWidth = 1; ctx.stroke();
  }

  const c = toS(r.x + r.w / 2, r.y + r.h / 2);
  const label = Math.round(r.w) + " × " + Math.round(r.h) + "   回车应用 · Esc 取消";
  ctx.font = "11px -apple-system,system-ui,sans-serif";
  ctx.textAlign = "center"; ctx.textBaseline = "middle";
  const tw = ctx.measureText(label).width + 16;
  ctx.fillStyle = "rgba(0,0,0,.78)";
  roundRect(ctx, c.x - tw/2, c.y - 10, tw, 20, 5); ctx.fill();
  ctx.fillStyle = "#e8e8e8";
  ctx.fillText(label, c.x, c.y + .5);
  ctx.textAlign = "left"; ctx.textBaseline = "alphabetic";
  ctx.restore();
}

function cropHitAt(mx, my){
  const t = cropTarget();
  if (!t) return null;
  for (const h of cropHandles()) if (Math.hypot(h.x - mx, h.y - my) <= 10) return h.id;
  const { p, it } = t, m = worldOf(p);
  const det = m.a*m.d - m.b*m.c || 1e-6;
  const dx = mx - m.e, dy = my - m.f;
  const u = ( m.d*dx - m.c*dy)/det + it.ax;
  const v = (-m.b*dx + m.a*dy)/det + it.ay;
  const r = S.crop.rect;
  if (u >= r.x && u <= r.x + r.w && v >= r.y && v <= r.y + r.h) return "move";
  return null;
}

function cropToImage(mx, my){
  const t = cropTarget();
  if (!t) return null;
  const { p, it } = t, m = worldOf(p);
  const det = m.a*m.d - m.b*m.c || 1e-6;
  const dx = mx - m.e, dy = my - m.f;
  return { u: ( m.d*dx - m.c*dy)/det + it.ax, v: (-m.b*dx + m.a*dy)/det + it.ay };
}

function cropDragTo(mx, my){
  const t = cropTarget();
  if (!t || !cropDrag) return;
  const pt = cropToImage(mx, my);
  if (!pt) return;
  const it = t.it, r0 = cropDrag.rect0, id = cropDrag.id;
  const IW = it.img.width, IH = it.img.height, MIN = 8;
  const du = pt.u - cropDrag.u0, dv = pt.v - cropDrag.v0;
  let x = r0.x, y = r0.y, w = r0.w, h = r0.h;

  if (id === "move"){
    x = clamp(r0.x + du, 0, Math.max(0, IW - w));
    y = clamp(r0.y + dv, 0, Math.max(0, IH - h));
  } else {
    if (id.indexOf("w") >= 0){
      const nx = clamp(r0.x + du, 0, r0.x + r0.w - MIN);
      w = r0.x + r0.w - nx; x = nx;
    }
    if (id.indexOf("e") >= 0) w = clamp(r0.w + du, MIN, IW - r0.x);
    if (id.indexOf("n") >= 0){
      const ny = clamp(r0.y + dv, 0, r0.y + r0.h - MIN);
      h = r0.y + r0.h - ny; y = ny;
    }
    if (id.indexOf("s") >= 0) h = clamp(r0.h + dv, MIN, IH - r0.y);
  }
  S.crop.rect = { x, y, w, h };
  draw();
}

view.addEventListener("pointerdown", e => {
  const r = view.getBoundingClientRect();
  const mx = e.clientX - r.left, my = e.clientY - r.top;

  if (e.button === 1){
    e.preventDefault();
    panDrag = { mx, my, ox: S.view.ox, oy: S.view.oy };
    try { view.setPointerCapture(e.pointerId); } catch(err){}
    view.style.cursor = "grabbing";
    return;
  }
  if (e.button !== 0) return;

  if (S.playing) stop();

  if (S.crop){
    const id = cropHitAt(mx, my);
    if (id){
      const pt = cropToImage(mx, my);
      if (pt){
        cropDrag = { id, u0: pt.u, v0: pt.v, rect0: Object.assign({}, S.crop.rect) };
        try { view.setPointerCapture(e.pointerId); } catch(err){}
        e.preventDefault();
        return;
      }
    }
    return;   // 点在裁切框外：什么都不做，避免误取消
  }

  if (S.pivotMode && S.selected){
    const p = S.selected;
    const it = p.variants[p.texIndex] || p.variants[0];
    beginEdit();
    pivotDrag = { p, it };
    movePivotTo(mx, my);
    try { view.setPointerCapture(e.pointerId); } catch(err){}
    e.preventDefault();
    return;
  }

  if (S.selected && !S.selected.locked){
    const gh = hitGizmo(mx, my);
    if (gh){
      const p = S.selected;
      if (gh.type === "del"){ pushUndo(); deletePart(p); return; }
      if (gh.type === "dup"){ pushUndo(); duplicatePart(p); return; }
      beginEdit();
      if (gh.type === "rot"){
        const par = p.parentId ? S.parts.find(q => q.id === p.parentId) : null;
        const pm = par ? worldOf(par) : rootMatrix();
        const a = invLinear(pm, mx - pm.e, my - pm.f);
        const a0 = Math.atan2(a.y - p.y, a.x - p.x);
        // acc 记录累计转过的角度（不取模），所以能超过 360°
        gizmoDrag = { type: "rot", p, pm, rot0: p.rot, a0, acc: 0, prev: a0 };
      } else {
        gizmoDrag = { type: "scale", p, i: gh.i, m0: gh.g.m, sx0: p.sx, sy0: p.sy, L: gh.g.L };
      }
      try { view.setPointerCapture(e.pointerId); } catch(err){}
      e.preventDefault();
      return;
    }
  }

  const hit = hitPart(mx, my);

  if (!hit && S.selected){
    clearSel();
    S.selected = null;
    renderAll();
    return;
  }
  if (hit && hit !== S.selected) selectPart(hit);
  if (!hit) return;

  beginEdit();
  drag = { p: hit, mx, my, x0: hit.x, y0: hit.y, rot0: hit.rot, mode: e.shiftKey ? "rot" : "move" };
  view.setPointerCapture(e.pointerId);
});

view.addEventListener("pointermove", e => {
  const r = view.getBoundingClientRect();
  const mx = e.clientX - r.left, my = e.clientY - r.top;

  if (cropDrag){
    cropDragTo(mx, my);
    return;
  }
  if (panDrag){
    S.view.ox = panDrag.ox + (mx - panDrag.mx);
    S.view.oy = panDrag.oy + (my - panDrag.my);
    draw();
    return;
  }
  if (pivotDrag){
    movePivotTo(mx, my);
    return;
  }
  if (gizmoDrag){
    const d = gizmoDrag, p = d.p;
    if (d.type === "rot"){
      const a = invLinear(d.pm, mx - d.pm.e, my - d.pm.f);
      const cur = Math.atan2(a.y - p.y, a.x - p.x);
      // 逐帧取最短增量再累加：过 180° 不会跳回，可以一直往一个方向转
      let step = cur - d.prev;
      while (step > Math.PI) step -= Math.PI * 2;
      while (step < -Math.PI) step += Math.PI * 2;
      d.acc += step;
      d.prev = cur;

      let acc = d.acc;
      const deg = acc * 180 / Math.PI;
      const snapDeg = Math.round(deg / 15) * 15;
      if (!e.altKey && Math.abs(deg - snapDeg) < 3) acc = snapDeg * Math.PI / 180;
      p.rot = d.rot0 + acc;
    } else {
      const L = invLinear(d.m0, mx - d.m0.e, my - d.m0.f);
      const C = d.L[d.i];
      const kx = Math.abs(C[0]) > 1 ? L.x / C[0] : 1;
      const ky = Math.abs(C[1]) > 1 ? L.y / C[1] : 1;
      let fx = kx, fy = ky;
      if (S.linkScale || e.shiftKey){ const k = (kx + ky) / 2; fx = fy = k; }
      p.sx = clamp(d.sx0 * fx, 0.05, 8);
      p.sy = clamp(d.sy0 * fy, 0.05, 8);
    }
    touch(p, "sx"); touch(p, "sy");
    draw(); drawTimeline(); syncNums(p);
    return;
  }
  if (!drag){
    if (!panDrag){
      const gh = (S.selected && !S.selected.locked) ? hitGizmo(mx, my) : null;
      view.style.cursor = !gh ? (S.pivotMode ? "crosshair" : "default")
        : gh.type === "rot" ? "grab" : gh.type === "scale" ? "nwse-resize" : "pointer";
    }
    return;
  }

  const p = drag.p;
  const par = p.parentId ? S.parts.find(q => q.id === p.parentId) : null;
  const pm = par ? worldOf(par) : rootMatrix();

  if (drag.mode === "rot"){
    const c = worldOf(p);
    const a0 = Math.atan2(drag.my - c.f, drag.mx - c.e);
    const a1 = Math.atan2(my - c.f, mx - c.e);
    p.rot = drag.rot0 + (a1 - a0);
    touch(p, "rot");
  } else {
    const d = invLinear(pm, mx - drag.mx, my - drag.my);
    p.x = drag.x0 + d.x;
    p.y = drag.y0 + d.y;
    touch(p, "x"); touch(p, "y");
  }
  draw(); drawTimeline(); syncNums(p);
});

view.addEventListener("pointerup", e => {
  if (cropDrag){
    cropDrag = null;
    try { view.releasePointerCapture(e.pointerId); } catch(err){}
    return;
  }
  if (panDrag){
    panDrag = null;
    view.style.cursor = S.pivotMode ? "crosshair" : "default";
    try { view.releasePointerCapture(e.pointerId); } catch(err){}
    return;
  }
  if (pivotDrag){
    pivotDrag = null;
    endEdit();
    try { view.releasePointerCapture(e.pointerId); } catch(err){}
    renderInspector();
    return;
  }
  if (gizmoDrag){
    gizmoDrag = null;
    endEdit();
    try { view.releasePointerCapture(e.pointerId); } catch(err){}
    renderInspector(); drawTimeline();
    return;
  }
  if (drag){
    try { view.releasePointerCapture(e.pointerId); } catch(err){}
    drag = null; endEdit(); drawTimeline(); renderInspector();
  }
});

/* ---- 视图缩放（镜头） ---- */
function zoomViewAt(mx, my, k){
  const old = S.view.scale;
  const ns = clamp(old * k, 0.02, 24);
  if (Math.abs(ns - old) < 1e-9) return;
  S.view.ox = mx - (mx - S.view.ox) * (ns / old);
  S.view.oy = my - (my - S.view.oy) * (ns / old);
  S.view.scale = ns;
  draw();
}
function zoomViewCenter(k){
  zoomViewAt(view.clientWidth / 2, view.clientHeight / 2, k);
}
function setViewScale100(){
  S.view.scale = 1;
  S.view.ox = (view.clientWidth - S.doc.w) / 2;
  S.view.oy = (view.clientHeight - S.doc.h) / 2;
  draw();
}

view.addEventListener("wheel", e => {
  e.preventDefault();

  // Alt + 滚轮：缩放选中的部件（保留旧操作习惯）
  if (e.altKey && S.selected && !S.selected.locked){
    const p = S.selected;
    beginEdit();
    const k = e.deltaY > 0 ? 0.94 : 1.06;
    p.sx = clamp(p.sx * k, 0.05, 5);
    p.sy = clamp(p.sy * k, 0.05, 5);
    touch(p, "sx"); touch(p, "sy");
    draw(); syncNums(p);
    clearTimeout(view._wt);
    view._wt = setTimeout(endEdit, 260);
    return;
  }

  const r = view.getBoundingClientRect();
  const step = e.deltaMode === 1 ? 0.05 : 0.0015;
  zoomViewAt(e.clientX - r.left, e.clientY - r.top, Math.exp(-e.deltaY * step));
}, { passive: false });

view.addEventListener("mousedown", e => { if (e.button === 1) e.preventDefault(); });

view.addEventListener("contextmenu", e => {
  e.preventDefault();
  const fit = () => { fitView(); draw(); };
  showMenu(e.clientX, e.clientY, [
    { label: "适应窗口", key: "Fit", fn: fit },
    { label: "实际大小 100%", fn: setViewScale100 },
    "-",
    { label: "放大", key: "+", fn: () => zoomViewCenter(1.2) },
    { label: "缩小", key: "−", fn: () => zoomViewCenter(1 / 1.2) },
    "-",
    { label: "缩放重置", fn: () => { fitView(); draw(); } }
  ]);
});

function syncNums(p){
  const busy = el => el && el === document.activeElement;
  const setPair = (sid, nid, v) => {
    const s = document.getElementById(sid), n = document.getElementById(nid);
    if (s && !busy(s)) s.value = v;
    if (n && !busy(n)) n.value = Math.round(v * 100) / 100;
  };
  const x = document.getElementById("fX"), y = document.getElementById("fY");
  if (x && !busy(x)) x.value = Math.round(p.x);
  if (y && !busy(y)) y.value = Math.round(p.y);

  const deg = p.rot * 180 / Math.PI;
  const wrap = d => { let a = ((d + 180) % 360 + 360) % 360 - 180; return Math.round(a * 10) / 10; };
  const rs = document.getElementById("fRot"), rn = document.getElementById("nRot");
  if (rs && !busy(rs)) rs.value = wrap(deg);          // 滑块只表示朝向
  if (rn && !busy(rn)) rn.value = Math.round(deg * 10) / 10;   // 数字框是真实角度
  const tt = document.getElementById("rotTurns");
  if (tt){
    const n = Math.round(Math.abs(deg) / 360);
    tt.textContent = n >= 1 ? (deg < 0 ? "↺" : "↻") + n : "";
  }
  setPair("fSx", "nSx", Math.round(p.sx * 100));
  setPair("fSy", "nSy", Math.round(p.sy * 100));
  setPair("fAlpha", "nAlpha", Math.round(p.alpha * 100));
  setPair("fHue", "nHue", Math.round(p.hue || 0));
  updateClipHint(p);
}

/* ============================ 时间轴交互 ============================ */
let tlDrag = null;

function tlX(e){ return e.clientX - tl.getBoundingClientRect().left; }
function tlY(e){ return e.clientY - tl.getBoundingClientRect().top; }

function hitTestTimeline(mx, my){
  // 卡点只在它自己那排三角（标尺下沿）里能抓，且取最近的一个：
  // 以前整条标尺都算卡点区，卡点一多（每拍一个）就再也拖不动进度条了
  if (my >= rulerH - 9 && my <= rulerH + 3){
    let best = -1, bestD = 6;
    for (let i = 0; i < S.cues.length; i++){
      const d = Math.abs(xOf(S.cues[i]) - mx);
      if (d < bestD){ bestD = d; best = i; }
    }
    if (best >= 0) return { type: "cue", idx: best };
  }
  // 播放头抓取范围放宽到 ±12px，标尺上半区永远归它
  if (my <= rulerH + 6 && Math.abs(xOf(S.beat) - mx) <= 12) return { type: "playhead" };
  for (const { p, y, sub } of tlRows){
    if (my < y || my > y + rowH) continue;
    if (sub){
      const tr = (p.tracks && p.tracks[sub]) ? p.tracks[sub] : [];
      for (const e of tr){
        if (Math.abs(xOf(e.t) - mx) < 10) return { type: "subkey", part: p, prop: sub, t: e.t };
      }
      return { type: "empty" };
    }
    for (const c of S.clips.filter(c => c.partId === p.id)){
      const x1 = xOf(c.start), x2 = xOf(c.start + c.dur);
      if (mx >= x1 - 4 && mx <= x2 + 4) return { type: "clip", clip: c, part: p, edge: Math.abs(mx - x2) <= 7 };
    }
    if (!p.subMode) for (const k of p.keys){
      if (Math.abs(xOf(k.t) - mx) < 10) return { type: "key", key: k, part: p };
    }
  }
  return { type: "playhead" };
}

tl.addEventListener("pointerdown", e => {
  if (e.button !== 0) return;   // 右键交给 contextmenu 处理，避免它顺带清空多选
  const mx = tlX(e), my = tlY(e);
  hideMenu();

  const hs = S.hsThumb;
  if (hs && my >= hs.y - 4 && my <= hs.y + hs.h + 5 && mx >= hs.tx0 - 2 && mx <= hs.tx0 + hs.trackW + 2){
    if (mx >= hs.x && mx <= hs.x + hs.w){
      tlDrag = { type: "hscroll", off: mx - hs.x };
    } else {
      S.scrollBeat = clamp((mx - hs.tx0 - hs.w/2) / Math.max(1, hs.trackW - hs.w) * S.maxScrollBeat, 0, S.maxScrollBeat);
      tlDrag = { type: "hscroll", off: hs.w/2 };
      drawTimeline();
    }
    try { tl.setPointerCapture(e.pointerId); } catch(err){}
    return;
  }

  const vs = S.vsThumb;
  if (vs && mx >= vs.x - 4 && my >= vs.y0 && my <= vs.y0 + vs.span){
    if (my >= vs.y && my <= vs.y + vs.h){
      tlDrag = { type: "vscroll", off: my - vs.y };
    } else {
      S.scrollRow = clamp((my - vs.y0 - vs.h/2) / Math.max(1, vs.span - vs.h) * S.maxRowScroll, 0, S.maxRowScroll);
      tlDrag = { type: "vscroll", off: vs.h/2 };
      drawTimeline();
    }
    try { tl.setPointerCapture(e.pointerId); } catch(err){}
    return;
  }

  /* 音频片段：拖中间移动，拖两端裁剪 */
  if (S.laneH && S.audio && my >= rulerH && my < rulerH + S.laneH && mx > labelW){
    const a0 = xOf(S.audioStart || 0);
    const a1 = xOf((S.audioStart || 0) + audioLenBeats());
    const E = 7;
    if (mx >= a0 - E && mx <= a1 + E){
      const mode = Math.abs(mx - a0) <= E ? "audio-l"
                 : (Math.abs(mx - a1) <= E ? "audio-r" : "audio-move");
      pushUndo(mode === "audio-move" ? "移动音频" : "裁剪音频");
      tlDrag = { type: mode, mx0: mx,
                 start0: S.audioStart || 0, in0: S.audioIn || 0, out0: audioOutSec() };
      try { tl.setPointerCapture(e.pointerId); } catch(err){}
      drawTimeline();
      return;
    }
  }

  if (mx < labelW && my > rulerH){
    const row = tlRows.find(r => my >= r.y && my <= r.y + rowH);
    if (row){
      if (!row.sub && mx >= labelW - 22){
        S.expandTracks[row.p.id] = !S.expandTracks[row.p.id];
        drawTimeline();
        return;
      }
      if (row.sub){ S.selected = row.p; S.curveProp = row.sub; renderAll(); }
      else selectPart(row.p);
    }
    return;
  }

  const hit = hitTestTimeline(mx, my);
  const additive = e.shiftKey || e.ctrlKey || e.metaKey;

  if (hit.type === "cue"){
    if (e.shiftKey){
      const i = S.selCues.indexOf(hit.idx);
      if (i >= 0) S.selCues.splice(i, 1); else S.selCues.push(hit.idx);
    } else if (S.selCues.indexOf(hit.idx) < 0){
      S.selCues = [hit.idx];
    }
    drawTimeline();
    if (!S.selCues.length) return;
    const idxs = S.selCues.slice();
    tlDrag = {
      type: "cue", idx: hit.idx, idxs,
      c0: idxs.map(i => S.cues[i]),
      anchor: S.cues[hit.idx]
    };
    try { tl.setPointerCapture(e.pointerId); } catch(err){}
    return;
  }

  if (hit.type === "clip"){
    if (S.selected !== hit.part) selectPart(hit.part);
    const already = S.selClips.indexOf(hit.clip) >= 0;
    if (!additive && already) S.selectedClip = hit.clip;
    else selClipToggle(hit.clip, additive);
    drawTimeline();
    if (additive) return;
    const items = S.selClips.map(c => ({ c, s0: c.start }));
    tlDrag = {
      type: hit.edge ? "clip-resize" : "clip-move",
      clip: hit.clip, grab: beatOf(mx) - hit.clip.start,
      anchorStart: hit.clip.start, items
    };
    try { tl.setPointerCapture(e.pointerId); } catch(err){}
    return;
  }

  if (hit.type === "subkey"){
    S.selected = hit.part;
    S.curveProp = hit.prop;
    if (!additive) S.selKeys = [];
    if (!isPointSel(hit.part, hit.prop, hit.t)){
      S.selKeys.push({ partId: hit.part.id, prop: hit.prop, t: hit.t });
    }
    S.selKey = { partId: hit.part.id, t: hit.t };
    if (!additive && Math.abs(S.beat - hit.t) > 1e-4) setBeat(hit.t);
    drawTimeline(); renderInspector();
    if (additive) return;
    /* ghost 模式：拖拽期间只记 delta，松手才真正改轨道 */
    tlDrag = { type: "subkey", anchor: hit.t, delta: 0, base: selectionToPoints() };
    try { tl.setPointerCapture(e.pointerId); } catch(err){}
    return;
  }

  if (hit.type === "key"){
    if (S.selected !== hit.part) selectPart(hit.part);
    const already = isPointSel(hit.part, null, hit.key.t);
    if (!additive && already){
      S.selKey = { partId: hit.part.id, t: hit.key.t };
    } else {
      if (!additive){ S.selKeys = []; S.selClips = []; S.selectedClip = null; }
      if (!already) S.selKeys.push({ partId: hit.part.id, t: hit.key.t });
      S.selKey = { partId: hit.part.id, t: hit.key.t };
    }
    if (!additive && Math.abs(S.beat - hit.key.t) > 1e-4) setBeat(hit.key.t);
    drawTimeline();
    if (additive) return;
    tlDrag = { type: "key", anchor: hit.key.t, delta: 0, base: selectionToPoints() };
    try { tl.setPointerCapture(e.pointerId); } catch(err){}
    return;
  }

  if (my < rulerH){
    tlDrag = { type: "playhead" };
    try { tl.setPointerCapture(e.pointerId); } catch(err){}
    scrubTo(mx);
    return;
  }

  tlDrag = { type: "maybe-marquee", x0: mx, y0: my, additive };
  try { tl.setPointerCapture(e.pointerId); } catch(err){}
});

/* 滚轮：Ctrl 缩放，Shift 左右滚，裸滚轮上下滚 */
/* 音频片段上给个可拖的手型 / 裁剪光标 */
tl.addEventListener("pointermove", e => {
  if (tlDrag) return;
  if (!S.laneH || !S.audio) return;
  const mx = tlX(e), my = tlY(e);
  if (my < rulerH || my >= rulerH + S.laneH || mx <= labelW) return;
  const a0 = xOf(S.audioStart || 0);
  const a1 = xOf((S.audioStart || 0) + audioLenBeats());
  const E = 7;
  tl.style.cursor = (Math.abs(mx - a0) <= E || Math.abs(mx - a1) <= E)
    ? "col-resize" : (mx > a0 && mx < a1 ? "grab" : "");
});
tl.addEventListener("pointerleave", () => { if (!tlDrag) tl.style.cursor = ""; });

tl.addEventListener("wheel", e => {
  e.preventDefault();
  if (e.ctrlKey || e.metaKey){
    const mx = Math.max(labelW + 8, tlX(e));
    zoomAt(S.zoom * (e.deltaY > 0 ? 0.88 : 1.14), mx);
  } else if (e.shiftKey){
    const d = Math.abs(e.deltaX) > Math.abs(e.deltaY) ? e.deltaX : e.deltaY;
    S.scrollBeat = clamp(S.scrollBeat + d / pxPerBeat, 0, S.maxScrollBeat);
    drawTimeline();
  } else {
    const d = Math.abs(e.deltaX) > Math.abs(e.deltaY) ? e.deltaX : e.deltaY;
    S.scrollRow = clamp(S.scrollRow + d, 0, S.maxRowScroll);
    drawTimeline();
  }
}, { passive: false });

/* ---------- 时间轴拖拽：移动 / 框选 / 滚动 ---------- */
let marqueeRAF = null;
function startMarqueeAutoScroll(){
  if (marqueeRAF) return;
  const step = () => {
    marqueeRAF = null;
    const m = S.marquee;
    if (!m || !tlDrag || tlDrag.type !== "marquee") return;
    /* 注意：m.mx / m.my 是相对时间轴的坐标，这里必须全用相对量，
       混进 getBoundingClientRect 的绝对坐标会让判断恒成立、一直朝一个方向滚。 */
    const W = tl.clientWidth, H = tl.clientHeight;
    const SPEED = 16;
    const lane = S.laneH || 0;
    const topY = rulerH + lane;
    const leftX = labelW;
    /* 触发区跟着高度走：时间轴矮的时候别让上下边缘区占满整块 */
    const EDGE_X = 40;
    const EDGE_Y = clamp(H * 0.1, 10, 26);
    let dx = 0, dy = 0;
    if (m.mx < leftX + EDGE_X) dx = -SPEED * Math.min(1, (leftX + EDGE_X - m.mx) / EDGE_X);
    else if (m.mx > W - EDGE_X) dx = SPEED * Math.min(1, (m.mx - (W - EDGE_X)) / EDGE_X);
    /* 底部基准要扣掉横向滚动条，否则触发区会被滚动条吃掉 */
    const bottomY = H - SB_H;
    if (m.my < topY + EDGE_Y) dy = -SPEED * Math.min(1, (topY + EDGE_Y - m.my) / EDGE_Y);
    else if (m.my > bottomY - EDGE_Y) dy = SPEED * Math.min(1, (m.my - (bottomY - EDGE_Y)) / EDGE_Y);
    if (!dx && !dy) return;
    S.scrollBeat = clamp(S.scrollBeat + dx / pxPerBeat, 0, S.maxScrollBeat);
    S.scrollRow = clamp(S.scrollRow + dy, 0, S.maxRowScroll);
    applyMarquee(true);
    drawTimeline();
    marqueeRAF = requestAnimationFrame(step);
  };
  marqueeRAF = requestAnimationFrame(step);
}

window.addEventListener("pointermove", e => {
  if (!tlDrag) return;
  const mx = tlX(e), my = tlY(e);
  const t = tlDrag.type;

  if (t === "playhead"){
    scrubTo(mx);
  } else if (t === "hscroll"){
    const hs = S.hsThumb;
    if (!hs) return;
    const ratio = (mx - tlDrag.off - hs.tx0) / Math.max(1, hs.trackW - hs.w);
    S.scrollBeat = clamp(ratio * S.maxScrollBeat, 0, S.maxScrollBeat);
    drawTimeline();
  } else if (t === "vscroll"){
    const vs = S.vsThumb;
    if (!vs) return;
    const ratio = (my - tlDrag.off - vs.y0) / Math.max(1, vs.span - vs.h);
    S.scrollRow = clamp(ratio * S.maxRowScroll, 0, S.maxRowScroll);
    drawTimeline();
  } else if (t === "cue"){
    let b = Math.max(0, beatOf(mx));
    if (S.snap) b = Math.round(b * 4) / 4;
    const delta = b - tlDrag.anchor;
    tlDrag.idxs.forEach((idx, k) => { S.cues[idx] = Math.max(0, tlDrag.c0[k] + delta); });
    drawTimeline();
  } else if (t === "audio-move" || t === "audio-l" || t === "audio-r"){
    const db = (mx - tlDrag.mx0) / pxPerBeat;
    if (t === "audio-move"){
      S.audioStart = round4(tlDrag.start0 + db);
    } else if (t === "audio-l"){
      const secPerBeat = 60 / S.bpm;
      let ni = Math.max(0, tlDrag.in0 + db * secPerBeat);
      ni = Math.min(ni, tlDrag.out0 - 0.08);
      S.audioIn = ni;
      S.audioStart = round4(tlDrag.start0 + (ni - tlDrag.in0) / secPerBeat);
    } else {
      const secPerBeat = 60 / S.bpm;
      let no = clamp(tlDrag.out0 + db * secPerBeat, (S.audioIn || 0) + 0.08, S.audioDur || 1e9);
      S.audioOut = no;
    }
    drawTimeline(); updateTime();
  } else if (t === "subkey" || t === "key"){
    let b = Math.max(0, beatOf(mx));
    if (S.snap) b = Math.round(b * 4) / 4;
    const delta = b - tlDrag.anchor;
    if (Math.abs(delta - tlDrag.delta) < 1e-6) return;
    tlDrag.delta = delta;
    const first = tlDrag.base[0];
    if (first) S.beat = Math.max(0, first.t + delta);
    applyAt(S.beat); draw(); drawTimeline(); updateTime();
  } else if (t === "clip-move"){
    let b = Math.max(0, beatOf(mx) - tlDrag.grab);
    if (S.snap) b = Math.round(b * 4) / 4;
    const delta = b - tlDrag.anchorStart;
    tlDrag.items.forEach(it => { it.c.start = Math.max(0, it.s0 + delta); });
    applyAt(S.beat); draw(); drawTimeline();
  } else if (t === "clip-resize"){
    let b = beatOf(mx) - tlDrag.clip.start;
    if (S.snap) b = Math.round(b * 4) / 4;
    tlDrag.clip.dur = Math.max(0.25, b);
    applyAt(S.beat); draw(); drawTimeline();
  } else if (t === "maybe-marquee" || t === "marquee"){
    const lane = S.laneH || 0;
    if (t === "maybe-marquee"){
      if (Math.hypot(mx - tlDrag.x0, my - tlDrag.y0) < 4) return;
      tlDrag.type = "marquee";
      tlDrag.b0 = beatOf(tlDrag.x0);
      tlDrag.r0 = (tlDrag.y0 - rulerH - lane + S.scrollRow) / rowH;
    }
    S.marquee = {
      b0: tlDrag.b0, b1: beatOf(mx),
      r0: tlDrag.r0, r1: (my - rulerH - lane + S.scrollRow) / rowH,
      mx: mx, my: my
    };
    applyMarquee(tlDrag.additive);
    drawTimeline();
    startMarqueeAutoScroll();
  }
});

window.addEventListener("pointerup", () => {
  if (!tlDrag) return;
  const t = tlDrag.type;
  const startX = tlDrag.x0;

  if (t === "cue"){
    S.cues.sort((a, b) => a - b);
    S.selCues = [];
    drawTimeline();
  }

  if (t === "subkey" || t === "key"){
    const delta = tlDrag.delta || 0;
    const base = tlDrag.base || [];
    if (Math.abs(delta) > 1e-6 && base.length){
      pushUndo("移动关键帧");
      const dir = delta >= 0 ? 1 : -1;
      const byPart = new Map();
      for (const it of base){
        if (!byPart.has(it.partId)) byPart.set(it.partId, []);
        byPart.get(it.partId).push({ prop: it.prop, from: it.t, to: Math.max(0, it.t + delta) });
      }
      for (const [partId, moves] of byPart){
        const p = S.parts.find(x => x.id === partId);
        if (p) moveKeyPoints(p, moves, dir);
      }
      S.selKeys = base.map(it => ({ partId: it.partId, prop: it.prop, t: Math.max(0, it.t + delta) }));
      const prim = S.selKeys[0];
      S.selKey = prim ? { partId: prim.partId, t: prim.t } : null;
      if (prim){ S.beat = prim.t; S.curveProp = prim.prop; }
    }
    tlDrag = null;
    S.marquee = null;
    if (marqueeRAF){ cancelAnimationFrame(marqueeRAF); marqueeRAF = null; }
    applyAt(S.beat); renderAll();
    return;
  }

  tlDrag = null;
  S.marquee = null;
  if (marqueeRAF){ cancelAnimationFrame(marqueeRAF); marqueeRAF = null; }

  if (t === "maybe-marquee"){
    scrubTo(startX);
  } else if (t === "playhead" || t === "hscroll" || t === "vscroll"){
    drawTimeline();
  } else {
    drawTimeline();
  }
});

function applyMarquee(additive){
  const m = S.marquee;
  if (!m) return;
  /* 用「拍 / 行号」这种世界坐标，滚动时框选范围不会漂 */
  const b0 = Math.min(m.b0, m.b1), b1 = Math.max(m.b0, m.b1);
  const r0 = Math.min(m.r0, m.r1), r1 = Math.max(m.r0, m.r1);
  if (!additive){ S.selKeys = []; S.selClips = []; }

  for (const row of tlRows){
    const ri = (row.y - rulerH - (S.laneH || 0) + S.scrollRow) / rowH;
    if (ri + 1 < r0 || ri > r1) continue;
    const p = row.p, sub = row.sub;
    if (sub){
      for (const e of (p.tracks && p.tracks[sub] ? p.tracks[sub] : [])){
        if (e.t >= b0 - 1e-6 && e.t <= b1 + 1e-6 && !isPointSel(p, sub, e.t))
          S.selKeys.push({ partId: p.id, prop: sub, t: e.t });
      }
      continue;
    }
    if (!p.subMode){
      for (const k of p.keys){
        if (k.t >= b0 - 1e-6 && k.t <= b1 + 1e-6 && !isPointSel(p, null, k.t))
          S.selKeys.push({ partId: p.id, t: k.t });
      }
    }
    for (const c of S.clips.filter(c => c.partId === p.id)){
      const cx = c.start + c.dur / 2;
      if (cx >= b0 && cx <= b1 && S.selClips.indexOf(c) < 0) S.selClips.push(c);
    }
  }
  const lastK = S.selKeys[S.selKeys.length - 1];
  S.selKey = lastK ? { partId: lastK.partId, t: selTime(lastK) } : null;
  S.selectedClip = S.selClips[0] || null;
}

function scrubTo(mx){
  if (S.playing) stop();
  let b = Math.max(0, beatOf(mx));
  if (S.snap) b = Math.round(b * 4) / 4;
  if (S.selKey && Math.abs(S.selKey.t - b) > 1e-4) S.selKey = null;
  setBeat(b);
}

/* ============================ 复制 / 粘贴 / 右键菜单 ============================ */
let clipboard = null;

function clipName(c){ const a = ACTION_LIB.find(x => x.id === c.actionId); return a ? a.name : "动作"; }

function copySelection(){
  if (S.selClips.length){
    const items = S.selClips.map(c => JSON.parse(JSON.stringify(c)));
    clipboard = { kind: "clips", items };
    toast(items.length > 1 ? "已复制 " + items.length + " 个片段" : "已复制片段「" + clipName(S.selClips[0]) + "」");
    return true;
  }
  if (S.selKeys.length){
    const items = selectionToPoints().map(x => ({ ...x }));
    if (!items.length){ toast("选中的位置上没有关键帧"); return false; }
    clipboard = { kind: "keys", items };
    toast(items.length > 1 ? "已复制 " + items.length + " 个关键帧" : "已复制关键帧");
    return true;
  }
  toast("先选中片段或关键帧");
  return false;
}

function deleteSelection(){
  if (!hasSel()) return false;
  pushUndo("删除选中");
  S.selClips.forEach(c => { S.clips = S.clips.filter(x => x !== c); });
  /* v2：按时间点逐轨道删除，绝不走 p.keys 的聚合往返（那会把所有轨道补满） */
  removePoints(selectionToPoints());
  clearSel();
  applyAt(S.beat); renderAll();
  return true;
}

function cutSelection(){
  if (copySelection()) deleteSelection();
}

function pasteClipboard(){
  if (!clipboard){ toast("剪贴板是空的"); return; }
  const at = S.snap ? Math.round(S.beat * 4) / 4 : S.beat;

  if (clipboard.kind === "clips"){
    const items = clipboard.items;
    const t0 = Math.min.apply(null, items.map(c => c.start));
    const single = items.length === 1;
    const made = [];
    items.forEach(src => {
      const target = (single && S.selected) ? S.selected : S.parts.find(p => p.id === src.partId);
      if (!target) return;
      const base = (target.id === src.partId) ? src.base : {
        x: target.x, y: target.y, rot: target.rot,
        sx: target.sx, sy: target.sy, alpha: target.alpha, tex: target.texIndex
      };
      const c = Object.assign({}, JSON.parse(JSON.stringify(src)), {
        base, id: "c" + (++uid), partId: target.id,
        start: Math.max(0, at + (src.start - t0))
      });
      S.clips.push(c);
      made.push(c);
    });
    if (!made.length){ toast("没有可用的目标图层"); return; }
    S.selClips = made; S.selectedClip = made[0];
    S.selKeys = []; S.selKey = null;
    applyAt(S.beat); renderAll();
    toast("已粘贴 " + made.length + " 个片段");
    return;
  }

  const items = (clipboard.items || []).filter(i => i && i.prop && i.t !== undefined);
  if (!items.length){ toast("剪贴板里没有可粘贴的关键帧"); return; }
  pushUndo();
  const t0 = Math.min.apply(null, items.map(i => i.t));
  const single = items.length === 1;
  const made = [];
  items.forEach(it => {
    const target = (single && S.selected) ? S.selected : S.parts.find(p => p.id === it.partId);
    if (!target) return;
    const t = Math.max(0, at + (it.t - t0));
    setTrackKey(target, it.prop, t, it.v, it.ease);
    made.push({ partId: target.id, prop: it.prop, t });
  });
  if (!made.length){ toast("没有可用的目标图层"); return; }
  S.selKeys = made;
  S.selKey = { partId: made[made.length - 1].partId, t: made[made.length - 1].t };
  S.selClips = []; S.selectedClip = null;
  applyAt(S.beat); renderAll();
  toast("已粘贴 " + made.length + " 个关键帧");
}

function duplicateSelection(){
  if (S.selClips.length){
    pushUndo();
    const items = S.selClips.map(c => JSON.parse(JSON.stringify(c)));
    const t0 = Math.min.apply(null, items.map(c => c.start));
    const end = Math.max.apply(null, items.map(c => c.start + c.dur));
    const made = items.map(src => {
      const c = Object.assign({}, src, { id: "c" + (++uid), start: Math.max(0, end + (src.start - t0)) });
      S.clips.push(c);
      return c;
    });
    S.selClips = made; S.selectedClip = made[0];
    S.selKeys = []; S.selKey = null;
    applyAt(S.beat); renderAll();
    toast("已创建 " + made.length + " 个副本");
    return;
  }
  if (S.selKeys.length){
    pushUndo("创建副本");
    const items = selectionToPoints().map(x => ({ ...x }));
    const t0 = Math.min.apply(null, items.map(i => i.t));
    const maxT = Math.max.apply(null, items.map(i => i.t));
    const made = [];
    items.forEach(it => {
      const p = S.parts.find(x => x.id === it.partId);
      if (!p) return;
      const t = maxT + 1 + (it.t - t0);
      setTrackKey(p, it.prop, t, it.v, it.ease);
      made.push({ partId: p.id, prop: it.prop, t });
    });
    S.selKeys = made;
    S.selKey = made.length ? { partId: made[made.length - 1].partId, t: made[made.length - 1].t } : null;
    S.selClips = []; S.selectedClip = null;
    applyAt(S.beat); renderAll();
    toast("已创建 " + made.length + " 个副本");
    return;
  }
  toast("先选中片段或关键帧");
}

const ctxMenu = document.getElementById("ctxMenu");
function hideMenu(){ ctxMenu.style.display = "none"; }
function showMenu(x, y, items){
  ctxMenu.innerHTML = "";
  items.forEach(it => {
    if (it === "-"){ ctxMenu.appendChild(document.createElement("hr")); return; }
    const d = document.createElement("div");
    d.className = "mi" + (it.disabled ? " dim" : "");
    d.innerHTML = "<span>" + it.label + "</span>" + (it.key ? "<em>" + it.key + "</em>" : "");
    if (!it.disabled) d.onclick = () => { hideMenu(); it.fn(); };
    ctxMenu.appendChild(d);
  });
  ctxMenu.style.display = "block";
  const r = ctxMenu.getBoundingClientRect();
  ctxMenu.style.left = Math.min(x, window.innerWidth - r.width - 8) + "px";
  ctxMenu.style.top = Math.min(y, window.innerHeight - r.height - 8) + "px";
}

tl.addEventListener("contextmenu", e => {
  e.preventDefault();
  const mx = tlX(e), my = tlY(e);
  const hit = hitTestTimeline(mx, my);
  if (hit.type === "clip"){
    // 右键已选中的项时保留多选，否则「镜像选中的关键帧」只会作用到一个
    if (!S.selClips.includes(hit.clip)){
      if (S.selected !== hit.part) selectPart(hit.part);
      selClipToggle(hit.clip, false);
    }
    drawTimeline();
  } else if (hit.type === "subkey"){
    if (!isPointSel(hit.part, hit.prop, hit.t)){
      if (S.selected !== hit.part) selectPart(hit.part);
      S.selKeys = [{ partId: hit.part.id, prop: hit.prop, t: hit.t }];
      S.selKey = { partId: hit.part.id, t: hit.t };
      S.curveProp = hit.prop;
    }
    drawTimeline();
  } else if (hit.type === "key"){
    if (!isPointSel(hit.part, null, hit.key.t)){
      if (S.selected !== hit.part) selectPart(hit.part);
      S.selKeys = [{ partId: hit.part.id, t: hit.key.t }];
      S.selKey = { partId: hit.part.id, t: hit.key.t };
    }
    drawTimeline();
  }
  const anySel = hasSel();
  const items = [];
  if (anySel){
    items.push({ label: "复制", key: "Ctrl+C", fn: copySelection });
    items.push({ label: "剪切", key: "Ctrl+X", fn: cutSelection });
    items.push({ label: "创建副本", key: "Ctrl+D", fn: duplicateSelection });
    if (S.selClips.length === 1){
      items.push("-");
      items.push({ label: "分解为关键帧", fn: () => expandClip(S.selClips[0]) });
    }
  }
  if (S.selKeys.length || S.selClips.length){
    items.push("-");
    items.push({ label: "镜像选中（水平）", key: "Shift+H", fn: () => mirrorSelection("x") });
    items.push({ label: "镜像选中（垂直）", key: "Shift+V", fn: () => mirrorSelection("y") });
  }
  items.push({ label: "粘贴到播放头", key: "Ctrl+V", disabled: !clipboard, fn: pasteClipboard });
  if (anySel){
    items.push("-");
    items.push({ label: "删除", key: "Del", fn: deleteSelection });
  }
  showMenu(e.clientX, e.clientY, items);
});
