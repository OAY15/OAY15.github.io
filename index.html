/* ============================ 蒙版（Alpha 裁剪） ============================
 * 一层最多挂一个裁剪源：源图层的透明度决定这一层显示哪里。
 * 被裁图层先画到离屏 A，裁剪源画到离屏 B，用 destination-in/out 合成后再贴回主画布。
 */
let clipCanvasA = null, clipCanvasB = null;

function scratchCanvas(which, W, H, dpr, rect){
  let c = which === "a" ? clipCanvasA : clipCanvasB;
  if (!c){
    c = document.createElement("canvas");
    if (which === "a") clipCanvasA = c; else clipCanvasB = c;
  }
  const resized = c.width !== Math.round(W * dpr) || c.height !== Math.round(H * dpr);
  if (resized){
    c.width = Math.round(W * dpr);
    c.height = Math.round(H * dpr);
  }
  const g = c.getContext("2d");
  g.setTransform(dpr, 0, 0, dpr, 0, 0);
  // 只清要用的那块，整块清屏在 4K 视口上很贵
  if (rect && !resized) g.clearRect(rect.x, rect.y, rect.w, rect.h);
  else g.clearRect(0, 0, W, H);
  return { c, g };
}

function screenAABB(p){
  const it = p.variants[p.texIndex] || p.variants[0];
  if (!it) return null;
  const m = worldOf(p), bb = it.bbox;
  // 贴图是以轴心为原点画的（paintPart 里用 -ax/-ay），这里必须减掉轴心
  const pts = [[bb.x - it.ax, bb.y - it.ay], [bb.x + bb.w - it.ax, bb.y - it.ay],
               [bb.x - it.ax, bb.y + bb.h - it.ay], [bb.x + bb.w - it.ax, bb.y + bb.h - it.ay]]
    .map(([u, v]) => [m.a * u + m.c * v + m.e, m.b * u + m.d * v + m.f]);
  let x0 = Infinity, y0 = Infinity, x1 = -Infinity, y1 = -Infinity;
  for (const [x, y] of pts){
    if (x < x0) x0 = x; if (y < y0) y0 = y;
    if (x > x1) x1 = x; if (y > y1) y1 = y;
  }
  return { x0, y0, x1, y1 };
}

function paintMaybeClipped(g, p, it, m, W, H, dpr){
  const src = (p.clip && p.clip.srcId && p.clip.srcId !== p.id)
    ? S.parts.find(q => q.id === p.clip.srcId) : null;
  const srcIt = src ? (src.variants[src.texIndex] || src.variants[0]) : null;
  if (!srcIt){ paintPart(g, p, it, m); return; }

  // 只在这一层和裁剪源的包围盒里合成，别整块画布来回搬
  const a = screenAABB(p), b = screenAABB(src);
  if (!a || !b){ paintPart(g, p, it, m); return; }
  const pad = 2;
  let x0 = Math.max(0, Math.floor(Math.min(a.x0, b.x0) - pad));
  let y0 = Math.max(0, Math.floor(Math.min(a.y0, b.y0) - pad));
  let x1 = Math.min(W, Math.ceil(Math.max(a.x1, b.x1) + pad));
  let y1 = Math.min(H, Math.ceil(Math.max(a.y1, b.y1) + pad));
  if (x1 <= x0 || y1 <= y0){ return; }
  const bw = x1 - x0, bh = y1 - y0;

  const A = scratchCanvas("a", W, H, dpr, { x: x0, y: y0, w: bw, h: bh });
  A.g.save();
  A.g.beginPath(); A.g.rect(x0, y0, bw, bh); A.g.clip();
  paintPart(A.g, p, it, m);
  A.g.restore();

  const sx = Math.round(x0 * dpr), sy = Math.round(y0 * dpr);
  const sw = Math.round(bw * dpr), sh = Math.round(bh * dpr);

  // 直接把裁剪源画进 A 做合成，省掉第二块离屏和一次全画布拷贝
  A.g.save();
  A.g.beginPath(); A.g.rect(x0, y0, bw, bh); A.g.clip();
  A.g.globalCompositeOperation = p.clip.invert ? "destination-out" : "destination-in";
  paintPart(A.g, src, srcIt, worldOf(src));
  A.g.restore();

  g.drawImage(A.c, sx, sy, sw, sh, x0, y0, bw, bh);
}

function drawParts(g, W, H, dpr){
  for (const p of S.parts){
    if (!p.visible) continue;
    const it = p.variants[p.texIndex] || p.variants[0];
    if (!it) continue;
    paintMaybeClipped(g, p, it, worldOf(p), W, H, dpr);
  }
}

function draw(){
  const dpr = window.devicePixelRatio || 1;
  const W = view.clientWidth, H = view.clientHeight;
  if (view.width !== Math.round(W*dpr) || view.height !== Math.round(H*dpr)){
    view.width = Math.round(W*dpr); view.height = Math.round(H*dpr);
  }
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.clearRect(0, 0, W, H);
  ctx.fillStyle = TH.stage;
  ctx.fillRect(0, 0, W, H);

  const v = S.view, d = S.doc;
  const fx = v.ox, fy = v.oy, fw = d.w * v.scale, fh = d.h * v.scale;

  ctx.save();
  ctx.shadowColor = "rgba(0,0,0,.55)"; ctx.shadowBlur = 18;
  ctx.fillStyle = "#000";
  ctx.fillRect(fx, fy, fw, fh);
  ctx.restore();

  ctx.save();
  ctx.beginPath(); ctx.rect(fx, fy, fw, fh); ctx.clip();
  drawBackground();

  drawParts(ctx, W, H, dpr);
  ctx.restore();

  ctx.strokeStyle = TH.gizmo;
  ctx.lineWidth = 1;
  ctx.strokeRect(fx + .5, fy + .5, fw - 1, fh - 1);

  if (S.selected && S.selected.visible && !S.crop) drawGizmo(S.selected);
  if (S.crop) drawCropOverlay();
}

/* ============================ 变换手柄 ============================ */
const GIZ = { btnR: 11, btnHit: 14, dotR: 5, dotHit: 11, gap: 13 };

function gizmoQuad(p){
  const it = p.variants[p.texIndex] || p.variants[0];
  if (!it) return null;
  const m = worldOf(p), bb = it.bbox;
  const L = [[bb.x - it.ax, bb.y - it.ay], [bb.x + bb.w - it.ax, bb.y - it.ay],
             [bb.x + bb.w - it.ax, bb.y + bb.h - it.ay], [bb.x - it.ax, bb.y + bb.h - it.ay]];
  const pts = L.map(([u, v]) => ({ x: m.a*u + m.c*v + m.e, y: m.b*u + m.d*v + m.f }));
  const cx = (pts[0].x + pts[1].x + pts[2].x + pts[3].x) / 4;
  const cy = (pts[0].y + pts[1].y + pts[2].y + pts[3].y) / 4;
  return { pts, cx, cy, m, it, L };
}

function gizmoButtons(g){
  const W = view.clientWidth || 900, H = view.clientHeight || 600;
  const put = (i, type) => {
    const c = g.pts[i];
    const a = g.pts[(i + 1) % 4], b = g.pts[(i + 3) % 4];
    const ux = c.x - a.x, uy = c.y - a.y, ul = Math.hypot(ux, uy) || 1;
    const vx = c.x - b.x, vy = c.y - b.y, vl = Math.hypot(vx, vy) || 1;
    let dx = ux/ul + vx/vl, dy = uy/ul + vy/vl;
    const dl = Math.hypot(dx, dy) || 1;
    dx /= dl; dy /= dl;
    const off = GIZ.btnR + GIZ.gap;
    return {
      type, i,
      x: clamp(c.x + dx*off, GIZ.btnR + 2, W - GIZ.btnR - 2),
      y: clamp(c.y + dy*off, GIZ.btnR + 2, H - GIZ.btnR - 2)
    };
  };
  return [put(0, "del"), put(3, "dup"), put(2, "rot")];
}

function drawGizmo(p){
  const g = gizmoQuad(p);
  if (!g) return;
  const { pts, m } = g;
  const locked = p.locked;

  ctx.save();
  ctx.strokeStyle = locked ? "rgba(136,135,128,.9)" : "rgba(255,255,255,.9)";
  ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.moveTo(pts[0].x, pts[0].y);
  for (let i = 1; i < 4; i++) ctx.lineTo(pts[i].x, pts[i].y);
  ctx.closePath();
  ctx.stroke();

  if (!locked){
    for (const c of pts){
      ctx.beginPath(); ctx.arc(c.x, c.y, GIZ.dotR, 0, Math.PI*2);
      ctx.fillStyle = "#fff"; ctx.fill();
      ctx.strokeStyle = "rgba(0,0,0,.45)"; ctx.lineWidth = 1; ctx.stroke();
    }
  }

  ctx.fillStyle = locked ? TH.rowLabelOff : TH.accent;
  ctx.beginPath(); ctx.arc(m.e, m.f, 3.5, 0, Math.PI*2); ctx.fill();

  if (S.pivotMode){
    ctx.strokeStyle = TH.warn;
    ctx.lineWidth = 1.2;
    ctx.beginPath(); ctx.moveTo(m.e - 15, m.f); ctx.lineTo(m.e + 15, m.f); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(m.e, m.f - 15); ctx.lineTo(m.e, m.f + 15); ctx.stroke();
    ctx.beginPath(); ctx.arc(m.e, m.f, 9, 0, Math.PI*2); ctx.stroke();
  }

  if (!locked){
    for (const b of gizmoButtons(g)){
      ctx.beginPath(); ctx.arc(b.x, b.y, GIZ.btnR, 0, Math.PI*2);
      ctx.fillStyle = "rgba(255,255,255,.96)"; ctx.fill();
      ctx.strokeStyle = "rgba(0,0,0,.25)"; ctx.lineWidth = 1; ctx.stroke();

      ctx.save();
      ctx.translate(b.x, b.y);
      ctx.strokeStyle = TH.tlBg; ctx.fillStyle = TH.tlBg;
      if (b.type === "del"){
        ctx.lineWidth = 1.5; ctx.lineCap = "round";
        ctx.beginPath(); ctx.moveTo(-3, -3); ctx.lineTo(3, 3); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(3, -3); ctx.lineTo(-3, 3); ctx.stroke();
      } else if (b.type === "dup"){
        ctx.font = "bold 9px -apple-system,system-ui,sans-serif";
        ctx.textAlign = "center"; ctx.textBaseline = "middle";
        ctx.fillText("+1", 0, 0.5);
      } else {
        ctx.lineWidth = 1.3; ctx.lineCap = "round";
        ctx.beginPath(); ctx.arc(0, 0, 4, -Math.PI*0.72, Math.PI*0.62); ctx.stroke();
        const th = Math.PI*0.62;
        const ex = Math.cos(th)*4, ey = Math.sin(th)*4;
        const tx = -Math.sin(th), ty = Math.cos(th);
        const px = -ty, py = tx;
        ctx.beginPath();
        ctx.moveTo(ex + tx*2.6, ey + ty*2.6);
        ctx.lineTo(ex - tx*0.9 + px*2.1, ey - ty*0.9 + py*2.1);
        ctx.lineTo(ex - tx*0.9 - px*2.1, ey - ty*0.9 - py*2.1);
        ctx.closePath(); ctx.fill();
      }
      ctx.restore();
    }
  }

  if (gizmoDrag && gizmoDrag.type === "rot"){
    const deg = Math.round(p.rot*180/Math.PI);
    ctx.font = "bold 11px -apple-system,system-ui,sans-serif";
    ctx.textAlign = "center"; ctx.textBaseline = "middle";
    const label = deg + "°";
    const w = ctx.measureText(label).width + 12;
    ctx.fillStyle = "rgba(0,0,0,.75)";
    roundRect(ctx, m.e - w/2, m.f - 38, w, 19, 5); ctx.fill();
    ctx.fillStyle = "#fff";
    ctx.fillText(label, m.e, m.f - 28.5);
  }
  ctx.restore();
}

function hitGizmo(mx, my){
  if (!S.selected || !S.selected.visible || S.selected.locked) return null;
  const g = gizmoQuad(S.selected);
  if (!g) return null;
  for (const b of gizmoButtons(g)){
    if (Math.hypot(mx - b.x, my - b.y) <= GIZ.btnHit) return { type: b.type, i: b.i, g };
  }
  /* 小部件的四角圆点会重叠，取最近的那个，否则永远命中编号最小的角 */
  let best = -1, bestD = GIZ.dotHit;
  for (let i = 0; i < 4; i++){
    const d = Math.hypot(mx - g.pts[i].x, my - g.pts[i].y);
    if (d <= bestD){ bestD = d; best = i; }
  }
  return best >= 0 ? { type: "scale", i: best, g } : null;
}

function deletePart(p){
  const par = p.parentId ? S.parts.find(q => q.id === p.parentId) : null;
  for (const c of S.parts){
    if (c.parentId !== p.id) continue;
    const w = worldOf(c);
    c.parentId = par ? par.id : null;
    const pm = par ? worldOf(par) : rootMatrix();
    const d = invLinear(pm, w.e - pm.e, w.f - pm.f);
    c.x = d.x; c.y = d.y;
  }
  S.parts = S.parts.filter(q => q.id !== p.id);
  S.clips = S.clips.filter(c => c.partId !== p.id);
  for (const q of S.parts){
    if (q.clip && q.clip.srcId === p.id) q.clip = null;   // 蒙版源被删，引用一起清掉
  }
  S.selected = null; S.selectedClip = null; S.selKey = null;
  applyAt(S.beat); renderAll();
  toast("已删除「" + p.slot + "」，可撤销");
}

function duplicatePart(p){
  const variants = p.variants.map(v => ({ variant: v.variant, img: v.img, bbox: v.bbox, ax: v.ax, ay: v.ay, thumb: v.thumb }));
  const np = {
    id: nid(), slot: p.slot + " 副本", kind: p.kind, variants, texIndex: p.texIndex,
    x: p.x + 40, y: p.y + 40, rot: p.rot, sx: p.sx, sy: p.sy, alpha: p.alpha,
    ax: p.ax, ay: p.ay, pu: p.pu, pv: p.pv, parentId: p.parentId,
    notes: partNotes(p).map(n => ({ ...n })),
    text: p.text ? { ...p.text } : null,
    defTex: p.defTex | 0, visible: true, locked: false, bbox: p.bbox,
    tracks: JSON.parse(JSON.stringify(p.tracks || {})),
    bendKeys: JSON.parse(JSON.stringify(p.bendKeys || [])),
    rest: p.rest ? { ...p.rest } : null,
    subMode: !!p.subMode,
    folderId: p.folderId || null,
    shape: p.shape ? { ...p.shape } : null,
    clip: p.clip ? { ...p.clip } : null
  };
  initTracks(np);
  S.parts.push(np);
  S.selected = np; S.selectedClip = null; S.selKey = null;
  if (np.kind === "text") refreshTextLayer(np);
  renderAll();
  toast("已复制「" + p.slot + "」");
}

/* ============================ 时间轴 ============================ */
let totalBeats = 16, pxPerBeat = 60, labelW = 96, rulerH = 22, rowH = 18;
const tlRows = [];

const SB_H = 9;

function timelineLayout(){
  const W = tl.clientWidth || 800, H = tl.clientHeight || 150;
  const lastKey = S.parts.reduce((m, p) => p.keys.reduce((mm, k) => Math.max(mm, k.t), m), 0);
  const lastCue = S.cues.reduce((m, c) => Math.max(m, c), 0);
  const audioBeats = S.audio ? Math.max(0, (S.audioStart || 0) + audioLenBeats()) : 0;
  const clipEnd = S.clips.reduce((m, c) => Math.max(m, c.start + c.dur), 0);
  const midiBeats = S.midi ? (S.midi.durBeat || 0) : 0;
  totalBeats = Math.max(S.sig * 4, Math.ceil(Math.max(lastKey, lastCue, audioBeats, clipEnd, midiBeats, S.beat) + 2));

  labelW = 96;
  const availW = Math.max(60, W - labelW - 10);
  const fit = availW / totalBeats;
  pxPerBeat = fit * S.zoom;

  const visibleBeats = availW / pxPerBeat;
  S.visibleBeats = visibleBeats;
  const maxScroll = Math.max(0, totalBeats - visibleBeats);
  S.scrollBeat = clamp(S.scrollBeat, 0, maxScroll);
  S.maxScrollBeat = maxScroll;

  const list = S.parts.slice().reverse();
  // 有音乐就给它一条固定高度的轨道（不随图层滚动）
  const laneH = S.audio ? 26 : 0;
  S.laneH = laneH;
  const availH = Math.max(20, H - rulerH - laneH - 4 - SB_H);
  let rowCount = 0;
  for (const q of list) rowCount += 1 + ((q.subMode || S.expandTracks[q.id]) ? TRACK_PROPS.length : 0);
  rowH = rowCount ? clamp(availH / rowCount, 14, 26) : 18;
  const contentH = rowCount * rowH;
  const maxRowScroll = Math.max(0, contentH - availH);
  S.scrollRow = clamp(S.scrollRow, 0, maxRowScroll);
  S.maxRowScroll = maxRowScroll;
  S.availH = availH;

  tlRows.length = 0;
  let ri = 0;
  for (const q of list){
    tlRows.push({ p: q, sub: null, y: rulerH + laneH + ri * rowH - S.scrollRow });
    ri++;
    if (q.subMode || S.expandTracks[q.id]){
      for (const k of TRACK_PROPS){
        tlRows.push({ p: q, sub: k, y: rulerH + laneH + ri * rowH - S.scrollRow });
        ri++;
      }
    }
  }
  return { W, H, availW, contentH, maxRowScroll, availH };
}
const xOf = b => labelW + (b - S.scrollBeat) * pxPerBeat;
const beatOf = x => S.scrollBeat + (x - labelW) / pxPerBeat;

function zoomAt(newZoom, anchorX){
  const W = tl.clientWidth || 800;
  const availW = W - labelW - 10;
  const b = beatOf(anchorX);
  S.zoom = clamp(newZoom, 0.2, 40);
  pxPerBeat = (availW / totalBeats) * S.zoom;
  S.scrollBeat = Math.max(0, b - (anchorX - labelW) / pxPerBeat);
  drawTimeline();
  syncZoomLabel();
}
function setZoom(z){
  const W = tl.clientWidth || 800;
  zoomAt(z, labelW + (W - labelW) / 2);
}
function zoomFit(){
  S.zoom = 1; S.scrollBeat = 0; S.scrollRow = 0;
  drawTimeline(); syncZoomLabel();
}
function syncZoomLabel(){
  const el = document.getElementById("zoomLabel");
  if (el) el.textContent = Math.round(S.zoom * 100) + "%";
}

function roundRect(g, x, y, w, h, r){
  const rr = Math.min(r, Math.abs(w)/2, Math.abs(h)/2);
  g.beginPath();
  g.moveTo(x + rr, y);
  g.lineTo(x + w - rr, y);
  g.quadraticCurveTo(x + w, y, x + w, y + rr);
  g.lineTo(x + w, y + h - rr);
  g.quadraticCurveTo(x + w, y + h, x + w - rr, y + h);
  g.lineTo(x + rr, y + h);
  g.quadraticCurveTo(x, y + h, x, y + h - rr);
  g.lineTo(x, y + rr);
  g.quadraticCurveTo(x, y, x + rr, y);
  g.closePath();
}

/* 波形缓存：只在滚动/缩放/换主题/换音频时重算，播放时每帧只 blit 一次 */
let waveCanvas = null, waveKey = "";
function waveformCache(W, H, dpr){
  const pk = S.audioPeaks;
  const laneH = S.laneH || 0;
  if (!pk || !laneH) return null;
  const key = [S.scrollBeat.toFixed(3), pxPerBeat.toFixed(3), W, H, THEME, S.bpm,
               (S.audioStart || 0).toFixed(3), (S.audioIn || 0).toFixed(3), audioOutSec().toFixed(3), pk.data.length].join("|");
  if (waveCanvas && waveKey === key) return waveCanvas;
  if (!waveCanvas) waveCanvas = document.createElement("canvas");
  if (waveCanvas.width !== Math.round(W * dpr) || waveCanvas.height !== Math.round(H * dpr)){
    waveCanvas.width = Math.round(W * dpr); waveCanvas.height = Math.round(H * dpr);
  }
  const g = waveCanvas.getContext("2d");
  g.setTransform(dpr, 0, 0, dpr, 0, 0);
  g.clearRect(0, 0, W, H);
  const mid = rulerH + laneH / 2, half = laneH / 2 - 4;
  g.fillStyle = TH.wave;
  const clipX0 = Math.max(labelW, xOf(S.audioStart || 0));
  const clipX1 = Math.min(W - 4, xOf((S.audioStart || 0) + audioLenBeats()));
  for (let x = Math.floor(clipX0); x < clipX1; x++){
    const s0 = audioSecAtBeat(beatOf(x)) * pk.perSec;
    const s1 = audioSecAtBeat(beatOf(x + 1)) * pk.perSec;
    const i0 = Math.max(0, Math.floor(s0)), i1 = Math.min(pk.data.length - 1, Math.ceil(s1));
    let mx = 0;
    for (let i = i0; i <= i1; i++){ const v = pk.data[i]; if (v > mx) mx = v; }
    if (mx <= 0.002) continue;
    const h = Math.max(0.7, mx * half);
    g.fillRect(x, mid - h, 1, h * 2);
  }
  waveKey = key;
  return waveCanvas;
}

function drawTimeline(){
  const dpr = window.devicePixelRatio || 1;
  const { W, H } = timelineLayout();
  if (tl.width !== Math.round(W*dpr) || tl.height !== Math.round(H*dpr)){
    tl.width = Math.round(W*dpr); tl.height = Math.round(H*dpr);
  }
  tctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  tctx.clearRect(0, 0, W, H);
  tctx.fillStyle = TH.tlBg; tctx.fillRect(0, 0, W, H);
  tctx.fillStyle = TH.tlRuler; tctx.fillRect(0, 0, W, rulerH);
  tctx.fillStyle = TH.tlLabel; tctx.fillRect(0, 0, labelW, H);

  const contentH = H - SB_H;

  /* ---------- 音频轨 ---------- */
  const laneH = S.laneH || 0;
  if (laneH){
    const ly = rulerH, lh = laneH;
    tctx.fillStyle = TH.tlLabel;
    tctx.fillRect(0, ly, W, lh);
    tctx.strokeStyle = TH.rowSep;
    tctx.beginPath(); tctx.moveTo(0, ly + lh + .5); tctx.lineTo(W, ly + lh + .5); tctx.stroke();

    tctx.save();
    tctx.beginPath(); tctx.rect(0, ly, labelW - 6, lh); tctx.clip();
    tctx.fillStyle = TH.tlText2;
    tctx.font = "9px ui-monospace,Consolas,monospace";
    let nm = S.audioName || "音频";
    if (nm.length > 12) nm = nm.slice(0, 11) + "…";
    tctx.fillText("♪ " + nm, 8, ly + lh / 2 + 3);
    tctx.restore();

    /* 片段范围：底色 + 两端裁剪手柄 */
    const ax0 = xOf(S.audioStart || 0);
    const ax1 = xOf((S.audioStart || 0) + audioLenBeats());
    const cx0 = Math.max(labelW, ax0), cx1 = Math.min(W, ax1);
    if (cx1 > cx0){
      tctx.save();
      tctx.globalAlpha = 0.14;
      tctx.fillStyle = TH.accent;
      roundRect(tctx, cx0, ly + 3, cx1 - cx0, lh - 6, 4);
      tctx.fill();
      tctx.restore();
      tctx.save();
      tctx.globalAlpha = 0.5;
      tctx.strokeStyle = TH.accent;
      tctx.lineWidth = 1;
      roundRect(tctx, cx0 + .5, ly + 3.5, Math.max(1, cx1 - cx0 - 1), lh - 7, 4);
      tctx.stroke();
      tctx.restore();
      /* 手柄 */
      tctx.fillStyle = TH.accent;
      if (ax0 >= labelW - 2) tctx.fillRect(Math.round(ax0) - 1, ly + 5, 2, lh - 10);
      if (ax1 <= W + 2) tctx.fillRect(Math.round(ax1) - 1, ly + 5, 2, lh - 10);
    }

    if (S.audioPeaks){
      const dpr = window.devicePixelRatio || 1;
      const cache = waveformCache(W, H, dpr);
      if (cache) tctx.drawImage(cache, 0, 0, W, H);
    } else {
      tctx.fillStyle = TH.tlText2;
      tctx.font = "9px ui-monospace,Consolas,monospace";
      tctx.fillText("解析波形…", labelW + 8, ly + lh / 2 + 3);
    }
  }

  tctx.save();
  tctx.beginPath(); tctx.rect(labelW, 0, W - labelW, contentH); tctx.clip();

  const showSixteenth = pxPerBeat > 26;
  const b0 = Math.max(0, Math.floor(S.scrollBeat * 4) / 4 - 0.25);
  const b1 = Math.min(totalBeats, S.scrollBeat + S.visibleBeats + 1);
  for (let b = b0; b <= b1 + 1e-6; b += 0.25){
    const x = xOf(b);
    const isBar = Math.abs(b % S.sig) < 1e-6;
    const isBeat = Math.abs(b % 1) < 1e-6;
    if (!isBeat && !showSixteenth) continue;
    tctx.strokeStyle = isBar ? TH.gridBar : (isBeat ? TH.gridBeat : TH.gridSub);
    tctx.beginPath();
    tctx.moveTo(x, isBar ? 0 : rulerH - (isBeat ? 8 : 4));
    tctx.lineTo(x, contentH);
    tctx.stroke();
    if (isBar){
      tctx.fillStyle = TH.tlText;
      tctx.font = "10px ui-monospace,Consolas,monospace";
      tctx.fillText(String(Math.round(b / S.sig) + 1), x + 3, 12);
    } else if (isBeat && pxPerBeat >= 30){
      tctx.fillStyle = TH.tlText2;
      tctx.font = "9px ui-monospace,Consolas,monospace";
      tctx.fillText(String(Math.round(b % S.sig) + 1), x + 3, 12);
    }
  }

  S.cues.forEach((c, ci) => {
    const x = xOf(c);
    if (x < labelW - 6 || x > W + 6) return;
    const on = S.selCues.indexOf(ci) >= 0;
    tctx.fillStyle = on ? TH.text : TH.accent;
    const hw = on ? 5 : 4, hh = on ? 9 : 6;
    tctx.beginPath();
    tctx.moveTo(x, rulerH + 1); tctx.lineTo(x - hw, rulerH - hh); tctx.lineTo(x + hw, rulerH - hh);
    tctx.closePath(); tctx.fill();
  });

  tlRows.forEach(({ p, y, sub }) => {
    if (y + rowH < rulerH || y > contentH) return;
    if (sub){
      /* 当前正在编辑的子轨道：整行淡高亮，一眼看出在改哪条 */
      if (S.selected === p && S.curveProp === sub){
        tctx.fillStyle = TH.selTint;
        tctx.fillRect(labelW, y, W - labelW, rowH);
      }
      tctx.strokeStyle = TH.rowSep;
      tctx.beginPath(); tctx.moveTo(labelW, y + rowH); tctx.lineTo(W, y + rowH); tctx.stroke();
      const ccy = y + rowH / 2;
      const tr = (p.tracks && p.tracks[sub]) ? p.tracks[sub] : [];
      for (const e of tr){
        const x = xOf(e.t);
        if (x < labelW - 8 || x > W + 8) continue;
        const sel = S.selKey && S.selKey.partId === p.id &&
                    S.curveProp === sub && Math.abs(S.selKey.t - e.t) < 1e-3;
        tctx.save();
        tctx.translate(x, ccy);
        tctx.rotate(Math.PI / 4);
        const base = rowH > 16 ? 7 : 5;
        const sz = sel ? base + 3 : base;
        tctx.fillStyle = sel ? TH.keySel : TH.keyIdle;
        tctx.fillRect(-sz/2, -sz/2, sz, sz);
        if (sel){
          tctx.strokeStyle = TH.accent;
          tctx.lineWidth = 1;
          tctx.strokeRect(-sz/2 - 1.5, -sz/2 - 1.5, sz + 3, sz + 3);
        }
        tctx.restore();
      }
      /* 拖拽中的落点预览 */
      if (tlDrag && tlDrag.type === "subkey" && tlDrag.delta && tlDrag.base){
        for (const it of tlDrag.base){
          if (it.partId !== p.id || it.prop !== sub) continue;
          const gx = xOf(Math.max(0, it.t + tlDrag.delta));
          if (gx < labelW - 8 || gx > W + 8) continue;
          tctx.save();
          tctx.translate(gx, ccy);
          tctx.rotate(Math.PI / 4);
          tctx.strokeStyle = TH.keySel;
          tctx.lineWidth = 1;
          tctx.globalAlpha = 0.8;
          const gs = rowH > 16 ? 7 : 5;
          tctx.strokeRect(-gs/2, -gs/2, gs, gs);
          tctx.restore();
        }
      }
      return;
    }
    if (S.selected === p){
      tctx.fillStyle = TH.selTint;
      tctx.fillRect(labelW, y, W - labelW, rowH);
    }
    tctx.strokeStyle = TH.rowSep;
    tctx.beginPath(); tctx.moveTo(labelW, y + rowH); tctx.lineTo(W, y + rowH); tctx.stroke();

    const cy = y + rowH/2;

    for (const c of S.clips.filter(c => c.partId === p.id)){
      const a = ACTION_LIB.find(x => x.id === c.actionId);
      const x1 = xOf(c.start), x2 = xOf(c.start + c.dur);
      if (x2 < labelW || x1 > W) continue;
      const bw = Math.max(8, x2 - x1);
      const bh = Math.min(rowH - 5, 18);
      const by = cy - bh/2;
      const sel = S.selClips.indexOf(c) >= 0;
      const cat = a ? a.cat : "基础";
      const fill = cat === "情绪" ? TH.clipEmoFill : cat === "卡点" ? TH.clipCueFill : TH.clipBaseFill;
      const edge = cat === "情绪" ? TH.clipEmoEdge : cat === "卡点" ? TH.clipCueEdge : TH.clipBaseEdge;
      tctx.save();
      tctx.fillStyle = fill;
      roundRect(tctx, x1, by, bw, bh, 3); tctx.fill();
      tctx.strokeStyle = sel ? "#ffffff" : edge;
      tctx.lineWidth = sel ? 1.5 : 0.8;
      roundRect(tctx, x1, by, bw, bh, 3); tctx.stroke();
      tctx.beginPath(); tctx.rect(x1 + 2, by, bw - 4, bh); tctx.clip();
      tctx.fillStyle = TH.clipText;
      tctx.font = "9px ui-monospace,Consolas,monospace";
      tctx.fillText(a ? a.name : "", x1 + 5, cy + 3);
      tctx.restore();
      if (sel){
        tctx.fillStyle = "#ffffff";
        tctx.fillRect(x2 - 2.5, by + 2, 2, bh - 4);
      }
    }

    for (const k of (p.subMode ? [] : p.keys)){
      const x = xOf(k.t);
      if (x < labelW - 8 || x > W + 8) continue;
      const sel = isPointSel(p, null, k.t);
      tctx.save();
      tctx.translate(x, cy);
      tctx.rotate(Math.PI/4);
      tctx.fillStyle = sel ? TH.keySel : (S.selected === p ? TH.keyPart : TH.keyIdle);
      const sz = rowH > 15 ? 9 : 6;
      tctx.fillRect(-sz/2, -sz/2, sz, sz);
      tctx.restore();
    }
    if (tlDrag && tlDrag.type === "key" && tlDrag.delta && tlDrag.base){
      for (const it of tlDrag.base){
        if (it.partId !== p.id) continue;
        const gx = xOf(Math.max(0, it.t + tlDrag.delta));
        if (gx < labelW - 8 || gx > W + 8) continue;
        tctx.save();
        tctx.translate(gx, cy);
        tctx.rotate(Math.PI/4);
        tctx.strokeStyle = TH.keySel;
        tctx.lineWidth = 1;
        tctx.globalAlpha = 0.8;
        const gs = rowH > 15 ? 9 : 6;
        tctx.strokeRect(-gs/2, -gs/2, gs, gs);
        tctx.restore();
      }
    }
  });

  const px = xOf(S.beat);
  if (px >= labelW - 1 && px <= W + 1){
    tctx.strokeStyle = TH.playhead;
    tctx.lineWidth = 1;
    tctx.beginPath(); tctx.moveTo(px, 0); tctx.lineTo(px, contentH); tctx.stroke();
    tctx.fillStyle = TH.playhead;
    tctx.beginPath();
    tctx.moveTo(px - 5, 0); tctx.lineTo(px + 5, 0); tctx.lineTo(px, 8);
    tctx.closePath(); tctx.fill();
  }
  tctx.restore();

  tctx.save();
  tctx.beginPath(); tctx.rect(0, rulerH + laneH, labelW - 3, contentH - rulerH - laneH); tctx.clip();
  tlRows.forEach(({ p, y, sub }) => {
    if (y + rowH < rulerH || y > contentH) return;
    if (sub){
      tctx.fillStyle = TH.rowLabelOff;
      tctx.font = "9px ui-monospace,Consolas,monospace";
      const n = (p.tracks && p.tracks[sub]) ? p.tracks[sub].length : 0;
      tctx.fillText(PROP_LABEL[sub] + (n ? "  " + n : ""), 22, y + rowH/2 + 3);
      return;
    }
    tctx.fillStyle = S.selected === p ? TH.rowLabelSel : (p.visible ? TH.rowLabel : TH.rowLabelOff);
    tctx.font = "10px ui-monospace,Consolas,monospace";
    tctx.fillText(p.slot, 10, y + rowH/2 + 3.5);
    /* 右侧展开三角 */
    const open = !!S.expandTracks[p.id];
    const tx = labelW - 11, ty = y + rowH/2;
    tctx.fillStyle = open ? TH.rowLabel : TH.rowLabelOff;
    tctx.beginPath();
    if (open){ tctx.moveTo(tx - 4, ty - 2); tctx.lineTo(tx + 4, ty - 2); tctx.lineTo(tx, ty + 4); }
    else { tctx.moveTo(tx - 2, ty - 4); tctx.lineTo(tx + 4, ty); tctx.lineTo(tx - 2, ty + 4); }
    tctx.closePath(); tctx.fill();
  });
  tctx.restore();

  if (S.marquee && S.marquee.b0 !== undefined){
    /* 世界坐标 → 屏幕坐标，滚动时矩形会跟着内容走 */
    const m = S.marquee;
    const lane = S.laneH || 0;
    const bx1 = xOf(Math.min(m.b0, m.b1)), bx2 = xOf(Math.max(m.b0, m.b1));
    const by1 = rulerH + lane + Math.min(m.r0, m.r1) * rowH - S.scrollRow;
    const by2 = rulerH + lane + Math.max(m.r0, m.r1) * rowH - S.scrollRow;
    const x = bx1, y = by1, w = Math.max(1, bx2 - bx1), h = Math.max(1, by2 - by1);
    tctx.save();
    tctx.fillStyle = TH.marqueeFill;
    tctx.strokeStyle = TH.marqueeLine;
    tctx.lineWidth = 1;
    tctx.fillRect(x, y, w, h);
    tctx.strokeRect(x + .5, y + .5, w, h);
    tctx.restore();
  }

  const trackY = H - SB_H + 2, trackH = 5;
  const tx0 = labelW + 2, tx1 = W - 10;
  const trackW = Math.max(20, tx1 - tx0);
  const vis = Math.min(1, S.visibleBeats / totalBeats);
  const thumbW = Math.max(28, trackW * vis);
  const tpos = S.maxScrollBeat > 0 ? S.scrollBeat / S.maxScrollBeat : 0;
  const thumbX = tx0 + tpos * (trackW - thumbW);
  tctx.fillStyle = "rgba(255,255,255,.05)";
  roundRect(tctx, tx0, trackY, trackW, trackH, 3); tctx.fill();
  tctx.fillStyle = S.maxScrollBeat > 0.5 ? TH.scrollThumb : TH.scrollTrack;
  roundRect(tctx, thumbX, trackY, thumbW, trackH, 3); tctx.fill();
  S.hsThumb = { x: thumbX, y: trackY, w: thumbW, h: trackH, tx0, trackW };

  if (S.maxRowScroll > 0.5){
    const vx = W - 6, vy0 = rulerH + laneH + 2, vy1 = contentH - 3;
    const span = Math.max(10, vy1 - vy0);
    const vh = Math.max(16, span * (S.availH / (S.availH + S.maxRowScroll)));
    const vt = S.scrollRow / S.maxRowScroll;
    const vyy = vy0 + vt * (span - vh);
    tctx.fillStyle = "rgba(255,255,255,.05)";
    roundRect(tctx, vx, vy0, 4, span, 2); tctx.fill();
    tctx.fillStyle = TH.scrollThumbOff;
    roundRect(tctx, vx, vyy, 4, vh, 2); tctx.fill();
    S.vsThumb = { x: vx, y: vyy, w: 4, h: vh, y0: vy0, span };
  } else {
    S.vsThumb = null;
  }

  drawPianoRoll();
}

/* ============================ 播放 ============================ */
/* 音频当成一个片段：audioStart 是它在时间轴上的起点（拍），
   audioIn / audioOut 是源文件里的入点和出点（秒）。 */
function audioOutSec(){
  const d = S.audioDur || 0;
  if (!S.audioOut || S.audioOut <= 0) return d;
  return d ? Math.min(S.audioOut, d) : S.audioOut;
}
function audioLenSec(){ return Math.max(0.05, audioOutSec() - (S.audioIn || 0)); }
function audioLenBeats(){ return audioLenSec() * S.bpm / 60; }
function audioSecAtBeat(beat){ return (S.audioIn || 0) + (beat - (S.audioStart || 0)) * 60 / S.bpm; }
function audioBeatAtSec(sec){ return (S.audioStart || 0) + (sec - (S.audioIn || 0)) * S.bpm / 60; }
/* 旧字段：正数表示音乐延后多少秒 */
function audioOffsetSec(){ return (S.audioStart || 0) * 60 / S.bpm; }

let playStartBeat = 0, playStartT = 0, audioDriving = false, audioBlocked = false;

function currentBeat(){
  if (!S.playing) return S.beat;
  if (S.audio && audioDriving) return Math.max(0, audioBeatAtSec(S.audio.currentTime));
  return playStartBeat + (performance.now() - playStartT) / 1000 * S.bpm / 60;
}
/* 把音频对齐到当前播放头；播放头不在片段范围内就不放声音 */
function syncAudioToPlayhead(){
  if (!S.audio || !S.playing || audioBlocked) return;
  const at = audioSecAtBeat(S.beat);
  const inClip = at >= (S.audioIn || 0) - 0.01 && at < audioOutSec() - 0.01;
  if (inClip){
    try { S.audio.currentTime = Math.max(0, at); } catch(e){}
    audioDriving = true;
    const pr = S.audio.play();
    /* 浏览器拦下自动播放时别让播放头跟着冻住，改回计时器推进 */
    if (pr && pr.catch) pr.catch(() => {
      audioBlocked = true;          // 这次会话不再反复尝试，免得每帧都报错
      if (audioDriving && S.audio.paused){
        audioDriving = false;
        playStartBeat = S.beat; playStartT = performance.now();
      }
    });
  } else {
    S.audio.pause();
    audioDriving = false;
  }
}
function play(){
  if (S.playing) return;
  S.playing = true; playStartBeat = S.beat; playStartT = performance.now();
  audioDriving = false;
  audioBlocked = false;
  syncAudioToPlayhead();
  document.getElementById("btnPlay").classList.add("playing");
}
function stop(){
  S.playing = false;
  S.beat = currentBeat();
  audioDriving = false;
  if (S.audio) S.audio.pause();
  document.getElementById("btnPlay").classList.remove("playing");
  applyAt(S.beat); draw(); drawTimeline(); updateTime();
  if (S.selected && S.tab === "props") syncNums(S.selected);
}
function togglePlay(){ S.playing ? stop() : play(); }
function setBeat(b){
  S.beat = Math.max(0, b);
  if (S.beat < S.scrollBeat || S.beat > S.scrollBeat + S.visibleBeats * 0.95){
    S.scrollBeat = clamp(S.beat - S.visibleBeats * 0.15, 0, S.maxScrollBeat);
  }
  applyAt(S.beat); draw(); drawTimeline(); updateTime();
}

function followPlayhead(){
  if (!S.playing) return;
  const right = S.scrollBeat + S.visibleBeats * 0.9;
  if (S.beat > right || S.beat < S.scrollBeat){
    S.scrollBeat = Math.max(0, S.beat - S.visibleBeats * 0.15);
  }
}

function updateTime(){
  const sec = S.beat * 60 / S.bpm;
  const dur = S.audio
    ? Math.max(0.01, ((S.audioStart || 0) + audioLenBeats()) * 60 / S.bpm)
    : (totalBeats * 60 / S.bpm);
  document.getElementById("timeLabel").innerHTML =
    sec.toFixed(2) + "s <em>/ " + dur.toFixed(2) + "s</em>";
}

function loop(){
  if (S.playing){
    S.beat = currentBeat();
    followPlayhead();
    applyAt(S.beat);
    draw(); drawTimeline(); updateTime();
    if (S.selected && S.tab === "props") syncNums(S.selected);
    if (S.audio){
      if (!audioDriving){
        /* 还没进片段：靠计时器推进，进片段的那一刻接上声音 */
        const at = audioSecAtBeat(S.beat);
        if (at >= (S.audioIn || 0) - 0.005 && at < audioOutSec() - 0.02) syncAudioToPlayhead();
      } else if (S.audio.currentTime >= audioOutSec() - 0.01){
        /* 出点到了：停声，改回计时器继续推进画面 */
        S.audio.pause();
        audioDriving = false;
        playStartBeat = S.beat; playStartT = performance.now();
      }
    }
  }
  requestAnimationFrame(loop);
}


/* ============================ 内置图形素材 ============================ */
const SHAPE_KINDS = [
  { id: "triangle",  name: "三角形" },
  { id: "square",    name: "正方形" },
  { id: "circle",    name: "圆形" },
  { id: "star",      name: "星形" },
  { id: "polygon",   name: "多边形" },
  { id: "diamond",   name: "菱形" },
  { id: "roundrect", name: "圆角矩形" },
  { id: "ring",      name: "环形" },
  { id: "arrow",     name: "箭头" },
  { id: "cross",     name: "十字" },
  { id: "bubble",    name: "对话气泡" },
  { id: "line",      name: "横条" }
];
const SHAPE_NAME = Object.fromEntries(SHAPE_KINDS.map(k => [k.id, k.name]));

/* 最近一次用过的样式，连续插入时不用反复调色 */
let lastShapeStyle = { fillOn: true, fill: "#7fd4c1", strokeOn: false, stroke: "#171717", strokeW: 6 };

function defaultShape(type){
  return Object.assign({
    type,
    w: 220, h: 220,
    radius: 26, sides: 6, points: 5, inner: 0.45, thick: 0.26
  }, lastShapeStyle);
}

/* 生成 0..w × 0..h 盒子里的路径 */
function shapePath(s){
  const w = Math.max(4, +s.w || 100), h = Math.max(4, +s.h || 100);
  const cx = w / 2, cy = h / 2;
  const poly = arr => "M " + arr.map(p => (+p[0]).toFixed(2) + " " + (+p[1]).toFixed(2)).join(" L ") + " Z";
  const ring = (rx, ry) => "M " + (cx - rx) + " " + cy +
    " A " + rx + " " + ry + " 0 1 0 " + (cx + rx) + " " + cy +
    " A " + rx + " " + ry + " 0 1 0 " + (cx - rx) + " " + cy + " Z";

  switch (s.type){
    case "triangle": return poly([[cx, 0], [w, h], [0, h]]);
    case "square":   return poly([[0, 0], [w, 0], [w, h], [0, h]]);
    case "diamond":  return poly([[cx, 0], [w, cy], [cx, h], [0, cy]]);
    case "circle":   return ring(cx, cy);
    case "line": {
      const th = Math.max(2, h);
      return poly([[0, cy - th/2], [w, cy - th/2], [w, cy + th/2], [0, cy + th/2]]);
    }
    case "star": {
      const n = clamp(Math.round(+s.points || 5), 3, 24);
      const ir = clamp(+s.inner || 0.45, 0.08, 0.95);
      const pts = [];
      for (let i = 0; i < n * 2; i++){
        const a = -Math.PI/2 + i * Math.PI / n;
        const r = (i % 2) ? ir : 1;
        pts.push([cx + Math.cos(a) * cx * r, cy + Math.sin(a) * cy * r]);
      }
      return poly(pts);
    }
    case "polygon": {
      const n = clamp(Math.round(+s.sides || 6), 3, 24);
      const pts = [];
      for (let i = 0; i < n; i++){
        const a = -Math.PI/2 + i * 2 * Math.PI / n;
        pts.push([cx + Math.cos(a) * cx, cy + Math.sin(a) * cy]);
      }
      return poly(pts);
    }
    case "roundrect": {
      const r = clamp(+s.radius || 0, 0, Math.min(w, h) / 2);
      return "M " + r + " 0 H " + (w - r) + " A " + r + " " + r + " 0 0 1 " + w + " " + r +
             " V " + (h - r) + " A " + r + " " + r + " 0 0 1 " + (w - r) + " " + h +
             " H " + r + " A " + r + " " + r + " 0 0 1 0 " + (h - r) +
             " V " + r + " A " + r + " " + r + " 0 0 1 " + r + " 0 Z";
    }
    case "ring": {
      const t = clamp(+s.thick || 0.26, 0.04, 0.9);
      return ring(cx, cy) + " " + ring(cx * (1 - t), cy * (1 - t));
    }
    case "arrow": {
      const bodyTop = h * 0.28, bodyBot = h * 0.72, headX = w * 0.62;
      return poly([[0, bodyTop], [headX, bodyTop], [headX, 0], [w, cy],
                   [headX, h], [headX, bodyBot], [0, bodyBot]]);
    }
    case "cross": {
      const a = clamp(0.34, 0.1, 0.8);
      const x0 = w * (0.5 - a/2), x1 = w * (0.5 + a/2);
      const y0 = h * (0.5 - a/2), y1 = h * (0.5 + a/2);
      return poly([[x0, 0], [x1, 0], [x1, y0], [w, y0], [w, y1], [x1, y1],
                   [x1, h], [x0, h], [x0, y1], [0, y1], [0, y0], [x0, y0]]);
    }
    case "bubble": {
      const r = clamp(+s.radius || 0, 0, Math.min(w, h) / 2);
      const bh = h * 0.78;
      const body = "M " + r + " 0 H " + (w - r) + " A " + r + " " + r + " 0 0 1 " + w + " " + r +
                   " V " + (bh - r) + " A " + r + " " + r + " 0 0 1 " + (w - r) + " " + bh +
                   " H " + r + " A " + r + " " + r + " 0 0 1 0 " + (bh - r) +
                   " V " + r + " A " + r + " " + r + " 0 0 1 " + r + " 0 Z";
      const tail = "M " + (w * 0.22) + " " + (bh - 1) + " L " + (w * 0.34) + " " + h +
                   " L " + (w * 0.42) + " " + (bh - 1) + " Z";
      return body + " " + tail;
    }
  }
  return poly([[0, 0], [w, 0], [w, h], [0, h]]);
}

/* 把参数变成一张 SVG（data URL）。用矢量存，缩放不糊，文件也小。 */
function shapeSVG(s){
  const pad = s.strokeOn ? Math.max(0, (+s.strokeW || 0) / 2) : 0;
  const w = Math.max(4, +s.w || 100), h = Math.max(4, +s.h || 100);
  const W = Math.round(w + pad * 2), H = Math.round(h + pad * 2);
  const fill = s.fillOn ? s.fill : "none";
  const stroke = s.strokeOn ? s.stroke : "none";
  const sw = s.strokeOn ? Math.max(0, +s.strokeW || 0) : 0;
  const d = shapePath(s);
  const svg = '<svg xmlns="http://www.w3.org/2000/svg" width="' + W + '" height="' + H +
    '" viewBox="0 0 ' + W + ' ' + H + '">' +
    '<g transform="translate(' + pad + ',' + pad + ')">' +
    '<path d="' + d + '" fill="' + fill + '" fill-rule="evenodd" stroke="' + stroke +
    '" stroke-width="' + sw + '" stroke-linejoin="round" stroke-linecap="round"/></g></svg>';
  return "data:image/svg+xml;charset=utf-8," + encodeURIComponent(svg);
}

/* 素材库里的小图标（24×24，纯描边） */
function shapeIcon(id){
  const s = Object.assign(defaultShape(id), { w: 24, h: 24, fillOn: false, strokeOn: true, strokeW: 1.6, radius: 4, thick: 0.3, inner: 0.44 });
  return '<svg viewBox="-2 -2 28 28" fill="none"><path d="' + shapePath(s) +
    '" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round" fill-rule="evenodd"/></svg>';
}

/* 用一个形状参数造出图层 */
async function makeShapePart(shape){
  const img = await loadSrc(shapeSVG(shape));
  const bbox = alphaBBox(img);
  const cx = bbox.x + bbox.w / 2, cy = bbox.y + bbox.h / 2;
  const p = {
    id: nid(), slot: SHAPE_NAME[shape.type] || "图形", kind: "shape",
    shape: Object.assign({}, shape),
    variants: [{ variant: "", img, bbox, ax: cx, ay: cy, thumb: makeThumb(img, bbox) }],
    texIndex: 0, x: 0, y: 0, rot: 0, sx: 1, sy: 1, alpha: 1,
    flipX: false, flipY: false,
    ax: cx, ay: cy, pu: 0.5, pv: 0.5, parentId: null, folderId: null,
    notes: [], visible: true, locked: false, bbox, clip: null
  };
  p.x = S.doc.w / 2;
  p.y = S.doc.h / 2;
  return initTracks(p);
}

/* 参数变了，重新生成这张矢量图（尺寸变化时保持中心不动） */
let shapeRebuildTimer = null;
async function refreshShapeLayer(p){
  if (!p || !p.shape) return;
  const img = await loadSrc(shapeSVG(p.shape));
  const bbox = alphaBBox(img);
  if (!p.variants.length) p.variants.push({ variant: "" });
  const v = p.variants[0];
  v.img = img; v.bbox = bbox;
  v.thumb = makeThumb(img, bbox);
  v.ax = bbox.x + bbox.w / 2; v.ay = bbox.y + bbox.h / 2;
  p.texIndex = 0;
  p.bbox = bbox;
  p.ax = v.ax; p.ay = v.ay;
  /* 绘制时图像是从 (-ax,-ay) 开始铺的，所以轴心永远落在 (p.x,p.y) 上，
     改尺寸不需要补偿位置——补了反而会把图层推走。 */
  p._agg = null;
}

function scheduleShapeRebuild(p){
  if (shapeRebuildTimer) clearTimeout(shapeRebuildTimer);
  shapeRebuildTimer = setTimeout(async () => {
    shapeRebuildTimer = null;
    await refreshShapeLayer(p);
    applyAt(S.beat);
    renderAll();
  }, 70);
}

async function addShapeLayer(type){
  const shape = defaultShape(type);
  const p = await makeShapePart(shape);
  pushUndo("添加图形");
  S.parts.push(p);
  lastShapeStyle = { fillOn: shape.fillOn, fill: shape.fill, strokeOn: shape.strokeOn, stroke: shape.stroke, strokeW: shape.strokeW };
  S.selected = p;
  S.layerTab = "flat";
  S.tab = "props";
  applyAt(S.beat);
  renderAll();
  toast("已插入「" + p.slot + "」，在右侧「图形」里调颜色和描边");
}

/* ============================ 图层列表 ============================ */

function renderLayers(){
  const box = document.getElementById("layerList");
  box.innerHTML = "";
  const mode = S.layerTab || "flat";
  document.getElementById("layerCount").textContent = S.parts.length + " 层";
  document.querySelectorAll("#layerTabs .ltab").forEach(t => t.classList.toggle("on", t.dataset.ltab === mode));

  const kidsOf = id => S.parts.filter(p => p.parentId === id);
  const roots = S.parts.filter(p => !p.parentId).slice().reverse();

  const buildRow = (p, depth, flat, extra) => {
    const kids = kidsOf(p.id);
    const hasKids = kids.length > 0;
    const expanded = S.expanded[p.id] !== false;

    const el = document.createElement("div");
    el.className = "layer" + (S.selected === p ? " sel" : "") + (!flat && hasKids ? " folder" : "") + (!flat && depth > 0 ? " child" : "") + (extra ? " " + extra : "");
    el.draggable = true;
    el.dataset.id = p.id;
    el.style.paddingLeft = (7 + (flat ? 0 : depth * 13)) + "px";
    const parName = p.parentId ? (S.parts.find(q => q.id === p.parentId) || {}).slot : null;
    if (parName) el.title = "父级：" + parName + (flat ? "（拖到别的图层上可改顺序，Alt+拖 改父级）" : "");

    const chev = document.createElement("div");
    chev.className = (!flat && hasKids) ? "chev" : "chev-space";
    if (hasKids){
      chev.textContent = expanded ? "▾" : "▸";
      chev.onclick = ev => { ev.stopPropagation(); S.expanded[p.id] = !expanded; renderLayers(); };
    }
    el.appendChild(chev);

    const th = document.createElement("div");
    th.className = "thumb";
    const it = p.variants[0];
    if (it) th.innerHTML = '<img src="' + it.thumb + '">';

    const nm = document.createElement("div");
    nm.className = "lname";
    nm.textContent = (p.kind === "text" && p.text)
      ? (String(p.text.str || "").split("\n")[0].slice(0, 14) || "空文字")
      : p.slot;

    const eye = document.createElement("div");
    eye.className = "tog" + (p.visible ? "" : " off");
    eye.innerHTML = p.visible
      ? '<svg width="12" height="12" viewBox="0 0 12 12"><path d="M1 6s2-3.4 5-3.4S11 6 11 6s-2 3.4-5 3.4S1 6 1 6z" fill="none" stroke="currentColor" stroke-width="1"/><circle cx="6" cy="6" r="1.5" fill="currentColor"/></svg>'
      : '<svg width="12" height="12" viewBox="0 0 12 12"><path d="M1 6s2-3.4 5-3.4S11 6 11 6s-2 3.4-5 3.4S1 6 1 6z" fill="none" stroke="currentColor" stroke-width="1" opacity=".45"/><path d="M2 10L10 2" stroke="currentColor" stroke-width="1"/></svg>';
    eye.title = "显示 / 隐藏";
    eye.onclick = e => { e.stopPropagation(); pushUndo(); p.visible = !p.visible; renderAll(); };

    const lock = document.createElement("div");
    lock.className = "tog" + (p.locked ? "" : " off");
    lock.innerHTML = p.locked
      ? '<svg width="11" height="11" viewBox="0 0 12 12"><rect x="2.5" y="5.5" width="7" height="5" rx="1" fill="none" stroke="currentColor" stroke-width="1"/><path d="M4 5.5V4a2 2 0 014 0v1.5" fill="none" stroke="currentColor" stroke-width="1"/></svg>'
      : '<svg width="11" height="11" viewBox="0 0 12 12"><rect x="2.5" y="5.5" width="7" height="5" rx="1" fill="none" stroke="currentColor" stroke-width="1"/><path d="M4 5.5V4a2 2 0 013.4-1.5" fill="none" stroke="currentColor" stroke-width="1"/></svg>';
    lock.title = "锁定 / 解锁";
    lock.onclick = e => { e.stopPropagation(); pushUndo(); p.locked = !p.locked; renderAll(); };

    el.append(th);
    if (flat && p.parentId){
      const pin = document.createElement("span");
      pin.className = "pin";
      pin.textContent = "⤷";
      pin.title = "子图层，父级：" + (parName || "");
      el.appendChild(pin);
    }
    el.append(nm);
    if (p.variants.length > 1){
      const b = document.createElement("span");
      b.className = "badge";
      b.textContent = p.variants.length;
      el.appendChild(b);
    }
    if (p.clip && p.clip.srcId){
      const src = S.parts.find(q => q.id === p.clip.srcId);
      const mb = document.createElement("span");
      mb.className = "badge mask";
      mb.textContent = "蒙";
      mb.title = "蒙版：由「" + (src ? src.slot : "已删除的图层") + "」裁剪" + (p.clip.invert ? "（反转）" : "");
      el.appendChild(mb);
    }
    if (hasKids){
      const b2 = document.createElement("span");
      b2.className = "badge";
      b2.textContent = kids.length;
      b2.title = "子图层数量";
      el.appendChild(b2);
    }
    el.append(eye, lock);

    el.onclick = () => selectPart(p);
    el.ondblclick = () => {
      const inp = document.createElement("input");
      inp.value = p.slot;
      nm.innerHTML = ""; nm.appendChild(inp);
      inp.focus(); inp.select();
      const commit = () => { p.slot = inp.value.trim() || p.slot; renderAll(); };
      inp.onblur = commit;
      inp.onkeydown = ev => { if (ev.key === "Enter") inp.blur(); if (ev.key === "Escape") renderAll(); };
    };

    el.ondragstart = e => { e.dataTransfer.effectAllowed = "move"; e.dataTransfer.setData("text/plain", p.id); el.classList.add("dragging"); };
    el.ondragend = () => el.classList.remove("dragging");
    el.ondragover = e => { e.preventDefault(); el.classList.add("drop-top"); };
    el.ondragleave = () => el.classList.remove("drop-top");
    el.ondrop = e => {
      e.preventDefault();
      el.classList.remove("drop-top");
      const from = e.dataTransfer.getData("text/plain");
      if (!from || from === p.id) return;
      if (e.altKey){ reparent(from, p.id); return; }
      reorderLayer(from, p.id);
    };

    box.appendChild(el);
    if (!flat && hasKids && expanded) kids.slice().reverse().forEach(k => buildRow(k, depth + 1, false));
    return el;
  };

  if (mode === "assets"){
    document.getElementById("layerCount").textContent = SHAPE_KINDS.length + " 项";
    box.innerHTML = '<div class="assets">' + SHAPE_KINDS.map(k =>
      '<div class="acell" data-shape="' + k.id + '" title="插入' + k.name + '">' +
        shapeIcon(k.id) + '<span>' + k.name + '</span></div>').join("") + '</div>' +
      '<div class="hintline" style="padding:2px 12px 14px">点一下就在画布中央插入一个图形图层。' +
      '插入后在右侧「图形」里改尺寸、颜色、描边、中空、圆角、角数。</div>';
    box.querySelectorAll(".acell").forEach(c => {
      c.onclick = () => addShapeLayer(c.dataset.shape);
    });
    return;
  }

  if (mode === "flat"){
    const order = S.parts.slice().reverse();
    const grouped = new Set();
    for (const f of (S.folders || [])){
      const kids = order.filter(p => p.folderId === f.id);
      kids.forEach(p => grouped.add(p.id));
      box.appendChild(buildGroupRow(f, kids.length));
      if (!f.collapsed) kids.forEach(p => buildRow(p, 0, true, "in-grp"));
    }
    const rest = order.filter(p => !grouped.has(p.id));
    if (rest.length && (S.folders || []).length){
      const sep = document.createElement("div");
      sep.className = "grp-sep";
      box.appendChild(sep);
    }
    rest.forEach(p => buildRow(p, 0, true));
    if (!S.parts.length && !(S.folders || []).length)
      box.innerHTML = '<div class="lempty">还没有图层<br>把分层 PNG 拖进画布，或切到「素材」插图形</div>';
  } else {
    roots.forEach(p => buildRow(p, 0, false));
    if (!S.parts.length) box.innerHTML = '<div class="lempty">还没有图层</div>';
  }
}

/* ---------- 图层资料夹 ---------- */
function folderById(id){ return (S.folders || []).find(f => f.id === id) || null; }

function addFolder(){
  pushUndo("新建资料夹");
  const f = { id: "g" + (++uid), name: "资料夹 " + ((S.folders || []).length + 1), collapsed: false };
  if (!S.folders) S.folders = [];
  S.folders.push(f);
  S.layerTab = "flat";
  renderLayers();
  toast("已新建「" + f.name + "」，把图层拖到它上面就能收进去");
  return f;
}

function moveToFolder(partId, folderId){
  const p = S.parts.find(x => x.id === partId);
  if (!p) return;
  if ((p.folderId || null) === (folderId || null)) return;
  pushUndo("移入资料夹");
  p.folderId = folderId || null;
  const f = folderId ? folderById(folderId) : null;
  if (f) f.collapsed = false;
  renderLayers();
  toast(f ? "「" + p.slot + "」已放入「" + f.name + "」" : "「" + p.slot + "」已移出资料夹");
}

function deleteFolder(id){
  const f = folderById(id);
  if (!f) return;
  const kids = S.parts.filter(p => p.folderId === id);
  const msg = kids.length
    ? "删除资料夹「" + f.name + "」？\n\n里面的 " + kids.length + " 个图层会回到列表，不会被删除。"
    : "删除资料夹「" + f.name + "」？";
  if (!confirm(msg)) return;
  pushUndo("删除资料夹");
  S.parts.forEach(p => { if (p.folderId === id) p.folderId = null; });
  S.folders = (S.folders || []).filter(x => x.id !== id);
  renderLayers();
  toast("已删除资料夹「" + f.name + "」");
}

function buildGroupRow(f, count){
  const el = document.createElement("div");
  el.className = "layer grp";
  el.dataset.gid = f.id;

  const chev = document.createElement("div");
  chev.className = "chev";
  chev.textContent = f.collapsed ? "▸" : "▾";
  chev.onclick = ev => { ev.stopPropagation(); f.collapsed = !f.collapsed; renderLayers(); };
  el.appendChild(chev);

  const ic = document.createElement("div");
  ic.className = "gicon";
  ic.innerHTML = '<svg width="15" height="15" viewBox="0 0 16 16">' +
    '<path d="M1.6 4.3A1.3 1.3 0 012.9 3h2.9l1.3 1.7h6a1.3 1.3 0 011.3 1.3v5.7a1.3 1.3 0 01-1.3 1.3H2.9a1.3 1.3 0 01-1.3-1.3z" ' +
    'fill="none" stroke="currentColor" stroke-width="1.1" stroke-linejoin="round"/></svg>';
  el.appendChild(ic);

  const nm = document.createElement("div");
  nm.className = "lname";
  nm.textContent = f.name;
  nm.title = "双击改名";
  nm.ondblclick = ev => {
    ev.stopPropagation();
    const inp = document.createElement("input");
    inp.value = f.name;
    nm.innerHTML = ""; nm.appendChild(inp);
    inp.focus(); inp.select();
    const commit = () => { f.name = inp.value.trim() || f.name; renderLayers(); };
    inp.onblur = commit;
    inp.onkeydown = e2 => { if (e2.key === "Enter") inp.blur(); if (e2.key === "Escape") renderLayers(); };
  };
  el.appendChild(nm);

  const badge = document.createElement("span");
  badge.className = "badge";
  badge.textContent = count;
  badge.title = "资料夹里的图层数";
  el.appendChild(badge);

  const del = document.createElement("div");
  del.className = "gdel";
  del.textContent = "×";
  del.title = "删除资料夹（图层会回到列表）";
  del.onclick = ev => { ev.stopPropagation(); deleteFolder(f.id); };
  el.appendChild(del);

  el.onclick = () => { f.collapsed = !f.collapsed; renderLayers(); };
  el.ondragover = ev => { ev.preventDefault(); ev.stopPropagation(); el.classList.add("drop-into"); };
  el.ondragleave = () => el.classList.remove("drop-into");
  el.ondrop = ev => {
    ev.preventDefault(); ev.stopPropagation();
    el.classList.remove("drop-into");
    const from = ev.dataTransfer.getData("text/plain");
    if (from) moveToFolder(from, f.id);
  };
  return el;
}

document.getElementById("btnAddFolder").onclick = () => addFolder();

/* 图层 / 父子级 分页切换 */
document.querySelectorAll("#layerTabs .ltab").forEach(t => {
  t.onclick = () => {
    S.layerTab = t.dataset.ltab;
    renderLayers();
  };
});

function setParent(childId, parentId){
  const child = S.parts.find(p => p.id === childId);
  if (!child) return false;
  parentId = parentId || null;
  if (parentId === child.id){ toast("不能把自己设为父级"); return false; }

  if (parentId){
    const parent = S.parts.find(p => p.id === parentId);
    if (!parent){ toast("找不到父级图层"); return false; }
    let q = parent;
    while (q){
      if (q.id === childId){ toast("不能形成循环层级"); return false; }
      q = q.parentId ? S.parts.find(x => x.id === q.parentId) : null;
    }
  }

  pushUndo("设置父子级");
  const oldPar = child.parentId ? S.parts.find(q => q.id === child.parentId) : null;
  const newPar = parentId ? S.parts.find(q => q.id === parentId) : null;
  const t = spaceDelta(oldPar ? worldOf(oldPar) : rootMatrix(),
                       newPar ? worldOf(newPar) : rootMatrix());

  /* 位置存在「父级空间」里。换父级必须把这个空间里的**所有**坐标一起搬：
     当前值、静态值、x/y 关键帧、片段基准。
     只搬当前值的话，下一帧 applyAt 会被旧轨道拽回旧坐标 —— 表现就是图层飞走。 */
  const cur = mapXY(t, child.x, child.y);
  child.x = cur.x; child.y = cur.y;
  rebasePartSpace(child, t);

  child.parentId = parentId;
  child._agg = null;
  if (parentId) S.expanded[parentId] = true;
  renderAll();

  const pn = parentId ? S.parts.find(p => p.id === parentId) : null;
  toast(pn ? "「" + child.slot + "」已放入「" + pn.slot + "」" : "「" + child.slot + "」已移出父级");
  return true;
}

/* 修复：把该图层的位置数据当成「世界坐标」重新换算进当前父级空间。
   用于旧版本「绑定父级后位置错乱」留下的工程 —— 那时只搬了当前值，
   静态值和 x/y 轨道还留在世界坐标里，一求值就飞走。 */
function fixPositionSpace(p){
  if (!p || !p.parentId){ toast("这个图层没有父级，不需要换算"); return; }
  const par = S.parts.find(q => q.id === p.parentId);
  if (!par){ toast("找不到父级图层"); return; }
  pushUndo("修正位置坐标");
  rebasePartSpace(p, spaceDelta(rootMatrix(), worldOf(par)));
  applyAt(S.beat); renderAll();
  toast("已把「" + p.slot + "」的位置数据换算到「" + par.slot + "」坐标系");
}

/* 把图层在旧父级空间里的所有坐标映射到新空间（t 由 spaceDelta 给出） */
function rebasePartSpace(p, t){
  initTracks(p);
  /* 轨道插值的兜底值必须用「旧的」静态值，所以先存下来 */
  const obx = p.rest ? p.rest.x : 0, oby = p.rest ? p.rest.y : 0;

  if (p.rest){
    const r = mapXY(t, p.rest.x, p.rest.y);
    p.rest.x = r.x; p.rest.y = r.y;
  }

  const tx = p.tracks.x, ty = p.tracks.y;
  if (tx.length || ty.length){
    const times = [...new Set([...tx, ...ty].map(e => round4(e.t)))].sort((a, b) => a - b);
    const easeAt = (tr, tm) => {
      const e = tr.find(x => Math.abs(x.t - tm) < KEY_EPS);
      return e ? e.ease : null;
    };
    const nx = [], ny = [];
    for (const tm of times){
      const xv = tx.length ? evalTrackAt(tx, tm, obx) : obx;
      const yv = ty.length ? evalTrackAt(ty, tm, oby) : oby;
      const q = mapXY(t, xv, yv);
      nx.push({ t: tm, v: q.x, ease: easeAt(tx, tm) });
      ny.push({ t: tm, v: q.y, ease: easeAt(ty, tm) });
    }
    /* 只写回原本存在的轨道；不存在的保持为空，交给静态值 */
    if (tx.length) p.tracks.x = nx;
    if (ty.length) p.tracks.y = ny;
  }

  for (const cl of S.clips){
    if (cl.partId !== p.id || !cl.base) continue;
    const q = mapXY(t, cl.base.x || 0, cl.base.y || 0);
    cl.base.x = q.x; cl.base.y = q.y;
  }
  p._agg = null;
}

function reparent(childId, parentId){ setParent(childId, parentId); }

function reorderLayer(fromId, toId){
  pushUndo();
  const from = S.parts.findIndex(p => p.id === fromId);
  const to = S.parts.findIndex(p => p.id === toId);
  if (from < 0 || to < 0) return;
  const [item] = S.parts.splice(from, 1);
  const idx = S.parts.findIndex(p => p.id === toId);
  S.parts.splice(idx + 1, 0, item);
  renderAll();
}

function ancestorFlip(p){
  let q = p.parentId ? S.parts.find(x => x.id === p.parentId) : null;
  let n = 0;
  while (q && n++ < 40){
    if (q.flipX || q.flipY) return true;
    q = q.parentId ? S.parts.find(x => x.id === q.parentId) : null;
  }
  return false;
}

function deleteVariant(p, i){
  if (!p) return;
  if (p.variants.length <= 1){ toast("至少要保留一张贴图"); return; }
  const name = p.variants[i] ? (p.variants[i].variant || "贴图 " + (i + 1)) : "";
  pushUndo("删除贴图");
  p.variants.splice(i, 1);
  if (p.texIndex >= p.variants.length) p.texIndex = p.variants.length - 1;
  else if (p.texIndex > i) p.texIndex--;
  applyPivot(p);
  for (const e of p.tracks.tex) e.v = clamp(e.v, 0, p.variants.length - 1);
  p._agg = null;
  touch(p, "tex");
  renderAll();
  toast("已删除贴图「" + name + "」，剩 " + p.variants.length + " 张");
}

/* ============================ 发丝摆动 ============================ */
const HAIR_DEFAULT = { damp: 0.86, gain: 0.85, max: 35, wind: 6, freq: 0.35, windOn: false, mesh: false, segs: 8, vstretch: 1.2 };

function partDepth(p){
  let d = 0, q = p;
  while (q && q.parentId && d < 50){
    q = S.parts.find(x => x.id === q.parentId);
    d++;
  }
  return d;
}

function hairTree(root){
  const out = [root];
  let grew = true;
  while (grew){
    grew = false;
    for (const p of S.parts){
      if (out.indexOf(p) >= 0) continue;
      if (p.parentId && out.some(q => q.id === p.parentId)){ out.push(p); grew = true; }
    }
  }
  return out.sort((a, b) => partDepth(a) - partDepth(b));
}

function bakeHairSway(root){
  if (!root) return;
  const list = hairTree(root).filter(p => p.parentId);
  if (!list.length){ toast("发丝要挂在父级图层下才能摆动"); return; }

  pushUndo();
  const fps = 24;
  const stepBeat = S.bpm / 60 / fps;
  const end = Math.max(projectEndBeat(), S.beat + 1);
  const n = Math.max(3, Math.ceil(end / stepBeat) + 1);
  let total = 0, skipped = 0, anyMesh = false;

  for (const p of list){
    if (S.clips.some(c => c.partId === p.id)){ skipped++; continue; }
  const sp = Object.assign({}, HAIR_DEFAULT, p.spring || {});
    p.spring = sp;
    const par = p.parentId ? S.parts.find(q => q.id === p.parentId) : null;

    // 基准姿态：反复烘焙时不能拿「上一次烘焙后的姿态」当基准，否则越叠越夸张
    if (!p.base || !p.keys.length){
      const k0 = p.keys[0];
      p.base = k0
        ? { x:k0.x, y:k0.y, rot:k0.rot, sx:k0.sx, sy:k0.sy, alpha:k0.alpha }
        : { x:p.x, y:p.y, rot:p.rot, sx:p.sx, sy:p.sy, alpha:p.alpha };
    }

    // ① 采样：父级世界角 + 自身原始姿态（此时 p 的旧关键帧还在）
    const samples = [];
    for (let i = 0; i < n; i++){
      const beat = i * stepBeat;
      applyAt(beat);
      const pm = par ? worldOf(par) : rootMatrix();
      samples.push({
        beat, prot: Math.atan2(pm.b, pm.a), px: pm.e, py: pm.f,
        snap: Object.assign({}, p.base, {
          t: beat, tex: p.texIndex, flipX: !!p.flipX, flipY: !!p.flipY,
          ease: { p: [0.42, 0, 0.58, 1] }
        })
      });
    }

    // ② 模拟
    const maxRad = sp.max * Math.PI / 180;
    const windRad = (sp.windOn ? sp.wind : 0) * Math.PI / 180;
    const phase = partDepth(p) * 0.8;
    const useMesh = !!(p.mesh && p.mesh.on && p.bend && p.bend.length);
    if (useMesh) anyMesh = true;
    const segs = useMesh ? Math.max(2, Math.min(500, p.mesh.segs || 32)) : 1;
    const N = samples.length;

    // 发丝在世界里的长度，用来把「位移」换算成「角度」
    const pm0 = par ? worldOf(par) : rootMatrix();
    const hairLen = Math.max(8, p.variants[p.texIndex].bbox.h * Math.hypot(pm0.a, pm0.b) * p.base.sy);

    // 驱动信号 = 父级转角差（取反，落后）+ 父级水平位移 / 发丝长度
    const drives = new Array(N).fill(0);
    const vdrives = new Array(N).fill(0);     // 纵向（沿发丝方向）位移，驱动拉伸/压缩
    let prev = samples[0].prot, ppx = samples[0].px, ppy = samples[0].py;
    for (let i = 0; i < N; i++){
      const sm = samples[i];
      let d = sm.prot - prev;
      while (d > Math.PI) d -= Math.PI * 2;
      while (d < -Math.PI) d += Math.PI * 2;
      prev = sm.prot;
      const dxW = sm.px - ppx, dyW = sm.py - ppy;
      ppx = sm.px; ppy = sm.py;
      const ca = Math.cos(-sm.prot), sa = Math.sin(-sm.prot);
      const localDx = dxW * ca - dyW * sa;
      const localDy = dxW * sa + dyW * ca;
      drives[i] = (-d + localDx / hairLen) * sp.gain;
      vdrives[i] = localDy / hairLen;
    }

    // 根部响应（一阶低通）
    const resp = new Array(N).fill(0);
    let lg = 0;
    for (let i = 0; i < N; i++){ lg = lg * sp.damp + drives[i]; resp[i] = lg; }

    // 纵向：父级上下动的时候，发丝根被拽走、梢还没跟上 → 先拉长后压回
    const vResp = new Array(N).fill(0);
    let vg = 0;
    for (let i = 0; i < N; i++){
      vg = vg * Math.min(0.97, sp.damp + 0.06) + vdrives[i];
      vResp[i] = vg;
    }
    const syAt = i => {
      const k = Math.max(-0.2, Math.min(0.25, vResp[i] * sp.vstretch));
      return Math.max(0.7, Math.min(1.35, 1 + k));
    };
    const sampleAt = fi => {
      const i0 = Math.max(0, Math.min(N - 1, Math.floor(fi)));
      const i1 = Math.min(N - 1, i0 + 1);
      const fr = Math.max(0, Math.min(1, fi - i0));
      return resp[i0] * (1 - fr) + resp[i1] * fr;
    };
    const windAt = beat => windRad * Math.sin(2 * Math.PI * sp.freq * (beat * 60 / S.bpm) + phase);

    const keys = [];
    if (useMesh){
      // 权重：梢部略多分一点，总和归一化 → 总弯曲角与段数无关
      const wt = new Array(segs);
      let wsum = 0;
      for (let k = 0; k < segs; k++){ wt[k] = 1 + 0.6 * (k / segs); wsum += wt[k]; }
      for (let k = 0; k < segs; k++) wt[k] /= wsum;

      // 波沿发丝往下传：第 k 段取「根部响应」延迟一点点的值
      const delayFrames = 0.28 * fps;
      const clampT = v => Math.max(-maxRad, Math.min(maxRad, v));
      for (let i = 0; i < N; i++){
        const sm = samples[i];
        const kk = Object.assign({}, sm.snap);
        kk.t = sm.beat;
        const w = windAt(sm.beat);
        const bend = new Array(segs);
        for (let k = 0; k < segs; k++){
          const off = delayFrames * (k + 1) / segs;
          bend[k] = clampT(sampleAt(i - off) + w * (0.3 + 0.7 * k / segs)) * wt[k];
        }
        kk.bend = bend;
        kk.sy = sm.snap.sy * syAt(i);
        keys.push(kk);
      }
    } else {
      for (let i = 0; i < N; i++){
        const sm = samples[i];
        const kk = Object.assign({}, sm.snap);
        kk.t = sm.beat;
        kk.rot = sm.snap.rot + Math.max(-maxRad, Math.min(maxRad, resp[i])) + windAt(sm.beat);
        kk.sy = sm.snap.sy * syAt(i);
        keys.push(kk);
      }
    }
    writeSnapshots(p, keys);
    total += keys.length;
  }

  applyAt(S.beat); draw(); drawTimeline(); renderInspector();
  toast((anyMesh ? "已生成形变：" : "已生成摆动：") + (list.length - skipped) + " 段、" + total + " 帧" +
        (skipped ? "（跳过 " + skipped + " 个有动作片段的图层）" : ""));
}

function flipPart(p, axis){
  if (!p) return;
  pushUndo();
  const clip = activeClipFor(p, S.beat);
  if (clip){                       // 播放头在片段里 → 改片段自己的镜像
    if (axis === "x") clip.flipX = !clip.flipX;
    else clip.flipY = !clip.flipY;
    p.flipX = !!clip.flipX; p.flipY = !!clip.flipY;
    draw(); drawTimeline(); renderInspector();
    const on = axis === "x" ? clip.flipX : clip.flipY;
    toast("片段「" + p.slot + "」" + (on ? "已" : "取消") + (axis === "x" ? "水平" : "垂直") + "镜像");
    return;
  }
  const prop = axis === "x" ? "flipX" : "flipY";
  if (axis === "x") p.flipX = !p.flipX;
  else p.flipY = !p.flipY;
  // 有动画的图层必须落帧，否则下一次 applyAt 会把镜像回滚掉；
  // 但只落这一条镜像轨道，不能顺手把 10 条轨道全写一遍
  ensureTracks(p);
  if (S.record || p.tracks[prop].length) touchForce(p, prop);
  else syncRest(p, [prop]);
  draw(); drawTimeline(); renderInspector();
  const on = axis === "x" ? p.flipX : p.flipY;
  toast("「" + p.slot + "」" + (on ? "已" : "取消") + (axis === "x" ? "水平" : "垂直") + "镜像");
}

function mirrorSelection(axis){
  const prop = axis === "x" ? "flipX" : "flipY";
  /* 选中项统一成 (partId, t)，镜像就是在这些时间点上翻一下翻转轨道 */
  const pts = (S.selKeys && S.selKeys.length)
    ? selectionToPoints()
    : (S.selKey ? [{ partId: S.selKey.partId, prop, t: S.selKey.t }] : []);
  const clips = (S.selClips || []).slice();
  if (!pts.length && !clips.length){ toast("先在时间轴上选中关键帧或片段"); return; }

  pushUndo("镜像");
  const seen = new Set();
  let nKey = 0;
  for (const it of pts){
    const p = S.parts.find(x => x.id === it.partId);
    if (!p) continue;
    const id = it.partId + "|" + round4(it.t);
    if (seen.has(id)) continue;
    seen.add(id);
    ensureTracks(p);
    const cur = trackOf(p, prop).find(e => Math.abs(e.t - it.t) < 1e-3);
    const base = cur ? cur.v : (p.rest ? p.rest[prop] : 0);
    setTrackKey(p, prop, it.t, base ? 0 : 1, cur ? cur.ease : null);
    nKey++;
  }
  for (const c of clips){
    if (axis === "x") c.flipX = !c.flipX;
    else c.flipY = !c.flipY;
  }
  applyAt(S.beat); draw(); drawTimeline(); renderInspector();
  const bits = [];
  if (nKey) bits.push(nKey + " 个关键帧");
  if (clips.length) bits.push(clips.length + " 个片段");
  toast("已镜像 " + bits.join("、") + "（" + (axis === "x" ? "水平" : "垂直") + "）");
}

function isRootPart(p){
  return !p.parentId || !S.parts.some(q => q.id === p.parentId);
}

function resizeDoc(nw, nh, scaleContent){
  nw = Math.max(16, Math.round(nw || S.doc.w));
  nh = Math.max(16, Math.round(nh || S.doc.h));
  const ow = S.doc.w || nw, oh = S.doc.h || nh;
  let applied = 1;
  if (scaleContent && S.parts.length && ow > 0 && oh > 0 && (ow !== nw || oh !== nh)){
    const kx = nw/ow, ky = nh/oh;
    // 一律取较小值：内容永远装得下，不会被裁掉
    const k = Math.min(kx, ky);
    applied = k;
    const offX = (nw - ow*k)/2, offY = (nh - oh*k)/2;
    for (const p of S.parts){
      if (!isRootPart(p)) continue;   // 子级跟着父级矩阵自动缩放
      p.x = p.x*k + offX; p.y = p.y*k + offY;
      p.sx *= k; p.sy *= k;
      for (const key of p.keys){
        key.x = key.x*k + offX; key.y = key.y*k + offY;
        key.sx *= k; key.sy *= k;
      }
    }
    for (const c of S.clips){
      const part = S.parts.find(q => q.id === c.partId);
      if (!part || !isRootPart(part)) continue;
      c.base.x = c.base.x*k + offX; c.base.y = c.base.y*k + offY;
      c.base.sx *= k; c.base.sy *= k;
      // 片段里存的是绝对缩放（弹一下 1.14 之类），要记一个倍数，否则播放到片段时又不跟着缩放
      c.k = (c.k || 1) * k;
    }
  }
  S.doc = { w: nw, h: nh };
  return applied;
}

/* 保持当前镜头比例，只把画布重新居中：改尺寸时能直接看出画布变大了 */
function centerView(){
  const W = view.clientWidth, H = view.clientHeight;
  S.view.ox = (W - S.doc.w * S.view.scale) / 2;
  S.view.oy = (H - S.doc.h * S.view.scale) / 2;
}

function selectPart(p){
  if (S.crop) S.crop = null;
  if (S.selected !== p){ S.selected = p; clearSel(); }
  renderAll();
}

/* ============================ 检查器 ============================ */
/* 同一图层同一分页内重渲染时保留滚动位置，换图层 / 换分页才回到顶部 */
let inspScrollKey = "";
function renderInspector(){
  const box = document.getElementById("inspBody");
  const key = S.tab + "|" + (S.selected ? S.selected.id : "-");
  const keep = (key === inspScrollKey) ? box.scrollTop : 0;
  inspScrollKey = key;
  if (S.tab === "props") renderProps(box);
  else if (S.tab === "curve") renderCurve(box);
  else if (S.tab === "action") renderActions(box);
  else renderScene(box);
  if (keep > 0) box.scrollTop = keep;
}

/* 属性轨道列表：每个属性一个按钮，点一下在播放头打点 / 删点 */
function trackRowsHTML(p){
  ensureTracks(p);
  return TRACK_PROPS.map(k => {
    const tr = p.tracks[k];
    const cnt = tr.length;
    const at = trackHasKey(p, k, S.beat);
    const cls = "tbtn" + (cnt ? " has" : "") + (at ? " on" : "");
    const tip = at
      ? "删掉播放头处「" + PROP_LABEL[k] + "」的关键帧"
      : "在播放头给「" + PROP_LABEL[k] + "」打一个关键帧";
    return '<button class="' + cls + '" data-prop="' + k + '" title="' + tip + '">' +
      '<span class="dot"></span><span>' + PROP_LABEL[k] + '</span>' +
      (cnt ? '<span class="cnt">' + cnt + '</span>' : '') +
    '</button>';
  }).join("");
}

function renderProps(box){
  const p = S.selected;
  if (!p){
    box.innerHTML = '<div class="sec">未选中图层</div><div style="padding:0 10px 10px;color:var(--text-3);line-height:1.7">在左侧选择图层，或在画布上点选部件。</div>';
    return;
  }
  const parentOpts = ['<option value="">（无父级）</option>'].concat(
    S.parts.filter(q => q.id !== p.id).map(q =>
      '<option value="' + q.id + '"' + (p.parentId === q.id ? " selected" : "") + '>' + q.slot + '</option>')
  ).join("");

  const folderOpts = ['<option value="">（不放入资料夹）</option>'].concat(
    (S.folders || []).map(f =>
      '<option value="' + f.id + '"' + (p.folderId === f.id ? " selected" : "") + '>' + esc(f.name) + '</option>')
  ).join("");

  const sh = p.shape;
  const shapeSection = !sh ? "" :
    '<div class="sec">图形</div>' +
    '<div class="row"><label>形状</label><select id="shType">' +
      SHAPE_KINDS.map(k => '<option value="' + k.id + '"' + (sh.type === k.id ? " selected" : "") + '>' + k.name + '</option>').join("") +
    '</select></div>' +
    '<div class="row"><label>尺寸</label>' +
      '<input id="shW" type="number" min="4" max="4000" step="1" value="' + Math.round(sh.w) + '" title="宽">' +
      '<span style="color:var(--text-3);font-size:11px">×</span>' +
      '<input id="shH" type="number" min="4" max="4000" step="1" value="' + Math.round(sh.h) + '" title="高">' +
    '</div>' +
    '<div class="row"><label>填充</label>' +
      '<input id="shFillOn" type="checkbox"' + (sh.fillOn ? " checked" : "") + ' title="取消勾选 = 中空，只留描边">' +
      '<input id="shFill" type="color" value="' + sh.fill + '">' +
      '<span style="color:var(--text-3);font-size:10.5px">取消勾选＝中空</span>' +
    '</div>' +
    '<div class="row"><label>描边</label>' +
      '<input id="shStrokeOn" type="checkbox"' + (sh.strokeOn ? " checked" : "") + '>' +
      '<input id="shStroke" type="color" value="' + sh.stroke + '">' +
      '<input id="shStrokeW" type="number" min="0" max="200" step="1" value="' + Math.round(sh.strokeW) + '" style="width:48px" title="描边宽度">' +
    '</div>' +
    (sh.type === "star" ?
      '<div class="row"><label>角数</label><input id="shPoints" type="number" min="3" max="24" step="1" value="' + sh.points + '">' +
      '<label style="width:auto;margin-left:8px">内径</label><input id="shInner" type="number" min="8" max="95" step="1" value="' + Math.round(sh.inner * 100) + '"><span style="color:var(--text-3);font-size:10.5px">%</span></div>' : "") +
    (sh.type === "polygon" ?
      '<div class="row"><label>边数</label><input id="shSides" type="number" min="3" max="24" step="1" value="' + sh.sides + '"></div>' : "") +
    ((sh.type === "roundrect" || sh.type === "bubble") ?
      '<div class="row"><label>圆角</label><input id="shRadius" type="number" min="0" max="800" step="1" value="' + Math.round(sh.radius) + '"></div>' : "") +
    (sh.type === "ring" ?
      '<div class="row"><label>环厚</label><input id="shThick" type="number" min="4" max="90" step="1" value="' + Math.round(sh.thick * 100) + '"><span style="color:var(--text-3);font-size:10.5px">%</span></div>' : "") +
    '<div class="hintline">矢量图形，放大不糊。尺寸改完按回车；形状本身也能打关键帧、加组件。</div>';

  const sp = Object.assign({}, HAIR_DEFAULT, p.spring || {});
  const clipOn = !!(p.clip && p.clip.srcId);
  const clipSrcOpts = ['<option value="">（无）</option>'].concat(
    S.parts.filter(q => q.id !== p.id).map(q =>
      '<option value="' + q.id + '"' + (clipOn && p.clip.srcId === q.id ? " selected" : "") + '>' +
      esc(q.slot) + '</option>')
  ).join("");
  const variants = p.variants.map((v, i) =>
    '<div class="vitem' + (i === p.texIndex ? " on" : "") + '" data-i="' + i + '">' +
      '<img src="' + v.thumb + '">' +
      (v.variant ? '<span class="vname">' + v.variant + '</span>' : "") +
      (p.variants.length > 1 ? '<span class="vdel" data-del="' + i + '" title="删除这张贴图">×</span>' : "") +
    '</div>').join("");

  /* ---- 文字图层专属区块 ---- */
  const isText = p.kind === "text";
  if (isText && !p.text) p.text = textStyleOf(p);
  const tx = isText ? textStyleOf(p) : null;
  const fontOpts = (() => {
    const cats = [...new Set(FONTS.map(f => f.cat))];
    return cats.map(c => '<optgroup label="' + c + '">' +
      FONTS.filter(f => f.cat === c).map(f =>
        '<option value="' + f.id + '"' + (tx && f.id === tx.font ? " selected" : "") + '>' +
        f.name + ' · ' + f.lic + '</option>').join("") + '</optgroup>').join("");
  })();
  const textSection = !isText ? "" :
    '<div class="sec">文字</div>' +
    '<div class="row area"><textarea id="tStr" rows="2" placeholder="输入文字，回车换行">' + esc(tx.str) + '</textarea></div>' +
    '<div class="row"><label>字体</label><select id="tFont">' + fontOpts + '</select></div>' +
    '<div class="row"><label>字号</label><input id="tSize" type="number" min="4" max="800" step="1" value="' + tx.size + '">' +
      '<label>字重</label><select id="tWeight" style="width:70px">' +
        [300, 400, 500, 700, 900].map(w => '<option value="' + w + '"' + (w === tx.weight ? " selected" : "") + '>' + w + '</option>').join("") +
      '</select></div>' +
    '<div class="row"><label>颜色</label><input id="tColor" type="color" value="' + tx.color + '">' +
      '<label>对齐</label><select id="tAlign" style="width:74px">' +
        [["center", "居中"], ["left", "左"], ["right", "右"]].map(([v, n]) =>
          '<option value="' + v + '"' + (tx.align === v ? " selected" : "") + '>' + n + '</option>').join("") +
      '</select></div>' +
    '<div class="row"><label>行距</label><input id="tLineH" type="range" min="80" max="220" step="5" value="' + Math.round((tx.lineH || 1.28) * 100) + '"><span class="val" id="vLineH">' + (tx.lineH || 1.28).toFixed(2) + '</span></div>' +
    '<div class="row"><button id="tItalic" class="mini' + (tx.italic ? " on" : "") + '" style="flex:none">斜体' + (tx.italic ? " 开" : " 关") + '</button>' +
      '<button id="tFit" class="mini" style="flex:1" title="字号调到刚好占满画布宽度的 80%">适应宽度</button></div>' +
    '<div class="row"><label>描边</label><button id="tStrokeOn" class="mini' + (tx.strokeOn ? " on" : "") + '" style="flex:none">' + (tx.strokeOn ? "开" : "关") + '</button>' +
      '<input id="tStrokeColor" type="color" value="' + tx.strokeColor + '">' +
      '<input id="tStrokeW" type="number" min="0" max="40" step="1" value="' + tx.strokeW + '" style="width:52px" title="描边粗细"></div>' +
    '<div class="row"><label>阴影</label><button id="tShadowOn" class="mini' + (tx.shadowOn ? " on" : "") + '" style="flex:none">' + (tx.shadowOn ? "开" : "关") + '</button>' +
      '<input id="tShadowColor" type="color" value="' + tx.shadowColor + '">' +
      '<input id="tShadowBlur" type="number" min="0" max="60" step="1" value="' + tx.shadowBlur + '" style="width:52px" title="模糊半径"></div>' +
    '<div class="hintline">字体都是免费可商用的（SIL OFL 1.1 或作者声明）。第一次选某个字体时会联网加载，加载完自动重绘。</div>';

  // 滑块 + 可直接键盘输入的数字框（同一个值两个入口）
  const numRow = (label, id, min, max, step, val, unit) =>
    '<div class="row"><label>' + label + '</label>' +
    '<input id="f' + id + '" type="range" min="' + min + '" max="' + max + '" step="' + step + '" value="' + val + '">' +
    '<input id="n' + id + '" class="val" type="number" step="' + step + '" value="' + val + '">' +
    (unit ? '<span class="un">' + unit + '</span>' : '') + '</div>';

  const deg = p.rot * 180 / Math.PI;
  const wrapDeg = d => { let x = ((d + 180) % 360 + 360) % 360 - 180; return Math.round(x * 10) / 10; };
  const hueDeg = p.hue || 0;

  box.innerHTML =
    '<div class="sec">图层</div>' +
    '<div class="row"><label>名称</label><input id="fName" type="text" value="' + esc(p.slot) + '"></div>' +
    '<div class="row"><label>父级</label><select id="fParent">' + parentOpts + '</select>' +
      (p.parentId ? '<button id="btnFixPos" class="mini" style="flex:none" title="绑定后位置错乱时用：把位置关键帧和静态值换算进当前父级坐标系">⟲</button>' : '') +
    '</div>' +
    '<div class="row"><label>资料夹</label><select id="fFolder">' + folderOpts + '</select></div>' +
    shapeSection +
    textSection +
    (isText ? "" :
      '<div class="sec">贴图（' + p.variants.length + '）</div>' +
      '<div class="variants">' + variants + '<div class="vitem add" id="vAdd">＋</div></div>' +
      '<div class="row"><button id="btnCrop" class="mini" style="flex:1">裁切这张贴图</button><button id="btnHueReset" class="mini" style="flex:none" title="色相归零">色相↺</button></div>') +
    '<div class="sec">动画轨道</div>' +
    '<div class="tracks">' + trackRowsHTML(p) + '</div>' +
    (p.subMode
      ? '<div class="hintline">子轨道模式已开启（不可逆）——主行不再显示总关键帧，所有编辑都在下面各条轨道上。</div>'
      : '<div class="row"><button id="btnSubMode" style="flex:1" title="开启后没有总关键帧，只有子轨道点">开启子轨道模式（不可逆）</button></div>') +
    '<div class="hintline">点属性名在播放头打点 / 删点。每个属性一条独立轨道，互不影响——给旋转打点不会带上嘴型，挪位置也不会破坏对口型。</div>' +
    '<div class="sec">变换</div>' +
    '<div class="row"><label>X</label><input id="fX" type="number" value="' + Math.round(p.x) + '"><label>Y</label><input id="fY" type="number" value="' + Math.round(p.y) + '"></div>' +
    '<div class="row"><label>旋转</label><input id="fRot" type="range" min="-180" max="180" step="1" value="' + wrapDeg(deg) + '"><input id="nRot" class="val" type="number" step="1" value="' + Math.round(deg*10)/10 + '" title="角度不取模，可以填 720 表示两圈；滑块只显示当前朝向"><span class="un">°</span><span class="turns" id="rotTurns"></span></div>' +
    numRow("缩放X", "Sx", 10, 300, 1, Math.round(p.sx*100), "%") +
    numRow("缩放Y", "Sy", 10, 300, 1, Math.round(p.sy*100), "%") +
    '<div class="row"><button id="btnLink" class="mini" style="flex:none">' + (S.linkScale ? "已链接" : "独立") + '</button><button id="btnResetScale" class="mini" style="flex:1">重置缩放</button></div>' +
    '<div class="row"><button id="btnFlipH" class="mini' + (p.flipX ? " on" : "") + '" style="flex:1" title="快捷键 H">⇋ 水平镜像</button><button id="btnFlipV" class="mini' + (p.flipY ? " on" : "") + '" style="flex:1" title="快捷键 V">⇅ 垂直镜像</button></div>' +
    (ancestorFlip(p) ? '<div style="padding:0 10px 8px;color:#E34850;font-size:10.5px;line-height:1.5">父级已镜像，本层会跟着翻转</div>' : '') +
    numRow("透明", "Alpha", 0, 100, 1, Math.round(p.alpha*100), "%") +
    numRow("色相", "Hue", -180, 180, 1, Math.round(hueDeg), "°") +
    '<div class="sec">蒙版</div>' +
    '<div class="row"><label>裁剪源</label><select id="clipSrc">' + clipSrcOpts + '</select></div>' +
    '<div class="row"><label>反转</label><button id="clipInv" style="flex:1"' +
      (clipOn ? '' : ' disabled') + '>' +
      (!clipOn ? "先选裁剪源" : (p.clip.invert ? "开 · 只显示源外" : "关 · 只显示源内")) + '</button></div>' +
    '<div class="hintline">用另一个图层的透明度裁这一层：源不透明的地方才显示。眼皮裁眼白、头发裁脸、遮罩转场都用它。裁剪源本身不用隐藏。</div>' +
    '<div class="sec">发丝摆动</div>' +
    (p.parentId ? "" : '<div style="padding:0 10px 4px;color:var(--text-3);font-size:10.5px">挂在父级图层下才有摆动</div>') +
    numRow("阻尼", "SpDamp", 50, 98, 1, Math.round(sp.damp*100), "%") +
    numRow("跟随", "SpGain", 0, 200, 5, Math.round(sp.gain*100), "%") +
    numRow("最大角", "SpMax", 5, 60, 1, sp.max, "°") +
    numRow("纵向", "SpStretch", 0, 200, 5, Math.round((sp.vstretch === undefined ? 1.2 : sp.vstretch) * 100), "%") +
    '<div class="row"><button id="spWindOn" class="mini' + (sp.windOn ? " on" : "") + '" style="flex:none">随风</button><input id="spWind" type="range" min="0" max="30" step="1" value="' + sp.wind + '"><input id="nSpWind" class="val" type="number" step="1" value="' + sp.wind + '"><span class="un">°</span></div>' +
    '<div class="row"><button id="spMesh" class="mini' + (p.mesh && p.mesh.on ? " on" : "") + '" style="flex:none">网格</button><input id="spSegs" type="range" min="3" max="500" step="1" value="' + ((p.mesh && p.mesh.segs) || 32) + '"><input id="nSpSegs" class="val" type="number" min="3" max="500" step="1" value="' + ((p.mesh && p.mesh.segs) || 32) + '"><span class="un">段</span></div>' +
    '<div class="row"><button id="btnHairBake" class="mini" style="flex:1">' + (p.mesh && p.mesh.on ? "生成形变关键帧" : "生成摆动关键帧") + '</button><button id="btnHairClear" class="mini" style="flex:none">清除</button></div>' +
    '<div class="sec">轴心</div>' +
    '<div class="row"><label>X</label><input id="fPx" type="number" value="' + Math.round(p.ax) + '"><label>Y</label><input id="fPy" type="number" value="' + Math.round(p.ay) + '"></div>' +
    '<div class="row"><button id="btnPivot" style="flex:1">画布上点选</button><button id="btnPivotCenter" style="flex:1">回到中心</button></div>' +
    '<div class="sec">' + (p.subMode ? '轨道关键帧（' + trackPointCount(p) + '）' : '关键帧（' + p.keys.length + '）') + '</div>' +
    clipHint(p) +
    '<div class="row"><button id="btnClearKeys" style="flex:1">清除关键帧</button></div>' +
    '<div style="padding:0 10px 10px;color:var(--text-3);font-size:10.5px;line-height:1.6">旋转与缩放都围绕轴心进行，旋转可以超过 360°（输入 720 就是两圈）。底部工具栏的「● 自动记录」是全局开关，开启时改属性会在播放头落关键帧。<br>打包成组件请用底部工具栏的「＋ 存为组件」。</div>';

  const bind = (id, ev, fn) => { const el = document.getElementById(id); if (el) el.addEventListener(ev, fn); };

  const bsm = document.getElementById("btnSubMode");
  if (bsm) bsm.onclick = () => enableSubMode(p);

  /* 属性轨道：点一下打点，再点一下删点 */
  box.querySelectorAll(".tbtn").forEach(b => {
    b.onclick = () => {
      const k = b.dataset.prop;
      const at = S.beat;
      const had = trackHasKey(p, k, at);
      if (had){
        pushUndo("删除「" + PROP_LABEL[k] + "」关键帧");
        removeTrackKey(p, k, at);
      } else {
        pushUndo("添加「" + PROP_LABEL[k] + "」关键帧");
