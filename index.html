};

if (window.rigframeAPI){
  const API = window.rigframeAPI;
  let curPath = null, curName = null;

  const setTitle = () => { docTitleName = curName || ""; setDirtyTitle(); };
  if (API.onProjectPath) API.onProjectPath(info => {
    if (!info) return;
    curPath = info.path; curName = info.name; setTitle();
  });

  const resetProject = (w, h) => {
    stop();
    S.doc = { w, h };
    S.parts = []; S.clips = []; S.cues = [];
    S.selected = null; S.midi = null; S.beat = 0;
    S.audio = null; S.audioDur = 0; S.audioName = ""; S.audioOffset = 0;
    S.audioStart = 0; S.audioIn = 0; S.audioOut = 0;
    S.audioPeaks = null; waveKey = "";
    undoStack.length = 0; redoStack.length = 0;
    setCustomActions([]);          // 组件属于工程，新建即清空
    curPath = null; curName = null; setTitle();
    markClean();
    try { AutoStore.clear(); } catch(e){}
    fitView(); renderAll(); syncUndoBtns();
  };

  // 主进程把工程推过来（启动器双击 / 新建）
  API.onLoadProject(async payload => {
    if (!payload) return;
    gotProjectPush = true;
    if (payload.data){
      const bytes = new Uint8Array(payload.data);
      await importProject(new File([bytes], payload.name || "project.rfz"));
      if (payload.path){ curPath = payload.path; curName = payload.name || null; setTitle(); }
      /* 从自动保存恢复进来的：立刻重新落一份快照，别让用户刚恢复又丢 */
      if (payload.fromAutoSave){
        S.dirty = true;
        setTimeout(() => autoSaveTick(true), 800);
      }
    } else if (payload.newDoc){
      resetProject(payload.newDoc.w || 1080, payload.newDoc.h || 1080);
      toast("新工程 " + S.doc.w + "×" + S.doc.h + "，把分层 PNG 拖进来");
    }
  });

  // 保存 / 另存为：打包成 .rfz 交给主进程写盘
  const doSave = async saveAs => {
    try {
      const { data, files } = await packProject();
      files.unshift({ name: "project.json", data: new TextEncoder().encode(JSON.stringify(data)) });
      const zip = zipBuild(files);
      const r = await API.saveProject(new Uint8Array(zip), curName || ("rigframe-" + stamp() + ".rfz"), { saveAs });
      if (r && r.ok){
        curPath = r.path; curName = r.name; setTitle();
        markClean();
        try { await AutoStore.clear(); } catch(e){}
        toast((saveAs ? "已另存为 " : "已保存 ") + r.name);
      } else if (r && r.canceled){
        toast("已取消保存");
      }
    } catch(e){
      console.error(e);
      toast("保存失败：" + (e && e.message ? e.message : e));
    }
  };

  // 桌面端不再用顶栏的「导出工程」，改由「文件」菜单驱动
  const bs = document.getElementById("btnSave");
  if (bs) bs.style.display = "none";

  const handleMenu = action => {
    if (action === "save") doSave(false);
    else if (action === "saveAs") doSave(true);
    else if (action === "open") document.getElementById("btnLoad").click();
    else if (action === "new"){
      resetProject(S.doc.w || 1080, S.doc.h || 1080);
      toast("新工程 " + S.doc.w + "×" + S.doc.h);
    }
    else if (action === "export") document.getElementById("btnExport").click();
    else if (action === "fit") zoomFit();
  };
  if (API.onMenu) API.onMenu(handleMenu);
  window.__rfMenuAction = handleMenu;   // 自动化测试驱动同一段逻辑（等价于点菜单）

  document.getElementById("btnLoad").onclick = async () => {
    try {
      const r = await API.pickProject({});
      if (r && r.data){
        await importProject(new File([new Uint8Array(r.data)], r.name || "project.rfz"));
        curPath = r.path || null; curName = r.name || null; setTitle();
      }
    } catch(e){
      console.error(e); toast("打开失败：" + (e && e.message ? e.message : e));
    }
  };

  // 导出弹窗里显示格式选择
  API.info().then(info => {
    const row = document.getElementById("expFmtRow");
    if (!row) return;
    row.style.display = "flex";
    const hint = document.getElementById("expFmtHint");
    if (!info.ffmpegOk){
      const sel = document.getElementById("expFmt");
      const mp4 = sel && sel.querySelector('option[value="mp4"]');
      if (mp4){ mp4.disabled = true; sel.value = "webm"; }
      if (hint) hint.textContent = "缺 ffmpeg";
    } else if (hint){
      hint.textContent = "MP4 走 ffmpeg 转码";
    }
  });
}

/* ============================ 主题初始化 ============================ */
document.querySelectorAll("#themePick .sw").forEach(b => {
  b.onclick = () => setTheme(b.dataset.theme);
});
setTheme(THEME, false);
if (window.rigframeAPI && window.rigframeAPI.getSettings){
  window.rigframeAPI.getSettings().then(st => {
    appSettings = st || {};
    if (st && st.theme && st.theme !== THEME) setTheme(st.theme, false);
  }).catch(() => {});
  if (window.rigframeAPI.onSettings){
    window.rigframeAPI.onSettings(st => {
      appSettings = st || {};
      if (st && st.theme && st.theme !== THEME) setTheme(st.theme, false);
    });
  }
}
</script>
