/* ---------- ZIP 容器（store 模式，不压缩）---------- */
let CRC_TABLE = null;
function crc32(u8){
  if (!CRC_TABLE){
    CRC_TABLE = new Uint32Array(256);
    for (let i = 0; i < 256; i++){
      let c = i;
      for (let k = 0; k < 8; k++) c = (c & 1) ? (0xEDB88320 ^ (c >>> 1)) : (c >>> 1);
      CRC_TABLE[i] = c >>> 0;
    }
  }
  let c = 0xFFFFFFFF;
  for (let i = 0; i < u8.length; i++) c = CRC_TABLE[(c ^ u8[i]) & 0xFF] ^ (c >>> 8);
  return (c ^ 0xFFFFFFFF) >>> 0;
}
function dosTime(d){
  return {
    t: ((d.getHours() & 31) << 11) | ((d.getMinutes() & 63) << 5) | ((d.getSeconds() / 2) & 31),
    d: (((d.getFullYear() - 1980) & 127) << 9) | (((d.getMonth() + 1) & 15) << 5) | (d.getDate() & 31)
  };
}
function zipBuild(files){
  const enc = new TextEncoder();
  const dt = dosTime(new Date());
  const parts = [], central = [];
  let offset = 0;
  for (const f of files){
    const nb = enc.encode(f.name);
    const crc = crc32(f.data);
    const lh = new Uint8Array(30 + nb.length);
    const lv = new DataView(lh.buffer);
    lv.setUint32(0, 0x04034b50, true);
    lv.setUint16(4, 20, true); lv.setUint16(6, 0, true); lv.setUint16(8, 0, true);
    lv.setUint16(10, dt.t, true); lv.setUint16(12, dt.d, true);
    lv.setUint32(14, crc, true);
    lv.setUint32(18, f.data.length, true); lv.setUint32(22, f.data.length, true);
    lv.setUint16(26, nb.length, true); lv.setUint16(28, 0, true);
    lh.set(nb, 30);
    parts.push(lh, f.data);

    const ch = new Uint8Array(46 + nb.length);
    const cv = new DataView(ch.buffer);
    cv.setUint32(0, 0x02014b50, true);
    cv.setUint16(4, 20, true); cv.setUint16(6, 20, true);
    cv.setUint16(8, 0, true); cv.setUint16(10, 0, true);
    cv.setUint16(12, dt.t, true); cv.setUint16(14, dt.d, true);
    cv.setUint32(16, crc, true);
    cv.setUint32(20, f.data.length, true); cv.setUint32(24, f.data.length, true);
    cv.setUint16(28, nb.length, true);
    cv.setUint32(42, offset, true);
    ch.set(nb, 46);
    central.push(ch);
    offset += lh.length + f.data.length;
  }
  let cdSize = 0;
  for (const c of central) cdSize += c.length;
  const eocd = new Uint8Array(22);
  const ev = new DataView(eocd.buffer);
  ev.setUint32(0, 0x06054b50, true);
  ev.setUint16(8, central.length, true);
  ev.setUint16(10, central.length, true);
  ev.setUint32(12, cdSize, true);
  ev.setUint32(16, offset, true);

  const all = parts.concat(central, [eocd]);
  let total = 0;
  for (const a of all) total += a.length;
  const out = new Uint8Array(total);
  let p = 0;
  for (const a of all){ out.set(a, p); p += a.length; }
  return out;
}
async function zipRead(buf){
  const u8 = new Uint8Array(buf);
  const dv = new DataView(buf);
  let eocd = -1;
  const min = Math.max(0, u8.length - 65558);
  for (let i = u8.length - 22; i >= min; i--){
    if (dv.getUint32(i, true) === 0x06054b50){ eocd = i; break; }
  }
  if (eocd < 0) throw new Error("不是有效的 zip");
  const count = dv.getUint16(eocd + 10, true);
  let off = dv.getUint32(eocd + 16, true);
  const dec = new TextDecoder();
  const out = new Map();
  for (let i = 0; i < count; i++){
    if (dv.getUint32(off, true) !== 0x02014b50) break;
    const method = dv.getUint16(off + 10, true);
    const csize = dv.getUint32(off + 20, true);
    const nameLen = dv.getUint16(off + 28, true);
    const extraLen = dv.getUint16(off + 30, true);
    const cmtLen = dv.getUint16(off + 32, true);
    const lho = dv.getUint32(off + 42, true);
    const name = dec.decode(u8.subarray(off + 46, off + 46 + nameLen));
    const lnameLen = dv.getUint16(lho + 26, true);
    const lextraLen = dv.getUint16(lho + 28, true);
    const start = lho + 30 + lnameLen + lextraLen;
    let data = u8.slice(start, start + csize);
    if (method === 8 && typeof DecompressionStream !== "undefined"){
      const stream = new Blob([data]).stream().pipeThrough(new DecompressionStream("deflate-raw"));
      data = new Uint8Array(await new Response(stream).arrayBuffer());
    }
    out.set(name, data);
    off += 46 + nameLen + extraLen + cmtLen;
  }
  return out;
}
function extOfBytes(b){
  if (b[0] === 0x89 && b[1] === 0x50) return "png";
  if (b[0] === 0xFF && b[1] === 0xD8) return "jpg";
  if (b[0] === 0x47 && b[1] === 0x49) return "gif";
  if (b[0] === 0x52 && b[1] === 0x49 && b[8] === 0x57) return "webp";
  if (b[0] === 0x3C) return "svg";                       // "<"
  return "png";
}
async function srcToBytes(src){
  if (!src) return null;
  if (src.startsWith("data:")){
    const i = src.indexOf(",");
    const head = src.slice(0, i);
    if (head.indexOf("base64") < 0) return new TextEncoder().encode(decodeURIComponent(src.slice(i + 1)));
    const bin = atob(src.slice(i + 1));
    const u8 = new Uint8Array(bin.length);
    for (let k = 0; k < bin.length; k++) u8[k] = bin.charCodeAt(k);
    return u8;
  }
  const r = await fetch(src);
  return new Uint8Array(await r.arrayBuffer());
}

/* ---------- 工程数据 ---------- */
function buildProjectData(jobs){
  let pIdx = 0;
  const packImg = (img, base) => {
    if (!jobs) return { src: img.src };
    const name = "assets/" + base + "." + extOfBytesFromSrc(img.src);
    jobs.push({ name, img });
    return { file: name };
  };
  const bgPack = S.bg.img ? packImg(S.bg.img, "bg") : null;

  const data = {
    app: "rigframe", version: 4,
    doc: S.doc,
    bg: { type: S.bg.type, color: S.bg.color, c1: S.bg.c1, c2: S.bg.c2, angle: S.bg.angle },
    bpm: S.bpm, sig: S.sig, sigText: S.sigText, cues: S.cues,
    folders: (S.folders || []).map(f => ({ id: f.id, name: f.name, collapsed: !!f.collapsed })),
    midi: S.midi ? { name: S.midi.name, ppq: S.midi.ppq, tempoBpm: S.midi.tempoBpm, durBeat: S.midi.durBeat,
                     notes: S.midi.notes, pitches: S.midi.pitches, chans: S.midi.chans } : null,
    prMode: S.prMode,
    clips: S.clips.map(c => ({ partId: c.partId, actionId: c.actionId, start: c.start, dur: c.dur,
                               flipX: !!c.flipX, flipY: !!c.flipY, base: c.base })),
    /* 自定义组件跟着工程走，不再只存在浏览器里 */
    customActions: ACTION_LIB.filter(a => a.custom).map(a => JSON.parse(JSON.stringify(a))),
    parts: S.parts.map(p => {
      const idx = pIdx++;
      return {
        id: p.id, slot: p.slot, kind: p.kind, parentId: p.parentId,
        x: p.x, y: p.y, rot: p.rot, sx: p.sx, sy: p.sy, alpha: p.alpha, hue: p.hue || 0,
        flipX: !!p.flipX, flipY: !!p.flipY,
        clip: p.clip && p.clip.srcId ? { srcId: p.clip.srcId, invert: !!p.clip.invert } : null,
        ax: p.ax, ay: p.ay, pu: p.pu, pv: p.pv,
        mesh: p.mesh ? { ...p.mesh } : null,
        spring: p.spring ? { ...p.spring } : null,
        base: p.base ? { ...p.base } : null,
        bend: p.bend ? p.bend.slice() : null,
        texIndex: p.texIndex, visible: p.visible, locked: p.locked,
        defTex: p.defTex | 0,
        text: p.text ? { ...p.text } : null,
        notes: partNotes(p).map(n => ({ row: n.row, t: n.t, dur: n.dur })),
        keys: p.keys.map(k => ({ ...k })),
        tracks: JSON.parse(JSON.stringify(p.tracks || {})),
        bendKeys: JSON.parse(JSON.stringify(p.bendKeys || [])),
        rest: p.rest ? { ...p.rest } : null,
        subMode: !!p.subMode,
        folderId: p.folderId || null,
        shape: p.shape ? JSON.parse(JSON.stringify(p.shape)) : null,
        variants: p.kind === "text"
          ? [{ variant: "text" }]
          : p.variants.map((v, vi) => Object.assign(
              { variant: v.variant, ax: v.ax, ay: v.ay, bbox: v.bbox },
              packImg(v.img, "p" + idx + "_" + vi)))
      };
    })
  };
  if (bgPack){
    if (bgPack.file) data.bg.imgFile = bgPack.file;
    else data.bg.imgSrc = bgPack.src;
  }
  return data;
}
function mimeOfName(name){
  const e = String(name).split(".").pop().toLowerCase();
  if (e === "svg") return "image/svg+xml";
  if (e === "jpg" || e === "jpeg") return "image/jpeg";
  if (e === "webp") return "image/webp";
  if (e === "gif") return "image/gif";
  if (e === "avif") return "image/avif";
  return "image/png";
}
function extOfBytesFromSrc(src){
  if (!src) return "png";
  if (src.startsWith("data:")){
    const m = /^data:image\/([a-z0-9+.-]+)/i.exec(src);
    if (m){
      const t = m[1].toLowerCase();
      if (t === "svg+xml") return "svg";
      if (t === "jpeg") return "jpg";
      return t;
    }
  }
  return "png";
}

/* ---------- 导出工程（zip 容器） ---------- */
async function packProject(){
  const jobs = [];
  const data = buildProjectData(jobs);
  const files = [];
  const renames = new Map();
  for (const j of jobs){
    const bytes = await srcToBytes(j.img.src);
    if (!bytes || !bytes.length) continue;
    // 扩展名以真实字节为准（blob: 的 src 猜不出格式）
    const want = j.name.replace(/\.[^.]+$/, "") + "." + extOfBytes(bytes);
    if (want !== j.name) renames.set(j.name, want);
    files.push({ name: want, data: bytes });
  }
  if (renames.size) rewriteAssetNames(data, renames);

  if (S.audio && S.audio.src && S.audioDur > 0){
    try {
      const bytes = await srcToBytes(S.audio.src);
      if (bytes && bytes.length){
        const ext = ((S.audioName.split(".").pop() || "mp3").toLowerCase().replace(/[^a-z0-9]/g, "")) || "mp3";
        const name = "assets/audio." + ext;
        files.push({ name, data: bytes });
        data.audio = {
          file: name, name: S.audioName || "audio." + ext,
          start: S.audioStart || 0, in: S.audioIn || 0, out: S.audioOut || 0,
          offset: audioOffsetSec()
        };
      }
    } catch(e){ console.warn("音频打包失败", e); }
  }
  return { data, files };
}

document.getElementById("btnSave").onclick = async () => {
  toast("正在打包贴图…");
  let packed;
  try {
    packed = await packProject();
  } catch(e){
    console.error(e); toast("打包失败：" + e.message); return;
  }
  const { data, files } = packed;
  files.unshift({ name: "project.json", data: new TextEncoder().encode(JSON.stringify(data)) });
  const zip = zipBuild(files);
  const blob = new Blob([zip], { type: "application/zip" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "rigframe-" + stamp() + ".rfz";
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 8000);
  toast("已导出工程：" + (files.length - 1) + " 张贴图，" + (zip.length / 1048576).toFixed(1) + " MB");
};
function rewriteAssetNames(data, renames){
  for (const p of (data.parts || []))
    for (const v of (p.variants || []))
      if (v.file && renames.has(v.file)) v.file = renames.get(v.file);
  if (data.bg && data.bg.imgFile && renames.has(data.bg.imgFile)) data.bg.imgFile = renames.get(data.bg.imgFile);
}
function stamp(){
  const d = new Date();
  const p2 = n => String(n).padStart(2, "0");
  return d.getFullYear() + p2(d.getMonth()+1) + p2(d.getDate()) + "-" + p2(d.getHours()) + p2(d.getMinutes());
}

/* ---------- 导入工程 ---------- */
document.getElementById("btnLoad").onclick = () => document.getElementById("projPick").click();
document.getElementById("projPick").onchange = e => {
  const f = e.target.files[0];
  e.target.value = "";
  if (f) importProject(f);
};

async function importProject(file){
  try{
    if (file && file.name) docTitleName = file.name.replace(/\.(rfz|zip)$/i, "");
    const buf = new Uint8Array(await file.arrayBuffer());
    if (buf[0] === 0x50 && buf[1] === 0x4B){        // "PK" = zip 容器
      const files = await zipRead(buf.buffer);
      const jb = files.get("project.json");
      if (!jb) throw new Error("压缩包里没有 project.json");
      const data = JSON.parse(new TextDecoder().decode(jb));
      for (const raw of (data.parts || []))
        for (const v of (raw.variants || []))
          if (v.file && files.has(v.file)) v.src = URL.createObjectURL(new Blob([files.get(v.file)], { type: mimeOfName(v.file) }));
      if (data.bg && data.bg.imgFile && files.has(data.bg.imgFile))
        data.bg.imgSrc = URL.createObjectURL(new Blob([files.get(data.bg.imgFile)], { type: mimeOfName(data.bg.imgFile) }));
      let audioFile = null;
      if (data.audio && data.audio.file && files.has(data.audio.file)){
        const nm = data.audio.name || "audio.mp3";
        const ext = (nm.split(".").pop() || "mp3").toLowerCase();
        audioFile = new File([files.get(data.audio.file)], nm, { type: "audio/" + (ext === "mp3" ? "mpeg" : ext) });
      }
      await importProjectData(data);
      if (audioFile){
        loadAudioFile(audioFile);
        /* 新字段优先；老工程只有 offset（秒），换算成起点拍 */
        if (data.audio.start !== undefined){
          S.audioStart = +data.audio.start || 0;
          S.audioIn = +data.audio.in || 0;
          S.audioOut = +data.audio.out || 0;
        } else {
          S.audioStart = (+data.audio.offset || 0) * S.bpm / 60;
          S.audioIn = 0; S.audioOut = 0;
        }
        S.audioOffset = audioOffsetSec();
        setTimeout(() => { drawTimeline(); renderInspector(); }, 300);
      }
    } else {
      await importProjectData(JSON.parse(new TextDecoder().decode(buf)));
    }
  } catch(err){
    console.error(err);
    toast("导入失败：" + (err && err.message ? err.message : err));
  }
}

async function importProjectData(data){
  try{
    if (!data || !Array.isArray(data.parts)) throw new Error("不是有效的工程文件");

    const parts = [];
    let maxUid = 0;
    for (const raw of data.parts){
      const isText = raw.kind === "text" && raw.text;
      const vs = [];
      if (isText){
        vs.push({ variant: "text", img: blankImg(),
                  bbox: { x: 0, y: 0, w: 10, h: 10 }, ax: 5, ay: 5, thumb: null });
      } else {
        for (const v of (raw.variants || [])){
          if (!v.src) continue;
          const img = await loadSrc(v.src);
          const bbox = v.bbox || alphaBBox(img);
          vs.push({
            variant: v.variant || "", img, bbox,
            ax: v.ax !== undefined ? v.ax : bbox.x + bbox.w/2,
            ay: v.ay !== undefined ? v.ay : bbox.y + bbox.h/2,
            thumb: makeThumb(img, bbox)
          });
        }
      }
      if (!vs.length) continue;
      const id = raw.id || nid();
      const m = /^p(\d+)$/.exec(id);
      if (m) maxUid = Math.max(maxUid, +m[1]);
      const p = {
        id, slot: raw.slot || "layer", kind: raw.kind || classify(raw.slot || "layer"),
        variants: vs, texIndex: clamp(Math.round(raw.texIndex || 0), 0, vs.length - 1),
        text: isText ? Object.assign({}, TEXT_DEFAULT, raw.text) : null,
        x: +raw.x || 0, y: +raw.y || 0, rot: +raw.rot || 0,
        sx: raw.sx === undefined ? 1 : +raw.sx, sy: raw.sy === undefined ? 1 : +raw.sy,
        alpha: raw.alpha === undefined ? 1 : +raw.alpha,
        hue: raw.hue === undefined ? 0 : +raw.hue,
        flipX: !!raw.flipX, flipY: !!raw.flipY,
        clip: raw.clip && raw.clip.srcId ? { srcId: raw.clip.srcId, invert: !!raw.clip.invert } : null,
        ax: raw.ax, ay: raw.ay,
        pu: raw.pu === undefined ? 0.5 : +raw.pu, pv: raw.pv === undefined ? 0.5 : +raw.pv,
        parentId: raw.parentId || null,
        mesh: raw.mesh ? { ...raw.mesh } : null,
        spring: raw.spring ? { ...raw.spring } : null,
        base: raw.base ? { ...raw.base } : null,
        bend: raw.bend ? raw.bend.slice() : null,
        visible: raw.visible !== false, locked: !!raw.locked, bbox: vs[0].bbox,
        defTex: clamp(Math.round(+raw.defTex || 0), 0, vs.length - 1),
        folderId: raw.folderId || null,
        shape: raw.shape ? Object.assign({}, raw.shape) : null,
        notes: Array.isArray(raw.notes) ? raw.notes.map(n => ({
          id: "n" + (++uid),
          row: clamp(Math.round(+n.row || 0), 0, vs.length - 1),
          t: Math.max(0, +n.t || 0),
          dur: Math.max(0.02, +n.dur || 0.25)
        })) : []
      };
      initTracks(p);
      if (raw.tracks) importTracks(p, raw.tracks);
      if (Array.isArray(raw.bendKeys)) p.bendKeys = raw.bendKeys.map(e => ({ t: +e.t || 0, bend: (e.bend || []).slice() }));
      if (raw.subMode) p.subMode = true;
      else if (Array.isArray(raw.keys)) importSnapshots(p, raw.keys.map(k => ({ ...k })));
      if (isText) refreshTextLayer(p);
      else applyPivot(p);
      parts.push(p);
    }
    if (!parts.length) throw new Error("工程里没有可用的图层贴图");

    const oldW = S.doc.w, oldH = S.doc.h;
    S.parts = parts;
    S.doc = (data.doc && data.doc.w > 0 && data.doc.h > 0) ? { w: +data.doc.w, h: +data.doc.h } : { w: oldW, h: oldH };
    S.bg = Object.assign({ type: "color", color: "#131211", c1: "#1e2a33", c2: "#33222a", angle: 135, img: null },
                         data.bg || {});
    S.bg.img = null;
    if (data.bg && data.bg.imgSrc){
      try { S.bg.img = await loadSrc(data.bg.imgSrc); } catch(err){}
    }
    if (S.bg.type === "image" && !S.bg.img) S.bg.type = "color";
    S.bpm = +data.bpm || 120;
    S.sig = +data.sig || 4;
    S.sigText = data.sigText || (Number.isInteger(S.sig) ? S.sig + "/4" : "4/4");
    S.cues = Array.isArray(data.cues) ? data.cues.map(Number) : [];
    S.folders = Array.isArray(data.folders)
      ? data.folders.filter(f => f && f.id).map(f => ({ id: f.id, name: f.name || "资料夹", collapsed: !!f.collapsed }))
      : [];
    S.midi = (data.midi && Array.isArray(data.midi.notes) && data.midi.notes.length)
      ? { name: data.midi.name || "MIDI", ppq: +data.midi.ppq || 480, tempoBpm: +data.midi.tempoBpm || 0,
          durBeat: +data.midi.durBeat || 0, notes: data.midi.notes.map(n => ({ t: +n.t, d: +n.d, pitch: +n.pitch, vel: +n.vel || 90, ch: +n.ch || 0 })),
          pitches: Array.isArray(data.midi.pitches) ? data.midi.pitches.map(Number) : [],
          chans: Array.isArray(data.midi.chans) ? data.midi.chans.map(Number) : [] }
      : null;
    if (S.midi && (!S.midi.pitches.length || !S.midi.chans.length)){
      S.midi.pitches = [...new Set(S.midi.notes.map(n => n.pitch))].sort((a, b) => b - a);
      S.midi.chans = [...new Set(S.midi.notes.map(n => n.ch))].sort((a, b) => a - b);
    }
    S.prMode = "manual";   // v2：只有一个钢琴窗，不再区分 MIDI/手写
    /* 旧工程（version ≤ 3）的音符是全局一份，迁到当时的口型图层上 */
    const legacyLipId = (data.lip && data.lip.partId) || null;
    if (Array.isArray(data.notes) && data.notes.length && legacyLipId){
      const host = parts.find(p => p.id === legacyLipId);
      if (host && !host.notes.length){
        host.notes = data.notes.map(n => ({
          id: "n" + (++uid),
          row: clamp(Math.round(+n.row || 0), 0, Math.max(0, host.variants.length - 1)),
          t: Math.max(0, +n.t || 0),
          dur: Math.max(0.02, +n.dur || 0.25)
        }));
      }
    }
    S.clips = (data.clips || []).map(c => ({
      id: "c" + (++uid), partId: c.partId, actionId: c.actionId,
      start: +c.start || 0, dur: +c.dur || 1,
      flipX: !!c.flipX, flipY: !!c.flipY,
      base: Object.assign({ x: 0, y: 0, rot: 0, sx: 1, sy: 1, alpha: 1, tex: 0 }, c.base || {})
    }));
    /* 有 customActions 字段就以工程为准；老工程没有这个字段时保留当前库，
       这样旧工程里引用到的自定义片段不会突然失效 */
    if (Array.isArray(data.customActions)) setCustomActions(data.customActions);
    uid = Math.max(uid, maxUid);

    S.selected = null; S.selectedClip = null; S.selKey = null;
    S.selKeys = []; S.selClips = [];
    S.beat = 0; S.playing = false;
    stop();
    S.audio = null; S.audioDur = 0; S.audioName = ""; S.audioOffset = 0;
    S.audioStart = 0; S.audioIn = 0; S.audioOut = 0;
    S.audioPeaks = null; waveKey = "";
    undoStack.length = 0; redoStack.length = 0;

    applyAt(0); fitView(); renderAll(); syncUndoBtns();
    /* 文字图层要等字体到位才量得准包围盒 */
    const tf = [...new Set(S.parts.filter(q => q.kind === "text" && q.text).map(q => q.text.font))];
    if (tf.length) Promise.all(tf.map(ensureFont)).then(() => {
      for (const q of S.parts) if (q.kind === "text") refreshTextLayer(q);
      applyAt(S.beat); draw(); drawTimeline(); renderLayers();
    });
    const dropEl = document.getElementById("drop");
    if (dropEl) dropEl.style.display = "none";
    /* 换了工程，上一份自动保存快照就作废了 */
    markClean();
    try { await AutoStore.clear(); } catch(e){}
    toast("已导入工程：" + S.parts.length + " 个图层、" + S.clips.length + " 个片段");
  } catch(err){
    console.error(err);
    toast("导入失败：" + (err && err.message ? err.message : err));
  }
}

/* ============================ MIDI / 钢琴窗 / 口型 ============================ */
const pr = document.getElementById("pr");
const pctx = pr.getContext("2d");
let prDrag = false;

const NOTE_NAMES = ["C","C#","D","D#","E","F","F#","G","G#","A","A#","B"];
const noteName = n => NOTE_NAMES[((n % 12) + 12) % 12] + (Math.floor(n / 12) - 1);
const isBlackKey = n => [1,3,6,8,10].indexOf(((n % 12) + 12) % 12) >= 0;
let LIP_COLORS = TH.lip;

/* ---------- SMF 解析（只用 ticks/PPQ → 拍，不重建 tempo map） ---------- */
function parseMidi(buf){
  const dv = new DataView(buf);
  let p = 0;
  const tag = n => { let s = ""; for (let i = 0; i < n; i++) s += String.fromCharCode(dv.getUint8(p + i)); p += n; return s; };
  if (dv.byteLength < 14 || tag(4) !== "MThd") throw new Error("不是标准 MIDI 文件");
  const hl = dv.getUint32(p); p += 4;
  const ntr = dv.getUint16(p + 2);
  const div = dv.getInt16(p + 4);
  p += hl;                              // 跳过整个 header body，落到第一个 track 块
  const ppq = div > 0 ? div : 96;

  const vlq = () => {
    let v = 0, c;
    do { c = dv.getUint8(p++); v = (v << 7) | (c & 0x7f); } while (c & 0x80);
    return v;
  };

  const notes = [];
  let maxTick = 0, tempoBpm = 0;

  for (let ti = 0; ti < ntr && p + 8 <= dv.byteLength; ti++){
    const id = tag(4);
    const len = dv.getUint32(p); p += 4;
    const end = Math.min(dv.byteLength, p + len);
    if (id !== "MTrk"){ p = end; continue; }

    let tick = 0, run = 0;
    const open = new Map();
    while (p < end){
      tick += vlq();
      if (tick > maxTick) maxTick = tick;
      let st = dv.getUint8(p);
      if (st & 0x80){ p++; if (st < 0xF0) run = st; }
      else { st = run; if (!st){ p++; continue; } }

      if (st === 0xFF){
        const type = dv.getUint8(p++);
        const l = vlq();
        if (type === 0x51 && l === 3 && !tempoBpm){
          const us = (dv.getUint8(p) << 16) | (dv.getUint8(p + 1) << 8) | dv.getUint8(p + 2);
          if (us > 0) tempoBpm = Math.round(60000000 / us);
        }
        p += l;
        if (type === 0x2F) break;
        continue;
      }
      if (st === 0xF0 || st === 0xF7){ const l = vlq(); p += l; continue; }

      const hi = st & 0xF0, ch = st & 0x0F;
      if (hi === 0x90){
        const pitch = dv.getUint8(p), vel = dv.getUint8(p + 1); p += 2;
        const key = ch * 128 + pitch;
        if (vel > 0) open.set(key, { t: tick, vel });
        else {
          const o = open.get(key);
          if (o){ open.delete(key); notes.push({ t:o.t, d:Math.max(1, tick-o.t), pitch, vel:o.vel, ch }); }
        }
      } else if (hi === 0x80){
        const pitch = dv.getUint8(p); p += 2;
        const key = ch * 128 + pitch;
        const o = open.get(key);
        if (o){ open.delete(key); notes.push({ t:o.t, d:Math.max(1, tick-o.t), pitch, vel:o.vel, ch }); }
      } else if (hi === 0xC0 || hi === 0xD0){ p += 1; }
      else { p += 2; }
    }
    for (const [key, o] of open){
      notes.push({ t:o.t, d:Math.max(1, maxTick - o.t), pitch: key % 128, vel:o.vel, ch: Math.floor(key / 128) });
    }
    p = end;
  }

  if (!notes.length) throw new Error("文件里没有音符");
  notes.sort((a, b) => a.t - b.t || a.pitch - b.pitch);
  const durTick = notes.reduce((m, n) => Math.max(m, n.t + n.d), 0);
  return {
    ppq, tempoBpm,
    notes: notes.map(n => ({ t: n.t / ppq, d: n.d / ppq, pitch: n.pitch, vel: n.vel, ch: n.ch })),
    durBeat: durTick / ppq,
    pitches: [...new Set(notes.map(n => n.pitch))].sort((a, b) => b - a),
    chans: [...new Set(notes.map(n => n.ch))].sort((a, b) => a - b)
  };
}

/* ---------- 钢琴窗的目标图层 ---------- */
/* 「手写」模式编辑当前选中图层的音符，每个图层各有一套 */
function notesPart(){
  const p = S.selected;
  return (p && Array.isArray(p.variants) && p.variants.length) ? p : null;
}
function partNotes(p){ return (p && Array.isArray(p.notes)) ? p.notes : []; }
function setSelNotes(list){
  S.selNotes = (list || []).slice();
  S.selNote = S.selNotes.length ? S.selNotes[0] : null;
}
function isNoteSel(n){ return S.selNotes.indexOf(n) >= 0; }
function notesPartName(){
  const p = notesPart();
  if (!p) return "";
  return p.slot + " · " + p.variants.length + " 张贴图";
}
function midiNotes(){ return S.midi ? S.midi.notes : []; }
function variantLabel(p, i){
  const v = p && p.variants[i];
  return v ? (v.variant || "贴图 " + (i + 1)) : "—";
}

/* 把一串时间点按顺序循环分配到当前图层的贴图上 */
function assignTexByTimes(p, times, label){
  if (!p) return toast("先在左侧选中一个图层");
  if (p.variants.length < 2) return toast("「" + p.slot + "」只有 1 张贴图，先多拖几张进来");
  if (S.clips.some(c => c.partId === p.id)) return toast("该图层有动作片段，先右键「分解为关键帧」再映射");
  const ts = [...new Set(times.map(t => Math.round(t * 1000) / 1000))].sort((a, b) => a - b);
  if (!ts.length) return toast(label === "cue" ? "还没有卡点——先在时间轴上打几个卡点" : "先导入 MIDI");

  pushUndo();
  const V = p.variants.length;
  const raw = p.defTex | 0;
  const def = raw < 0 ? -1 : clamp(raw, 0, V - 1);
  /* 默认贴图不参与循环，保证每个卡点都有视觉变化；选了「无」就整轮循环 */
  const seq = [];
  if (def < 0) for (let k = 0; k < V; k++) seq.push(k);
  else for (let k = 1; k < V; k++) seq.push(k);
  if (!seq.length) seq.push(0);
  const gaps = ts.slice(1).map((t, i) => t - ts[i]).filter(g => g > 0);
  const avg = gaps.length ? gaps.reduce((a, b) => a + b, 0) / gaps.length : 1;
  const span = clamp(avg * 0.8, 0.12, 8);
  const evs = ts.map((t, i) => ({ t, dur: span, tex: seq[i % seq.length], endTex: def }));
  const n = bakeTexEvents(p, evs, { clearTex: true });
  applyAt(S.beat);
  renderAll();
  toast("「" + p.slot + "」按" + (label === "cue" ? "卡点" : "音符") + "铺了 " + ts.length + " 个切换（" + V + " 张贴图循环）");
  return n;
}

/* MIDI 音符 → 钢琴窗音符：只取时值，贴图按顺序循环切换（不看音高） */
function midiToNotes(p, mnotes){
  const V = p.variants.length;
  if (V <= 1) return [];
  /* 默认贴图（一般是闭嘴）留作空档，音符在其余贴图之间循环 */
  const seq = [];
  for (let k = 1; k < V; k++) seq.push(k);
  if (!seq.length) seq.push(0);
  return mnotes.slice()
    .sort((a, b) => a.t - b.t)
    .map((x, i) => ({
      id: "n" + (++uid),
      row: seq[i % seq.length],
      t: Math.max(0, x.t),
      dur: Math.max(0.05, x.d || 0.25)
    }));
}

/* 按卡点铺音符：铺完直接出现在钢琴窗里，可以再手改 */
function mapByCues(){
  const p = notesPart();
  if (!p) return toast("先在左侧选中一个图层");
  if (p.kind === "text") return toast("文字图层没有贴图可切");
  if (p.variants.length < 2) return toast("「" + p.slot + "」只有 1 张贴图，先多拖几张进来");
  if (!S.cues.length) return toast("还没有卡点——先在时间轴上打几个卡点");
  const V = p.variants.length;
  const raw = p.defTex | 0;
  const def = raw < 0 ? -1 : clamp(raw, 0, V - 1);
  const seq = [];
  if (def < 0) for (let k = 0; k < V; k++) seq.push(k);
  else for (let k = 1; k < V; k++) seq.push(k);
  if (!seq.length) seq.push(0);
  const gaps = S.cues.slice(1).map((t, i) => t - S.cues[i]).filter(g => g > 0);
  const avg = gaps.length ? gaps.reduce((a, b) => a + b, 0) / gaps.length : 1;
  const span = clamp(avg * 0.8, 0.12, 8);

  pushUndo("按卡点铺音符");
  p.notes = S.cues.map((t, i) => ({
    id: "n" + (++uid), row: seq[i % seq.length], t, dur: span
  }));
  bakeNotes();
  setPrOpen(true);
  renderAll(); syncMidiUI(true);
  toast("按卡点铺了 " + S.cues.length + " 个音符，可直接在钢琴窗改");
}

function mapByNotes(){
  const p = notesPart();
  if (!p) return toast("先在左侧选中一个图层");
  if (p.kind === "text") return toast("文字图层没有贴图可切");
  if (p.variants.length < 2) return toast("「" + p.slot + "」只有 1 张贴图，先多拖几张进来");
  if (!S.midi) return toast("先导入 MIDI");
  pushUndo("按 MIDI 铺音符");
  p.notes = midiToNotes(p, S.midi.notes);
  bakeNotes();
  setPrOpen(true);
  renderAll(); syncMidiUI(true);
  toast("按 MIDI 铺了 " + p.notes.length + " 个音符");
}

/* 把 [{t,dur,tex,endTex}] 烘成贴图关键帧（口型/手写音符共用） */
function bakeTexEvents(p, events, opts){
  if (!p) return 0;
  // 手写音符要独占这个图层的贴图：如果整条轨道只有 tex 在变（典型的表情图层），
  // 直接整条清掉，否则旧的表情关键帧会在音符之间把贴图抢回去
  /* v2：贴图是独立轨道，重烘时只清 tex，位移/旋转/缩放的动画原样保留 */
  ensureTracks(p);
  if (opts && opts.clearTex){
    p.tracks.tex = [];
    p._agg = null;
  }
  const evs = [];
  for (const e of events){
    evs.push({ t: e.t, tex: e.tex, k: 1 });
    /* endTex < 0 表示「无」：不生成回切帧，这张图一直保持到下一次切换 */
    if (e.endTex >= 0) evs.push({ t: e.t + Math.max(0.02, e.dur), tex: e.endTex, k: 0 });
  }
  evs.sort((a, b) => a.t - b.t || a.k - b.k);
  const merged = [];
  for (const e of evs){
    const t = Math.round(e.t * 1000) / 1000;
    const last = merged[merged.length - 1];
    if (last && Math.abs(last.t - t) < 1e-3) last.tex = e.tex;
    else merged.push({ t, tex: e.tex });
  }
  /* 只往 tex 轨道写点，完全不碰其他属性 */
  for (const e of merged) setTrackKey(p, "tex", e.t, e.tex, { p: null });
  return merged.length;
}

/* 手写音符 → 贴图关键帧：音符多长，那张图就停多久（每个图层各一套） */
function bakeNotes(){
  const p = notesPart();
  if (!p) return 0;
  const V = p.variants.length;
  const raw = p.defTex | 0;
  const def = raw < 0 ? -1 : clamp(raw, 0, V - 1);
  return bakeTexEvents(p, partNotes(p).map(n => ({
    t: n.t, dur: n.dur, tex: clamp(n.row, 0, V - 1), endTex: def
  })), { clearTex: true });
}

function clearLipKeys(){
  const p = notesPart();
  const targets = p ? [p] : S.parts;
  let n = 0;
  for (const q of targets) n += q.keys.filter(k => k.lip).length;
  if (!n) return toast(p ? "「" + p.slot + "」没有贴图关键帧" : "没有贴图关键帧");
  pushUndo();
  for (const q of targets){ q.tracks.tex = []; q._agg = null; }
  applyAt(S.beat); renderAll();
  toast("已删除 " + n + " 个贴图关键帧" + (p ? "（" + p.slot + "）" : ""));
}

/* ---------- 钢琴窗绘制 ---------- */
function prRows(){
  if (S.prMode === "manual"){
    const p = notesPart();
    if (!p || p.kind === "text") return [];
    return p.variants.map((v, i) => ({ key: i, label: v.variant || ("贴图" + (i + 1)) }));
  }
  const list = S.midi ? [...new Set(midiNotes().map(n => n.pitch))].sort((a, b) => b - a) : [];
  return list.map(pitch => ({ key: pitch, label: noteName(pitch) }));
}

function prLayout(){
  const W = pr.clientWidth || 800, H = pr.clientHeight || 136;
  const rows = prRows();
  const avail = Math.max(10, H - 1);
  const rh = clamp(avail / Math.max(1, Math.min(rows.length, 30)), 9, 16);
  const contentH = rows.length * rh;
  const maxScroll = Math.max(0, contentH - avail);
  S.prScroll = clamp(S.prScroll || 0, 0, maxScroll);
  return { W, H, rows, rh, avail, contentH, maxScroll };
}

const prBeatOf = x => beatOf(x);
const secOfBeat = b => b * 60 / S.bpm;
const beatOfSec = s => s * S.bpm / 60;

function drawPianoRoll(){
  const wrap = document.getElementById("prwrap");
  if (!wrap) return;
  const app = document.getElementById("app");
  if (!S.prOpen){ wrap.classList.remove("open"); if (app) app.classList.remove("propen"); return; }
  wrap.classList.add("open");
  if (app) app.classList.add("propen");

  const dpr = window.devicePixelRatio || 1;
  const { W, H, rows, rh } = prLayout();
  if (pr.width !== Math.round(W*dpr) || pr.height !== Math.round(H*dpr)){
    pr.width = Math.round(W*dpr); pr.height = Math.round(H*dpr);
  }
  pctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  pctx.clearRect(0, 0, W, H);
  pctx.fillStyle = TH.prBg; pctx.fillRect(0, 0, W, H);
  pctx.fillStyle = TH.prLabel; pctx.fillRect(0, 0, labelW, H);
  pctx.textAlign = "left";

  const manual = S.prMode === "manual";
  const np = manual ? notesPart() : null;
  /* 切了图层就把选中态清掉，别让高亮挂在上一个图层的音符上 */
  if (manual && S.selNotes.length && S.selNotes.some(n => partNotes(np).indexOf(n) < 0)) setSelNotes([]);

  if (!rows.length){
    pctx.fillStyle = TH.prEmpty;
    pctx.font = "11px ui-monospace,Consolas,monospace";
    pctx.fillText(manual ? (np ? "这个图层没有贴图" : "先在左侧选中一个图层，再在这里画音符")
                         : "在格子里按住拖 = 画一个音符；导入 MIDI 或点「按卡点映射」会自动铺满音符", labelW + 14, H/2 + 4);
    pctx.strokeStyle = TH.prSep;
    pctx.beginPath(); pctx.moveTo(labelW - .5, 0); pctx.lineTo(labelW - .5, H); pctx.stroke();
    return;
  }

  const dense = rh < 11;

  for (let i = 0; i < rows.length; i++){
    const y = 1 + i*rh - S.prScroll;
    if (y + rh < 0 || y > H) continue;
    const row = rows[i];
    if (!manual && isBlackKey(row.key)){
      pctx.fillStyle = TH.prBlack; pctx.fillRect(labelW, y, W - labelW, rh);
    }
    pctx.strokeStyle = TH.prRowLine;
    pctx.beginPath(); pctx.moveTo(0, y + rh); pctx.lineTo(W, y + rh); pctx.stroke();
    if (rh >= 8){
      const ty = y + rh - (dense ? 1.5 : 2.5);
      pctx.font = (dense ? "8px" : "9px") + " ui-monospace,Consolas,monospace";
      let txt = row.label;
      if (!manual && (((row.key % 12) + 12) % 12 === 0)) pctx.fillStyle = TH.prText;
      else pctx.fillStyle = TH.prText2;
      if (!dense || i % 4 === 0 || manual){
        if (txt.length > 8) txt = txt.slice(0, 8);
        pctx.fillText(txt, 5, ty);
      }
      if (manual){
        pctx.fillStyle = LIP_COLORS[i % LIP_COLORS.length];
        pctx.beginPath(); pctx.arc(labelW - 10, y + rh/2, 2.5, 0, Math.PI*2); pctx.fill();
        if (np && (np.defTex | 0) === row.key){
          /* 默认贴图：音符之间的空档回到这一张 */
          pctx.strokeStyle = LIP_COLORS[i % LIP_COLORS.length];
          pctx.lineWidth = 1.2;
          pctx.beginPath();
          pctx.moveTo(labelW - 17, y + rh/2 - 3);
          pctx.lineTo(labelW - 14, y + rh/2);
          pctx.lineTo(labelW - 17, y + rh/2 + 3);
          pctx.stroke();
        }
      }
    }
  }

  pctx.save();
  pctx.beginPath(); pctx.rect(labelW, 0, W - labelW, H); pctx.clip();

  const b0 = Math.max(0, Math.floor(S.scrollBeat * 4) / 4 - 0.25);
  const b1 = S.scrollBeat + S.visibleBeats + 1;
  for (let b = b0; b <= b1; b += 0.25){
    const isBar = Math.abs(b % S.sig) < 1e-6;
    const isBeat = Math.abs(b % 1) < 1e-6;
    if (!isBeat && pxPerBeat < 26) continue;
    pctx.strokeStyle = isBar ? TH.prGridBar : (isBeat ? TH.prGridBeat : TH.prGridSub);
    pctx.beginPath(); pctx.moveTo(xOf(b), 0); pctx.lineTo(xOf(b), H); pctx.stroke();
  }

  const rowIdx = new Map();
  rows.forEach((r, i) => rowIdx.set(r.key, i));

  const drawNote = (i, x1, x2, color, selected, label) => {
    const y = 1 + i*rh - S.prScroll;
    if (y + rh < 0 || y > H) return;
    if (x2 < labelW || x1 > W) return;
    const bx = Math.max(labelW, x1);
    const bw = Math.min(Math.max(2.5, x2 - x1), W - bx);
    if (bw <= 0) return;
    const bh = Math.max(3, rh - 2);
    pctx.fillStyle = color;
    roundRect(pctx, bx, y + (rh - bh)/2, bw, bh, 1.5);
    pctx.fill();
    if (selected){
      pctx.strokeStyle = "#fff"; pctx.lineWidth = 1.4;
      roundRect(pctx, bx, y + (rh - bh)/2, bw, bh, 1.5);
      pctx.stroke();
    }
    if (label && bw > 34 && rh >= 11){
      pctx.fillStyle = "rgba(0,0,0,.72)";
      pctx.font = "9px ui-monospace,Consolas,monospace";
      pctx.fillText(label, bx + 4, y + rh/2 + 3);
    }
  };

  if (manual){
    for (const n of partNotes(np)){
      const i = rowIdx.get(n.row);
      if (i === undefined) continue;
      drawNote(i, xOf(n.t), xOf(n.t + n.dur), LIP_COLORS[n.row % LIP_COLORS.length],
               isNoteSel(n), secOfBeat(n.dur).toFixed(2) + "s");
    }
  } else {
    for (const n of midiNotes()){
      const i = rowIdx.get(n.pitch);
      if (i === undefined) continue;
      drawNote(i, xOf(n.t), xOf(n.t + n.d), LIP_COLORS[i % LIP_COLORS.length], false, "");
    }
  }

  /* 框选矩形 */
  if (prDrag && prDrag.type === "marquee"){
    const mx0 = Math.min(prDrag.x0, prDrag.x1), mx1 = Math.max(prDrag.x0, prDrag.x1);
    const my0 = Math.min(prDrag.y0, prDrag.y1), my1 = Math.max(prDrag.y0, prDrag.y1);
    pctx.fillStyle = TH.marqueeFill || "rgba(120,170,255,.14)";
    pctx.fillRect(mx0, my0, mx1 - mx0, my1 - my0);
    pctx.strokeStyle = TH.marqueeLine || TH.accent;
    pctx.lineWidth = 1;
    pctx.strokeRect(mx0 + .5, my0 + .5, Math.max(0, mx1 - mx0 - 1), Math.max(0, my1 - my0 - 1));
  }

  const px = xOf(S.beat);
  if (px >= labelW && px <= W){
    pctx.strokeStyle = TH.prPlayhead;
    pctx.lineWidth = 1;
    pctx.beginPath(); pctx.moveTo(px, 0); pctx.lineTo(px, H); pctx.stroke();
  }
  pctx.restore();

  pctx.strokeStyle = TH.prSep;
  pctx.beginPath(); pctx.moveTo(labelW - .5, 0); pctx.lineTo(labelW - .5, H); pctx.stroke();
}

/* ---------- 钢琴窗交互 ---------- */
function prRowAt(y){
  const { rows, rh } = prLayout();
  const i = Math.floor((y + S.prScroll - 1) / rh);
  return (i >= 0 && i < rows.length) ? { i, row: rows[i] } : null;
}
/* 拖音符时用：超出上下边界就夹到首/末行，不会因为手滑出界就卡住不动 */
function prRowIndexAt(y){
  const { rows, rh } = prLayout();
  if (!rows.length) return -1;
  return clamp(Math.floor((y + S.prScroll - 1) / rh), 0, rows.length - 1);
}
function prNoteAt(x, y){
  if (S.prMode !== "manual") return null;
  const hit = prRowAt(y);
  if (!hit) return null;
  const b = prBeatOf(x);
  for (const n of partNotes(notesPart())){
    if (n.row !== hit.row.key) continue;
    if (b >= n.t - 0.03 && b <= n.t + n.dur + 0.03) return n;
  }
  return null;
}
const snapB = b => S.snap ? Math.round(b * 4) / 4 : b;

pr.addEventListener("pointerdown", e => {
  const r = pr.getBoundingClientRect();
  const x = e.clientX - r.left, y = e.clientY - r.top;
  const manual = S.prMode === "manual";
  if (!manual && !S.midi) return;

  if (x < labelW){
    if (!manual) return;
    const hit = prRowAt(y);
    if (!hit) return;
    /* 手写模式：点左侧贴图名 = 把它设为「音符之间的空档」用哪一张 */
    const p = notesPart();
    if (!p) return;
    if ((p.defTex | 0) === hit.row.key) return;
    pushUndo();
    p.defTex = hit.row.key;
    bakeNotes(); drawPianoRoll(); draw();
    toast("「" + p.slot + "」音符之间的空档 → 「" + variantLabel(p, hit.row.key) + "」");
    return;
  }
  if (e.button !== 0) return;

  if (manual){
    const p = notesPart();
    if (!p){ toast("先在左侧选中一个图层"); return; }
    const b = prBeatOf(x);

    /* Shift + 拖拽 = 框选音符（按住 Ctrl 追加到已有选择） */
    if (e.shiftKey){
      prDrag = { type: "marquee", x0: x, y0: y, x1: x, y1: y, add: e.ctrlKey || e.metaKey };
      try { pr.setPointerCapture(e.pointerId); } catch(err){}
      drawPianoRoll();
      return;
    }

    const hit = prRowAt(y);
    if (!hit) return;
    const existing = prNoteAt(x, y);
    pushUndo();
    if (existing){
      const x2 = xOf(existing.t + existing.dur);
      const mode = Math.abs(x - x2) <= 7 ? "resize" : "move";
      /* 点在已选中的音符上：保持整组，拖动时一起走 */
      if (!isNoteSel(existing)) setSelNotes([existing]);
      const group = (mode === "move")
        ? S.selNotes.map(q => ({ q, t0: q.t, r0: q.row }))
        : null;
      prDrag = { type: "note-" + mode, note: existing, b0: b, t0: existing.t, dur0: existing.dur,
                 row0: hit.i, group };
    } else {
      const n = { id: "n" + (++uid), row: hit.row.key, t: snapB(b), dur: beatOfSec(0.4) };
      if (!Array.isArray(p.notes)) p.notes = [];
      p.notes.push(n);
      setSelNotes([n]);
      prDrag = { type: "note-resize", note: n, b0: b, t0: n.t, dur0: n.dur };
    }
    try { pr.setPointerCapture(e.pointerId); } catch(err){}
    bakeNotes(); drawPianoRoll(); draw(); syncMidiUI();
    return;
  }

  prDrag = { type: "scrub" };
  try { pr.setPointerCapture(e.pointerId); } catch(err){}
  scrubTo(x);
});
pr.addEventListener("pointermove", e => {
  if (!prDrag) return;
  const r = pr.getBoundingClientRect();
  const x = e.clientX - r.left, y = e.clientY - r.top;

  if (prDrag.type === "marquee"){
    prDrag.x1 = x; prDrag.y1 = y;
    drawPianoRoll();
    return;
  }
  if (prDrag.type && prDrag.type.indexOf("note-") === 0){
    const n = prDrag.note;
    const b = snapB(prBeatOf(x));
    if (prDrag.type === "note-move"){
      const dt = b - prDrag.b0;
      const np = notesPart();
      const V = np ? np.variants.length : 1;
      const ri = prRowIndexAt(y);          /* 超出上下边界时夹到首/末行 */
      const { rows } = prLayout();
      const dRow = (ri >= 0 && prDrag.row0 !== undefined) ? ri - prDrag.row0 : 0;
      if (prDrag.group && prDrag.group.length > 1){
        /* 整组一起换行，先算出不撞上下边界的位移量 */
        const r0s = prDrag.group.map(g => g.r0);
        const lo = Math.min.apply(null, r0s), hi = Math.max.apply(null, r0s);
        const d = clamp(dRow, -lo, Math.max(-lo, (V - 1) - hi));
        for (const g of prDrag.group){
          g.q.t = Math.max(0, g.t0 + dt);
          g.q.row = clamp(g.r0 + d, 0, V - 1);
        }
      } else {
        n.t = Math.max(0, prDrag.t0 + dt);
        if (ri >= 0 && rows[ri]) n.row = clamp(rows[ri].key, 0, V - 1);
      }
    } else {
      n.dur = Math.max(beatOfSec(0.05), b - n.t);
    }
    bakeNotes(); drawPianoRoll(); draw();
    return;
  }
  scrubTo(x);
});
pr.addEventListener("contextmenu", e => {
  if (S.prMode !== "manual") return;
  const r = pr.getBoundingClientRect();
  const n = prNoteAt(e.clientX - r.left, e.clientY - r.top);
  if (!n) return;
  e.preventDefault();
  const p = notesPart();
  if (!p) return;
  pushUndo();
  /* 右键点在多选中的音符上 = 删掉整组 */
  const kill = isNoteSel(n) && S.selNotes.length > 1 ? S.selNotes : [n];
  p.notes = partNotes(p).filter(q => kill.indexOf(q) < 0);
  setSelNotes(S.selNotes.filter(q => kill.indexOf(q) < 0));
  bakeNotes(); drawPianoRoll(); draw(); syncMidiUI();
  toast("已删除 " + kill.length + " 个音符");
});

/* 框选结束：按矩形范围收音符 */
function finishMarquee(){
  const p = notesPart();
  if (!p || !prDrag) return;
  const { rows, rh } = prLayout();
  const x0 = Math.min(prDrag.x0, prDrag.x1), x1 = Math.max(prDrag.x0, prDrag.x1);
  const y0 = Math.min(prDrag.y0, prDrag.y1), y1 = Math.max(prDrag.y0, prDrag.y1);
  const b0 = prBeatOf(x0), b1 = prBeatOf(x1);
  const r0 = Math.floor((y0 + S.prScroll - 1) / rh);
  const r1 = Math.floor((y1 + S.prScroll - 1) / rh);
  const hits = partNotes(p).filter(n => {
    const ri = rows.findIndex(r => r.key === n.row);
    if (ri < 0 || ri < r0 || ri > r1) return false;
    return n.t + n.dur >= b0 && n.t <= b1;
  });
  if (prDrag.add){
    const merged = S.selNotes.slice();
    for (const h of hits) if (merged.indexOf(h) < 0) merged.push(h);
    setSelNotes(merged);
  } else setSelNotes(hits);
  drawPianoRoll();
  if (S.selNotes.length) toast("已选中 " + S.selNotes.length + " 个音符");
}

window.addEventListener("pointerup", () => {
  if (prDrag && prDrag.type === "marquee") finishMarquee();
  prDrag = false;
});

function deleteSelectedNotes(){
  const p = notesPart();
  if (!p || !S.selNotes.length) return;
  pushUndo();
  const kill = S.selNotes.slice();
  p.notes = partNotes(p).filter(q => kill.indexOf(q) < 0);
  setSelNotes([]);
  bakeNotes(); drawPianoRoll(); draw(); syncMidiUI();
  toast("已删除 " + kill.length + " 个音符");
}
pr.addEventListener("wheel", e => {
  if (!S.midi && S.prMode !== "manual") return;
  e.preventDefault();
  if (e.ctrlKey || e.metaKey){
    const r = pr.getBoundingClientRect();
    zoomAt(S.zoom * (e.deltaY < 0 ? 1.15 : 1/1.15), e.clientX - r.left);
    return;
  }
  const { maxScroll } = prLayout();
  S.prScroll = clamp(S.prScroll + e.deltaY, 0, maxScroll);
  drawPianoRoll();
}, { passive: false });

/* ---------- MIDI 工具栏 ---------- */
let midiSig = "";
function syncMidiUI(force){
  const sig = [
    S.midi ? S.midi.name + ":" + S.midi.notes.length + ":" + S.midi.chans.join(",") : "-",
    S.parts.map(p => p.id + ":" + p.slot + ":" + p.variants.length + ":" + partNotes(p).length + ":" + (p.defTex | 0)).join("|"),
    S.cues.length, S.prOpen, S.prMode,
    S.selected ? S.selected.id : "-"
  ].join("~");
  if (!force && sig === midiSig) return;
  midiSig = sig;

  const nameEl = document.getElementById("midiName");
  if (S.prMode === "manual"){
    const np0 = notesPart();
    nameEl.textContent = np0
      ? ("贴图轨 · " + np0.slot + " · " + partNotes(np0).length + " 音符")
      : "贴图轨 · 未选中图层";
  } else {
    nameEl.textContent = S.midi
      ? (S.midi.name || "MIDI") + " · " + S.midi.notes.length + " 音符" + (S.midi.tempoBpm ? " · " + S.midi.tempoBpm + " BPM" : "")
      : "无 MIDI";
  }

  /* 静音贴图 / 映射按钮：全部作用于当前选中图层，两种模式都可用 */
  const np = notesPart();
  const defSel = document.getElementById("lipDef");
  const curDef = np ? (np.defTex | 0) : 0;
  defSel.innerHTML = (np && np.kind !== "text")
    ? '<option value="-1"' + (curDef < 0 ? " selected" : "") + '>无（保持当前）</option>' +
      np.variants.map((v, i) => '<option value="' + i + '"' + (i === curDef ? " selected" : "") + '>' +
        esc(v.variant || "贴图 " + (i + 1)) + "</option>").join("")
    : '<option value="0">—</option>';
  defSel.disabled = !np || np.kind === "text";
  defSel.title = (np && np.kind === "text")
    ? "文字图层没有贴图可切"
    : (np ? ("「" + np.slot + "」音符/卡点之间的空档用哪张贴图；选「无」就一直保持上一张") : "先选中一个图层");

  const setDis = (id, v) => { const el = document.getElementById(id); if (el) el.disabled = !!v; };
  setDis("btnMapCue", !np || !S.cues.length);
  setDis("btnMapNote", !np || !S.midi);
  setDis("btnLipClear", !np);

  const ptb = document.getElementById("btnPrToggle");
  if (ptb) ptb.classList.toggle("on", S.prOpen);
}

function setPrOpen(v){
  const was = !!S.prOpen;
  S.prOpen = !!v;
  const app = document.getElementById("app");
  const wrap = document.getElementById("prwrap");
  if (app) app.classList.toggle("propen", S.prOpen);
  if (wrap) wrap.classList.toggle("open", S.prOpen);   // 先定高度再量，否则时间轴会按旧高度排版
  drawTimeline(); syncMidiUI(true);
  /* 钢琴窗开关会改变画布可视区高度：
     开 → 记住原视图，按新区间适配一次（不然会被裁掉一截）；
     关 → 恢复开窗前的缩放和位置，不会越开越小。 */
  if (was !== S.prOpen){
    requestAnimationFrame(() => {
      if (S.prOpen){
        S.viewSaved = { scale: S.view.scale, ox: S.view.ox, oy: S.view.oy };
        fitView();
      } else if (S.viewSaved){
        S.view.scale = S.viewSaved.scale;
        S.view.ox = S.viewSaved.ox;
        S.view.oy = S.viewSaved.oy;
        S.viewSaved = null;
      }
      draw();
    });
  }
}

async function loadMidiFile(f){
  try {
    const m = parseMidi(await f.arrayBuffer());
    m.name = f.name.replace(/\.[^.]+$/, "");
    pushUndo("导入 MIDI");
    S.midi = m;
    S.prScroll = 0;
    /* 自动套用 MIDI 里的速度，音符和音乐才对得上 */
    const mb = Math.round(m.tempoBpm || 0);
    const bpmChanged = mb >= 20 && mb <= 400 && mb !== S.bpm;
    if (bpmChanged) S.bpm = mb;
    /* v2：导入即铺进当前图层的钢琴窗，直接可编辑 */
    const np = notesPart();
    let laid = 0;
    if (np && np.kind !== "text" && np.variants.length >= 2){
      np.notes = midiToNotes(np, m.notes);
      bakeNotes();
      laid = np.notes.length;
    }
    setPrOpen(true);
    renderAll(); syncMidiUI(true);
    /* BPM 输入框由随后的 renderAll() 同步 */
    toast("MIDI：" + m.notes.length + " 个音符" +
          (bpmChanged ? " · BPM 已设为 " + S.bpm : (m.tempoBpm ? " · 原速 " + m.tempoBpm + " BPM" : "")) +
          (laid ? "，已按顺序循环铺到「" + np.slot + "」" : "，选中一个多贴图图层后点「按 MIDI 映射」"));
  } catch(err){
    console.error(err);
    toast("MIDI 读取失败：" + (err && err.message ? err.message : err));
  }
}

document.getElementById("btnMidi").onclick = () => document.getElementById("midiPick").click();
document.getElementById("midiPick").onchange = e => {
  const f = e.target.files[0];
  e.target.value = "";
  if (f) loadMidiFile(f);
};
document.getElementById("btnPrToggle").onclick = () => setPrOpen(!S.prOpen);
document.getElementById("lipDef").onchange = e => {
  const p = notesPart();
  if (!p) return;
  pushUndo();
  const v = +e.target.value;
  p.defTex = v < 0 ? -1 : clamp(v, 0, p.variants.length - 1);
  if (partNotes(p).length) bakeNotes();
  applyAt(S.beat);
  drawPianoRoll(); draw(); syncMidiUI(true);
  toast("「" + p.slot + "」空档 → " + (p.defTex < 0 ? "保持当前贴图" : "「" + variantLabel(p, p.defTex) + "」"));
};
document.getElementById("btnMapCue").onclick = mapByCues;

/* ============================ 快捷键 ============================ */
/* ---------- 画布快捷键的辅助动作 ---------- */
function selectAllKeys(){
  const keys = [];
  for (const p of S.parts){
    if (p.subMode){
      ensureTracks(p);
      for (const prop of TRACK_PROPS) for (const e of p.tracks[prop])
        keys.push({ partId: p.id, prop, t: e.t });
    } else {
      for (const k of p.keys) keys.push({ partId: p.id, t: k.t });
    }
  }
  S.selKeys = keys;
  S.selClips = S.clips.slice();
  S.selKey = null;
  S.selectedClip = S.selClips.length === 1 ? S.selClips[0] : null;
  drawTimeline(); renderInspector();
  if (!keys.length && !S.selClips.length) toast("没有可选的关键帧或片段");
  else toast("已选中 " + keys.length + " 个关键帧、" + S.selClips.length + " 个片段");
}

/* 画布缩放：以可视区中心为锚点 */
function zoomCanvas(k){
  S.viewAutoFit = false;
  const W = view.clientWidth / 2, H = view.clientHeight / 2;
  const v = S.view;
  const wx = (W - v.ox) / v.scale, wy = (H - v.oy) / v.scale;
  v.scale = clamp(v.scale * k, 0.02, 20);
  v.ox = W - wx * v.scale;
  v.oy = H - wy * v.scale;
  draw();
}

function renameSelected(){
  const p = S.selected;
  if (!p) return;
  askName("重命名图层", p.slot, name => {
    const v = String(name || "").trim();
    if (!v || v === p.slot) return;
    pushUndo();
    p.slot = v;
    renderAll();
  });
}

/* dir = +1 往后（更靠上），-1 往前（更靠下） */
function moveLayerOrder(dir){
  const p = S.selected;
  if (!p) return;
  const i = S.parts.indexOf(p);
  const j = clamp(i + dir, 0, S.parts.length - 1);
  if (i === j) return;
  pushUndo();
  S.parts.splice(i, 1);
  S.parts.splice(j, 0, p);
  renderAll();
  toast("图层顺序 " + (i + 1) + " → " + (j + 1) + "（共 " + S.parts.length + " 层）");
}

function nudgeSelected(dy, step){
  const p = S.selected;
  if (!p) return;
  pushUndo();
  p.y += dy * step;
  touch(p, "y");
  applyAt(S.beat); draw(); renderInspector();
}

document.addEventListener("keydown", e => {
  const tag = (e.target.tagName || "").toLowerCase();
  if (tag === "input" || tag === "select" || tag === "textarea") return;

  if (S.crop){
    if (e.key === "Enter"){ e.preventDefault(); applyCrop(); return; }
    if (e.key === "Escape"){ e.preventDefault(); cancelCrop(); return; }
  }

  const mod = e.ctrlKey || e.metaKey;
  if (mod && e.key.toLowerCase() === "z"){ e.preventDefault(); e.shiftKey ? redo() : undo(); return; }
  if (mod && e.key.toLowerCase() === "y"){ e.preventDefault(); redo(); return; }
  if (mod && e.key.toLowerCase() === "c"){ e.preventDefault(); copySelection(); return; }
  if (mod && e.key.toLowerCase() === "x"){ e.preventDefault(); cutSelection(); return; }
  if (mod && e.key.toLowerCase() === "v"){ e.preventDefault(); pasteClipboard(); return; }
  if (mod && e.key.toLowerCase() === "d"){ e.preventDefault(); duplicateSelection(); return; }

  /* ---- 画布 / 图层快捷键 ---- */
  if (mod && e.key.toLowerCase() === "a"){ e.preventDefault(); selectAllKeys(); return; }
  if (mod && (e.key === "0" || e.key === ")")){ e.preventDefault(); fitView(); draw(); return; }
  if (mod && (e.key === "=" || e.key === "+")){ e.preventDefault(); zoomCanvas(1.15); return; }
  if (mod && e.key === "-"){ e.preventDefault(); zoomCanvas(1 / 1.15); return; }
  if (e.key === "F2" && S.selected){ e.preventDefault(); renameSelected(); return; }
  if (e.key === "Escape"){
    e.preventDefault();
    setSelNotes([]); clearSel(); S.selected = null;
    renderAll();
    return;
  }

  if (e.code === "Space"){ e.preventDefault(); togglePlay(); }
  else if (e.key === "t" || e.key === "T"){ document.getElementById("btnCue").click(); }
  else if (e.key === "h" || e.key === "H"){ e.shiftKey ? mirrorSelection("x") : (S.selected && flipPart(S.selected, "x")); }
  else if (e.key === "v" || e.key === "V"){ e.shiftKey ? mirrorSelection("y") : (S.selected && flipPart(S.selected, "y")); }
  else if (e.key === "Delete" || e.key === "Backspace"){
    if (S.selCues && S.selCues.length){
      e.preventDefault();
      pushUndo("删除卡点");
      const drop = new Set(S.selCues);
      S.cues = S.cues.filter((_, i) => !drop.has(i));
      S.selCues = [];
      drawTimeline(); renderAll();
      toast("已删除 " + drop.size + " 个卡点");
    } else if (S.prMode === "manual" && S.selNotes.length){
      e.preventDefault();
      deleteSelectedNotes();
    } else if (hasSel()){
      e.preventDefault();
      deleteSelection();
    }
  }
  else if (e.key === "ArrowUp" || e.key === "ArrowDown"){
    if (!S.selected) return;
    e.preventDefault();
    nudgeSelected(e.key === "ArrowUp" ? -1 : 1, e.shiftKey ? 10 : 1);
  }
  else if (e.key === "[" || e.key === "]"){ e.preventDefault(); moveLayerOrder(e.key === "]" ? 1 : -1); }
  else if (e.key === "ArrowLeft"){ e.preventDefault(); setBeat(S.beat - (e.shiftKey ? 1 : 0.25)); }
  else if (e.key === "ArrowRight"){ e.preventDefault(); setBeat(S.beat + (e.shiftKey ? 1 : 0.25)); }
});

const AUDIO_EXT = /\.(mp3|wav|ogg|oga|m4a|aac|flac|opus|weba|aiff?|wma)$/i;
const IMAGE_EXT = /\.(png|jpe?g|webp|gif|bmp|svg|avif|tiff?)$/i;
const MIDI_EXT = /\.(mid|midi)$/i;
const PROJ_EXT = /\.(rfz|zip)$/i;
function isAudioFile(f){ return !!((f.type && f.type.startsWith("audio/")) || AUDIO_EXT.test(f.name || "")); }
function isImageFile(f){ return !!((f.type && f.type.startsWith("image/")) || IMAGE_EXT.test(f.name || "")); }
function isMidiFile(f){ return !!((f.type && /midi/i.test(f.type)) || MIDI_EXT.test(f.name || "")); }
function isProjFile(f){ return !!((f.type && /zip/.test(f.type)) || PROJ_EXT.test(f.name || "")); }

  const images = files.filter(isImageFile);

let audioCtxShared = null;
function computeAudioPeaks(file){
  S.audioPeaks = null;
  S.audioPcm = null;
  waveKey = "";
  const AC = window.AudioContext || window.webkitAudioContext;
  if (!AC || !file || !file.arrayBuffer) return;
  file.arrayBuffer().then(buf => {
    if (!audioCtxShared) audioCtxShared = new AC();
    return audioCtxShared.decodeAudioData(buf);
  }).then(ab => {
    const perSec = 200;
    const n = Math.max(1, Math.ceil(ab.duration * perSec));
    const peaks = new Float32Array(n);
    const chs = [];
    for (let c = 0; c < Math.min(2, ab.numberOfChannels); c++) chs.push(ab.getChannelData(c));
    const step = ab.sampleRate / perSec;
    for (let i = 0; i < n; i++){
      const s0 = Math.floor(i * step), s1 = Math.min(ab.length, Math.floor((i + 1) * step));
      let mx = 0;
      for (const d of chs){
        for (let k = s0; k < s1; k += 2){
          const v = d[k] < 0 ? -d[k] : d[k];
          if (v > mx) mx = v;
        }
      }
      peaks[i] = mx;
    }
    S.audioPeaks = { data: peaks, perSec, dur: ab.duration };

    /* 再留一份 4kHz 单声道 PCM：BPM 检测和人声切分都要用它算自相关。
       4kHz 对 70–500Hz 的人声基频足够，内存只有原音频的 1/11。 */
    try {
      const rate = 4000;
      const ratio = ab.sampleRate / rate;
      const n2 = Math.max(1, Math.floor(ab.length / ratio));
      const pcm = new Float32Array(n2);
      const c0 = ab.getChannelData(0);
      const c1 = ab.numberOfChannels > 1 ? ab.getChannelData(1) : null;
      for (let i = 0; i < n2; i++){
        const s = Math.floor(i * ratio);
        pcm[i] = c1 ? (c0[s] + c1[s]) * 0.5 : c0[s];
      }
      S.audioPcm = { data: pcm, rate, dur: ab.duration };
    } catch(e){ S.audioPcm = null; }

    waveKey = "";
    drawTimeline();
  }).catch(() => { S.audioPeaks = null; S.audioPcm = null; drawTimeline(); });
}

/* ---------- BPM 自动检测 ----------
 * 对能量包络做差分得到 onset 强度，再自相关找主周期。
 * 自相关容易落到半拍/双拍上，所以把结果折进 70–170 再四舍五入。 */
function detectBpm(){
  const pk = S.audioPeaks;
  if (!pk || !pk.data) return toast("先导入音乐");
  const d = pk.data, fps = pk.perSec, n = d.length;
  if (n < fps * 2) return toast("音频太短，检测不出来");

  const onset = new Float32Array(n);
  let sum = 0;
  for (let i = 1; i < n; i++){
    const v = d[i] - d[i - 1];
    const pos = v > 0 ? v : 0;
    onset[i] = pos;
    sum += pos;
  }
  const mean = sum / Math.max(1, n);
  for (let i = 0; i < n; i++) onset[i] = Math.max(0, onset[i] - mean * 0.6);

  const lagMin = Math.max(2, Math.round(fps * 60 / 200));
  const lagMax = Math.min(n - 2, Math.round(fps * 60 / 50));
  if (lagMax <= lagMin) return toast("音频太短，检测不出来");

  let bestLag = 0, bestScore = -1;
  const scores = new Float32Array(lagMax + 2);
  for (let lag = lagMin; lag <= lagMax; lag++){
    let s = 0, c = 0;
    for (let i = 0; i + lag < n; i++){ s += onset[i] * onset[i + lag]; c++; }
    const sc = c ? s / c : 0;
    scores[lag] = sc;
    if (sc > bestScore){ bestScore = sc; bestLag = lag; }
  }
  if (!bestLag || bestScore <= 0) return toast("没听出明显节奏");

  /* 抛物线插值，把周期细化到小数帧 */
  let lagF = bestLag;
  const y0 = scores[bestLag - 1] || 0, y1 = scores[bestLag], y2 = scores[bestLag + 1] || 0;
  const den = y0 - 2 * y1 + y2;
  if (Math.abs(den) > 1e-9) lagF = bestLag + 0.5 * (y0 - y2) / den;

  let bpm = 60 * fps / lagF;
  while (bpm < 70) bpm *= 2;
  while (bpm > 170) bpm /= 2;
  bpm = clamp(Math.round(bpm), 40, 240);

  pushUndo();
  S.bpm = bpm;
  renderAll();
  toast("检测到 BPM ≈ " + bpm);
}

/* ---------- 人声 → MIDI ----------
 * 没有做真正的声源分离，用的是「能量 + 基频置信度」：
 *   1. 每 10ms 一帧算 RMS 和自相关基频
 *   2. 能量高于自适应阈值 = 有声，连续有声段合成一个音节（允许 30ms 的气口）
 *   3. 每个音节取置信度最高那半段帧的基频 → MIDI 音高
 * 结果直接写成 S.midi，再点「按 MIDI 映射」就能让贴图跟着人声切。 */
function vocalToMidi(){
  const pcm = S.audioPcm;
  if (!pcm || !pcm.data) return toast("先导入音乐，等解码完成再试");
  const sr = pcm.rate, d = pcm.data, n = d.length;

  const hop = Math.round(sr * 0.01);
  const win = Math.round(sr * 0.04);
  const frames = Math.floor((n - win) / hop);
  if (frames < 20) return toast("音频太短");

  const minLag = Math.max(2, Math.floor(sr / 500));
  const maxLag = Math.min(win - 2, Math.floor(sr / 70));

  const rms = new Float32Array(frames);
  const f0 = new Float32Array(frames);
  const conf = new Float32Array(frames);

  for (let f = 0; f < frames; f++){
    const s0 = f * hop;
    let e = 0;
    for (let i = 0; i < win; i++){ const v = d[s0 + i]; e += v * v; }
    rms[f] = Math.sqrt(e / win);
    if (e < 1e-8) continue;
    let best = 0, bestL = 0;
    for (let lag = minLag; lag <= maxLag; lag++){
      let s = 0;
      for (let i = 0; i < win - lag; i++) s += d[s0 + i] * d[s0 + i + lag];
      const v = s / e;
      if (v > best){ best = v; bestL = lag; }
    }
    conf[f] = best;
    f0[f] = bestL ? sr / bestL : 0;
  }

  /* 自适应阈值：取 90 分位能量的 22%，再设一个地板，避免整段静音时误判 */
  const sorted = Array.from(rms).sort((a, b) => a - b);
  const p90 = sorted[Math.min(sorted.length - 1, Math.floor(sorted.length * 0.9))] || 0;
  const thr = Math.max(0.008, p90 * 0.22);

  const segs = [];
  let cur = null, gap = 0;
  for (let f = 0; f < frames; f++){
    if (rms[f] > thr){
      if (!cur) cur = { a: f, b: f };
      else cur.b = f;
      gap = 0;
    } else if (cur){
      if (++gap > 3){ segs.push(cur); cur = null; gap = 0; }
    }
  }
  if (cur) segs.push(cur);

  const minFrames = 5;   /* 50ms 以下当噪声丢掉 */
  const picked = [];
  for (const sg of segs){
    if (sg.b - sg.a + 1 < minFrames) continue;
    const idx = [];
    for (let f = sg.a; f <= sg.b; f++)
      if (conf[f] > 0.25 && f0[f] > 60 && f0[f] < 1000) idx.push(f);
    let hz = 0;
    if (idx.length){
      idx.sort((x, y) => conf[y] - conf[x]);
      const take = idx.slice(0, Math.max(1, Math.floor(idx.length / 2)));
      hz = take.reduce((s, f) => s + f0[f], 0) / take.length;
    }
    const pitch = hz > 0 ? Math.round(69 + 12 * Math.log2(hz / 440)) : 60;
    picked.push({
      t0: sg.a * hop / sr,
      t1: (sg.b * hop + win) / sr,
      pitch: clamp(pitch, 24, 96)
    });
  }

  if (!picked.length) return toast("没切出音节，换一首人声更突出的试试");

  const bps = S.bpm / 60;
  const notes = picked.map(nt => ({
    t: Math.max(0, audioBeatAtSec(nt.t0)),
    d: Math.max(0.05, (nt.t1 - nt.t0) * bps),
    pitch: nt.pitch,
    vel: 90,
    ch: 0
  })).sort((a, b) => a.t - b.t);

  const endBeat = notes.reduce((m, x) => Math.max(m, x.t + x.d), 0);
  pushUndo();
  S.midi = {
    name: "人声切分",
    ppq: 480,
    tempoBpm: S.bpm,
    durBeat: endBeat,
    notes,
    pitches: [...new Set(notes.map(x => x.pitch))].sort((a, b) => b - a),
    chans: [0]
  };
  /* v2：切完直接铺到当前图层，不用再点一次「按 MIDI 映射」 */
  const np = notesPart();
  let laid = 0;
  if (np && np.kind !== "text" && np.variants.length >= 2){
    np.notes = midiToNotes(np, notes);
    bakeNotes();
    laid = np.notes.length;
  }
  S.prScroll = 0;
  setPrOpen(true);
  renderAll(); syncMidiUI(true);
  toast("切出 " + notes.length + " 个音节" +
        (laid ? "，已铺到「" + np.slot + "」" : "，选中一个多贴图图层后点「按 MIDI 映射」"));
}

function loadAudioFile(f){
  try {
    S.audio = new Audio(URL.createObjectURL(f));
    computeAudioPeaks(f);
    /* 换文件先回到「完整、从 0 拍开始」；工程导入会在随后覆盖这三个值 */
    S.audioStart = 0; S.audioIn = 0; S.audioOut = 0; S.audioOffset = 0;
    S.audio.onloadedmetadata = () => {
      S.audioDur = S.audio.duration || 0;
      if (S.audioOut > S.audioDur) S.audioOut = S.audioDur;
      if (S.audioIn > S.audioDur - 0.08) S.audioIn = 0;
      drawTimeline(); updateTime(); renderInspector();
    };
    S.audio.onerror = () => toast("这个音频格式浏览器无法解码");
    S.audioName = f.name || "音频";
    toast("已导入音乐：" + (f.name || "").slice(0, 24));
  } catch(err){
    toast("音频导入失败");
  }
}

/* ============================ 视频导出 ============================ */
function tick(){ return new Promise(r => setTimeout(r, 0)); }

function projectEndBeat(){
  const lastKey = S.parts.reduce((m, p) => p.keys.reduce((mm, k) => Math.max(mm, k.t), m), 0);
  const lastCue = S.cues.reduce((m, c) => Math.max(m, c), 0);
  const clipEnd = S.clips.reduce((m, c) => Math.max(m, c.start + c.dur), 0);
  const midiEnd = S.midi ? (S.midi.durBeat || 0) : 0;
  return Math.max(lastKey, lastCue, clipEnd, midiEnd, S.sig);
}
function projectDuration(){
  return S.audio && S.audioDur > 0 ? S.audioDur : projectEndBeat() * 60 / S.bpm;
}

function renderExportFrame(g, W, H, scale){

  S.view = { scale, ox: 0, oy: 0 };
  g.setTransform(1, 0, 0, 1, 0, 0);
  g.fillStyle = "#000";
  g.fillRect(0, 0, W, H);
  drawBackground(g, true);
  drawParts(g, W, H, 1);
  S.view = old;
}

/* ---- EBML / WebM ---- */
function ebCat(list){
  let len = 0;
  for (const b of list) len += b.length;
  const out = new Uint8Array(len);
  let o = 0;
  for (const b of list){ out.set(b, o); o += b.length; }
  return out;
}
function ebSize(n){
  let len = 1;
  while (len < 8 && n >= Math.pow(2, 7 * len) - 1) len++;
  const b = new Uint8Array(len);
  let v = n;
  for (let i = len - 1; i >= 0; i--){ b[i] = v & 0xff; v = Math.floor(v / 256); }
  b[0] |= 0x80 >> (len - 1);
  return b;
}
function ebEl(id, payload){
  return ebCat([new Uint8Array(id), ebSize(payload.length), payload]);
}
function ebUint(id, val){
  const bytes = [];
  let v = Math.max(0, Math.floor(val));
  do { bytes.unshift(v & 0xff); v = Math.floor(v / 256); } while (v > 0);
  return ebEl(id, new Uint8Array(bytes));
}
function ebFloat(id, val){
  const b = new Uint8Array(8);
  new DataView(b.buffer).setFloat64(0, val);
  return ebEl(id, b);
}
function ebStr(id, s){
  return ebEl(id, new TextEncoder().encode(s));
}
function opusHead(ch, sr, preSkip){
  const b = new Uint8Array(19);
  b.set([0x4F, 0x70, 0x75, 0x73, 0x48, 0x65, 0x61, 0x64], 0);
  b[8] = 1; b[9] = ch;
  b[10] = preSkip & 0xff; b[11] = (preSkip >> 8) & 0xff;
  b[12] = sr & 0xff; b[13] = (sr >> 8) & 0xff; b[14] = (sr >> 16) & 0xff; b[15] = (sr >> 24) & 0xff;
  b[16] = 0; b[17] = 0; b[18] = 0;
  return b;
}

function buildWebM(o){
  const ebml = ebEl([0x1A,0x45,0xDF,0xA3], ebCat([
    ebUint([0x42,0x86], 1),
    ebUint([0x42,0xF7], 1),
    ebUint([0x42,0xF2], 4),
    ebUint([0x42,0xF3], 8),
    ebStr([0x42,0x82], "webm"),
    ebUint([0x42,0x87], 4),
    ebUint([0x42,0x85], 2)
  ]));

  const info = ebEl([0x15,0x49,0xA9,0x66], ebCat([
    ebUint([0x2A,0xD7,0xB1], 1000000),
    ebStr([0x4D,0x80], "rigframe"),
    ebStr([0x57,0x41], "rigframe"),
    ebFloat([0x44,0x89], o.durationMs)
  ]));

  const vTrack = ebEl([0xAE], ebCat([
    ebUint([0xD7], 1),
    ebUint([0x73,0xC5], 1),
    ebUint([0x83], 1),
    ebUint([0x23,0xE3,0x83], Math.round(1e9 / o.fps)),
    ebStr([0x86], o.vCodecId),
    ebEl([0xE0], ebCat([ebUint([0xB0], o.width), ebUint([0xBA], o.height)]))
  ]));

  const trackEntries = [vTrack];
  if (o.hasAudio){
    trackEntries.push(ebEl([0xAE], ebCat([
      ebUint([0xD7], 2),
      ebUint([0x73,0xC5], 2),
      ebUint([0x83], 2),
      ebStr([0x86], "A_OPUS"),
      ebEl([0x63,0xA2], opusHead(2, 48000, 312)),
      ebEl([0xE1], ebCat([ebFloat([0xB5], 48000), ebUint([0x9F], 2)]))
    ])));
  }
  const tracks = ebEl([0x16,0x54,0xAE,0x6B], ebCat(trackEntries));

  const blocks = [];
  o.video.forEach(c => blocks.push({ ts: Math.round(c.ts / 1000), track: 1, data: c.data, key: !!c.key }));
  if (o.hasAudio) o.audio.forEach(c => blocks.push({ ts: Math.round(c.ts / 1000), track: 2, data: c.data, key: true }));
  blocks.sort((a, b) => a.ts - b.ts || a.track - b.track);

  const clusters = [];
  let cur = null;
  for (const b of blocks){
    const needNew = !cur || (b.ts - cur.ts) > 1000 || (b.track === 1 && b.key && b.ts > cur.ts && cur.blocks.length);
    if (needNew){
      if (cur) clusters.push(cur);
      cur = { ts: b.ts, blocks: [] };
    }
    cur.blocks.push(b);
  }
  if (cur) clusters.push(cur);

  const clusterEls = clusters.map(c => {
    const parts = [ebUint([0xE7], c.ts)];
    for (const b of c.blocks){
      const rel = b.ts - c.ts;
      const hdr = new Uint8Array(4);
      hdr[0] = 0x80 | b.track;
      hdr[1] = (rel >> 8) & 0xff;
      hdr[2] = rel & 0xff;
      hdr[3] = b.key ? 0x80 : 0x00;
      parts.push(ebEl([0xA3], ebCat([hdr, b.data])));
    }
    return ebEl([0x1F,0x43,0xB6,0x75], ebCat(parts));
  });

  const segment = ebEl([0x18,0x53,0x80,0x67], ebCat([info, tracks].concat(clusterEls)));
  return ebCat([ebml, segment]);
}

async function encodeAudioOpus(onProgress, start, dur, alignTo){
  if (!S.audio || !S.audioDur) return null;
  const res = await fetch(S.audio.src);
  const raw = await res.arrayBuffer();
  const ac = new AudioContext();
  const buf = await ac.decodeAudioData(raw);
  await ac.close();

  const SR = 48000;
  const ch = Math.min(2, buf.numberOfChannels);
  const off = new OfflineAudioContext(2, Math.ceil(buf.duration * SR), SR);
  const src = off.createBufferSource();
  src.buffer = buf;
  src.connect(off.destination);
  src.start();
  const rendered = await off.startRendering();
  const L = rendered.getChannelData(0);
  const R = rendered.numberOfChannels > 1 ? rendered.getChannelData(1) : L;
  const from = Math.max(0, Math.floor((start || 0) * SR));
  const want = Math.max(0, Math.floor((dur || rendered.duration) * SR));

  const chunks = [];
  const enc = new AudioEncoder({
    output: (chunk) => {
      const d = new Uint8Array(chunk.byteLength);
      chunk.copyTo(d);
      chunks.push({ ts: chunk.timestamp, data: d });
    },
    error: (e) => { console.warn("audio encode", e); }
  });
  await enc.configure({ codec: "opus", sampleRate: SR, numberOfChannels: 2, bitrate: 128000 });

  const N = 960;
  const total = Math.max(0, Math.min(rendered.length - from, want));
  for (let i = 0; i < total; i += N){
    const n = Math.min(N, total - i);
    const src = from + i;
    const data = new Float32Array(n * 2);
    data.set(L.subarray(src, src + n), 0);
    data.set(R.subarray(src, src + n), n);
    const ad = new AudioData({
      format: "f32-planar", sampleRate: SR, numberOfFrames: n, numberOfChannels: 2,
      timestamp: Math.round(i / SR * 1e6), data
    });
    enc.encode(ad);
    ad.close();
    if (i % (N * 40) === 0){ if (onProgress) onProgress(i / total * 0.25); await tick(); }
  }
  await enc.flush();
  enc.close();
  let out = chunks;
  if (out.length){
    const t0 = out[0].ts;
    if (t0 > 0) out.forEach(c => { c.ts -= t0; });
  }
  /* alignTo：源里对应「导出起点」的那个时刻，用来把音频对齐到输出时间轴 */
  const alignUs = Math.round((alignTo || 0) * 1e6);
  if (alignUs !== 0){
    out.forEach(c => { c.ts -= alignUs; });
    out = out.filter(c => c.ts >= 0);
  }
  return out;
}

async function exportVideo(opts, onProgress, onStatus){
  const W = Math.round(S.doc.w * opts.scale);
  const H = Math.round(S.doc.h * opts.scale);
  if (W < 16 || H < 16) throw new Error("画布尺寸太小");
  const w = W - (W % 2), h = H - (H % 2);
  const scale = opts.scale;

  const canvas = document.createElement("canvas");
  canvas.width = w; canvas.height = h;
  const g = canvas.getContext("2d");

  let vCodec = "vp09.00.10.08", vCodecId = "V_VP9";
  let supported = false;
  try {
    const s = await VideoEncoder.isConfigSupported({ codec: vCodec, width: w, height: h, bitrate: opts.bitrate, framerate: opts.fps });
    supported = !!(s && s.supported);
  } catch(e){ supported = false; }
  if (!supported){
    vCodec = "vp8"; vCodecId = "V_VP8";
    const s2 = await VideoEncoder.isConfigSupported({ codec: vCodec, width: w, height: h, bitrate: opts.bitrate, framerate: opts.fps });
    if (!s2 || !s2.supported) throw new Error("浏览器不支持 WebCodecs 视频编码");
  }

  onStatus && onStatus("编码音频…");
  let audioChunks = null;
  /* 音频片段：把时间轴区间映射到源文件的入点/出点区间 */
  const aStartSec = (S.audioStart || 0) * 60 / S.bpm;
  const aWant0 = (S.audioIn || 0) + ((opts.start || 0) - aStartSec);
  const aLo = Math.max(aWant0, S.audioIn || 0);
  const aHi = Math.min(aWant0 + (opts.duration || 0), audioOutSec());
  try {
    if (S.audio && aHi > aLo + 0.001) audioChunks = await encodeAudioOpus(onProgress, aLo, aHi - aLo, aWant0);
  } catch(e){ console.warn(e); }

  onStatus && onStatus("编码画面…");
  const videoChunks = [];
  const venc = new VideoEncoder({
    output: (chunk) => {
      const d = new Uint8Array(chunk.byteLength);
      chunk.copyTo(d);
      videoChunks.push({ ts: chunk.timestamp, data: d, key: chunk.type === "key" });
    },
    error: (e) => { console.warn("video encode", e); }
  });
  await venc.configure({ codec: vCodec, width: w, height: h, bitrate: opts.bitrate, framerate: opts.fps, latencyMode: "quality" });

  const dur = opts.duration;
  const frames = Math.max(1, Math.round(dur * opts.fps));
  const gop = Math.max(1, Math.round(opts.fps * 2));
  const savedBeat = S.beat;

  for (let i = 0; i < frames; i++){
    const t = i / opts.fps;
    applyAt(((opts.start || 0) + t) * S.bpm / 60);
    renderExportFrame(g, w, h, scale);
    const vf = new VideoFrame(canvas, {
      timestamp: Math.round(t * 1e6),
      duration: Math.round(1e6 / opts.fps)
    });
    venc.encode(vf, { keyFrame: i % gop === 0 });
    vf.close();
    if (i % 4 === 0){
      onProgress && onProgress(0.25 + (i / frames) * 0.65);
      await tick();
    }
  }
  await venc.flush();
  venc.close();

  applyAt(savedBeat);
  onStatus && onStatus("封装文件…");
  const bytes = buildWebM({
    width: w, height: h, fps: opts.fps,
    vCodecId, durationMs: Math.round(dur * 1000),
    video: videoChunks,
    audio: audioChunks || [],
    hasAudio: !!(audioChunks && audioChunks.length)
  });
  onProgress && onProgress(1);
  return new Blob([bytes], { type: "video/webm" });
}

async function doExport(){
  const fps = +document.getElementById("expFps").value;
  const scale = +document.getElementById("expScale").value;
  const okBtn = document.getElementById("expOk");
  const bar = document.getElementById("expBar");
  const st = document.getElementById("expStatus");
  const total = projectDuration();
  let start = Math.max(0, +document.getElementById("expStart").value || 0);
  let end = Math.min(total, +document.getElementById("expEnd").value || total);
  if (end <= start + 0.05){ end = total; start = 0; }
  okBtn.disabled = true;

  try {
    /* 导出前把所有文字图层的字体拉齐，否则渲染出来会 fallback 成系统字体 */
    const tf = [...new Set(S.parts.filter(q => q.kind === "text" && q.text).map(q => q.text.font))];
    if (tf.length){
      st.textContent = "准备字体…";
      await Promise.all(tf.map(ensureFont));
      try { await document.fonts.ready; } catch(e){}
      for (const q of S.parts) if (q.kind === "text") refreshTextLayer(q);
    }
    const blob = await exportVideo(
      { fps, scale, duration: end - start, start, end,
        bitrate: Math.round(S.doc.w * S.doc.h * scale * scale * 0.12) },
      p => { bar.style.width = Math.round(p * 100) + "%"; },
      s => { st.textContent = s; }
    );
    if (window.rigframeAPI && window.rigframeAPI.saveVideo){
      const fmtEl = document.getElementById("expFmt");
      const fmt = fmtEl ? fmtEl.value : "webm";
      st.textContent = fmt === "mp4" ? "正在转 MP4（H.264）…" : "正在保存…";
      const buf = new Uint8Array(await blob.arrayBuffer());
      const r = await window.rigframeAPI.saveVideo(buf, fmt, "rigframe-" + Date.now().toString(36));
      bar.style.width = "100%";
      okBtn.disabled = false;
      if (r && r.ok){
        st.textContent = "完成：" + fmt.toUpperCase() + " · " + (blob.size / 1048576).toFixed(2) + " MB";
        toast("已导出：" + r.path);
        setTimeout(() => document.getElementById("expModal").classList.remove("show"), 900);
      } else {
        st.textContent = "已取消";
      }
      return;
    }
    const name = "rigframe-" + Date.now().toString(36) + ".webm";
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = name;
    a.click();
    setTimeout(() => URL.revokeObjectURL(a.href), 4000);
    st.textContent = "完成：" + (blob.size / 1048576).toFixed(2) + " MB";
    bar.style.width = "100%";
    okBtn.disabled = false;
    setTimeout(() => document.getElementById("expModal").classList.remove("show"), 900);
    toast("已导出 " + name);
  } catch(e){
    console.error(e);
    st.textContent = "导出失败：" + (e && e.message ? e.message : e);
    okBtn.disabled = false;
  }
}

/* ============================ 自动保存 ============================ */
/* 每 60 秒把工程打包一份快照。桌面端写到 userData/autosave（主进程落盘），
   浏览器端退化成 localStorage。下次启动如果发现快照，就问要不要恢复。 */
const AUTOSAVE_MS = 60 * 1000;
const AUTOSAVE_LS = "rigframe.autosave";

let docTitleName = "";
let gotProjectPush = false;
function setDirtyTitle(){
  document.title = (S.dirty ? "• " : "") + "Rigframe" + (docTitleName ? " · " + docTitleName : "");
}

const AutoStore = {
  get disk(){ return !!(window.rigframeAPI && window.rigframeAPI.autosave); },
  async info(){
    if (this.disk){
      try { return await window.rigframeAPI.autosave.info(); } catch(e){ return null; }
    }
    try {
      const raw = localStorage.getItem(AUTOSAVE_LS + ".meta");
      if (!raw || !localStorage.getItem(AUTOSAVE_LS)) return null;
      return JSON.parse(raw);
    } catch(e){ return null; }
  },
  async write(bytes, meta){
    if (this.disk){
      const r = await window.rigframeAPI.autosave.write(bytes, meta);
      if (!r || !r.ok) throw new Error((r && r.error) || "写入失败");
      return true;
    }
    if (bytes.length > 2.4 * 1024 * 1024) throw new Error("工程超过 2.4MB，浏览器版跳过自动保存");
    let bin = "";
    const CH = 0x8000;
    for (let i = 0; i < bytes.length; i += CH){
      bin += String.fromCharCode.apply(null, bytes.subarray(i, Math.min(bytes.length, i + CH)));
    }
    localStorage.setItem(AUTOSAVE_LS, btoa(bin));
    localStorage.setItem(AUTOSAVE_LS + ".meta", JSON.stringify(meta));
    return true;
  },
  async read(){
    if (this.disk) return window.rigframeAPI.autosave.read();
    const b64 = localStorage.getItem(AUTOSAVE_LS);
    if (!b64) return null;
    const bin = atob(b64);
    const u8 = new Uint8Array(bin.length);
    for (let i = 0; i < bin.length; i++) u8[i] = bin.charCodeAt(i);
    let meta = {};
    try { meta = JSON.parse(localStorage.getItem(AUTOSAVE_LS + ".meta") || "{}"); } catch(e){}
    return { data: u8, meta };
  },
  async clear(){
    if (this.disk){ try { await window.rigframeAPI.autosave.clear(); } catch(e){} return; }
    try {
      localStorage.removeItem(AUTOSAVE_LS);
      localStorage.removeItem(AUTOSAVE_LS + ".meta");
    } catch(e){}
  }
};

function markDirty(){
  if (S.dirty) return;
  S.dirty = true;
  setDirtyTitle();
}
function markClean(){
  S.dirty = false;
  setDirtyTitle();
}

let autoSaveBusy = false;
async function autoSaveTick(force){
  if (autoSaveBusy) return false;
  if (!S.parts.length) return false;
  if (!force && !S.dirty) return false;
  const em = document.getElementById("expModal");
  if (em && em.classList.contains("show")) return false;   // 导出中不抢资源
  autoSaveBusy = true;
  try {
    const { data, files } = await packProject();
    files.unshift({ name: "project.json", data: new TextEncoder().encode(JSON.stringify(data)) });
    const zip = zipBuild(files);
    await AutoStore.write(zip, {
      at: Date.now(), parts: S.parts.length, size: zip.length,
      name: docTitleName || "未命名"
    });
    markClean();
    return true;
  } catch(e){
    console.warn("自动保存失败：", e && e.message ? e.message : e);
    return false;
  } finally {
    autoSaveBusy = false;
  }
}
setInterval(() => { autoSaveTick(false); }, AUTOSAVE_MS);

function fmtAgo(ts){
  const d = Math.max(0, Date.now() - ts);
  const m = Math.floor(d / 60000);
  if (m < 1) return "刚刚";
  if (m < 60) return m + " 分钟前";
  const h = Math.floor(m / 60);
  if (h < 24) return h + " 小时前";
  return Math.floor(h / 24) + " 天前";
}

async function checkAutoSave(){
  let info = null;
  try { info = await AutoStore.info(); } catch(e){ return; }
  if (!info || !info.at) return;
  const box = document.getElementById("recoverModal");
  const el = document.getElementById("recoverInfo");
  if (!box || !el) return;
  el.innerHTML =
    "上次退出时有 <b style=\"color:var(--text)\">" + (info.parts || "?") + "</b> 个图层没有保存。<br>" +
    "自动保存于 " + fmtAgo(info.at) + "（" + new Date(info.at).toLocaleString() + "）" +
    (info.size ? "<br>快照大小 " + (info.size / 1024 / 1024).toFixed(2) + " MB" : "") +
    "<br><br>恢复后建议马上「另存为」存到磁盘。";
  box.classList.add("show");
}

/* 启动时查一次：有快照就问要不要恢复。启动器推工程过来的情况由启动器处理 */
setTimeout(() => {

  checkAutoSave();
}, 1200);

document.getElementById("recoverLoad").onclick = async () => {

    await importProject(new File([got.data], "自动保存.rfz", { type: "application/zip" }));
    /* importProject 会清掉快照，这里立刻重写一份，避免刚恢复又崩 */
    S.dirty = true;
    await autoSaveTick(true);

    toast("恢复失败：" + (e && e.message ? e.message : e));
